    view.innerHTML = pageHeader({ title: proj ? (preset?.newVersionOf ? `Nouvelle version — ${proj.project_name}` : 'Modifier le projet') : 'Nouveau projet client', sub: 'Informations du one-pager',
      crumbs: [{ page: 'projects', label: 'Projets' }, { label: proj ? proj.project_name : 'Nouveau' }],
      actions: `<button class="btn btn-ghost" data-action="${proj ? 'open-project' : 'go'}" data-page="projects" data-id="${esc(proj?.id || '')}">Annuler</button><button class="btn btn-primary" data-action="save-project">Enregistrer</button>` }) +
      `<div class="page-body stack" id="projectForm">${people}<input type="hidden" id="f_pid" value="${esc(proj?.id || '')}">
        <section class="card solid card-pad"><h2 class="section-title">Informations générales</h2><div class="form-grid">
          ${f('f_client', 'Nom du client <span class="req">*</span>', p?.client_name, 'text', 'placeholder="ex : Herbalife"')}
          ${f('f_project', 'Nom du projet <span class="req">*</span>', p?.project_name, 'text', 'placeholder="ex : Lancement produit X" aria-describedby="err_f_project"')}
          ${f('f_version', 'Version', p?.version || 'v1')}${f('f_vdate', 'Date de version', p?.version_date, 'date')}
          ${f('f_start', 'Date de début', p?.start_date, 'date')}${f('f_launch', 'Date de lancement', p?.launch_date, 'date')}
          <div class="field"><label class="label" for="f_status">Statut</label><select class="select" id="f_status">${UI.options(Object.entries(CONFIG.projectStatuses).map(([v, s]) => ({ value: v, label: s.label })), p?.status || 'active')}</select></div>
          <div class="field"><label class="label" for="f_priority">Priorité</label><select class="select" id="f_priority">${UI.options(Object.entries(CONFIG.projectPriorities).map(([v, l]) => ({ value: v, label: l })), String(p?.priority || 1))}</select></div>
        </div><span class="error-msg" id="err_f_project"></span></section>
        <section class="card solid card-pad"><h2 class="section-title">Équipe projet</h2><div class="form-grid">
          ${f('f_lead', 'Project Lead', od.lead, 'text', 'list="peopleList" placeholder="Nom du chef de projet"')}${f('f_ops', 'Opérations', od.operations, 'text', 'list="peopleList"')}
          ${f('f_tech', 'Technique', od.technique, 'text', 'list="peopleList"')}${f('f_sales', 'Sales', od.sales, 'text', 'list="peopleList"')}
          ${f('f_supply', 'Supply Chain', od.supply_chain, 'text', 'list="peopleList"')}${f('f_finance', 'Finance', od.finance, 'text', 'list="peopleList"')}
        </div></section>
        <section class="card solid card-pad"><h2 class="section-title">Timeline du projet</h2>
          <div class="row wrap mb-4"><span class="label">Phase 2 :</span>
            <label class="option-card"><input type="radio" name="industrial_test" id="tlIndustrialTest" value="with" checked data-change="tl-template">Avec test industriel <span class="muted small">(56 j)</span></label>
            <label class="option-card"><input type="radio" name="industrial_test" id="tlNoIndustrialTest" value="without" data-change="tl-template">Sans test industriel <span class="muted small">(14 j)</span></label>
            <span class="spacer grow"></span><span class="badge b-space no-dot" id="tlTotalDays"></span></div>
          <div class="tl-head"><span>Étape</span><span>Semaine</span><span>%</span><span>Durée (j)</span><span>Statut</span><span></span></div>
          <div id="tlSteps"></div>
          <div class="row mt-4"><button class="btn btn-glass btn-sm" data-action="tl-add">${icon('plus', 'sm')}Étape personnalisée</button><span class="grow"></span><button class="btn btn-ghost btn-sm" data-action="tl-reset">Réinitialiser le modèle</button></div>
        </section>
        <section class="card solid card-pad"><h2 class="section-title">Finance</h2><div class="form-grid">
          ${f('f_fr', 'Revenue forecast (k€)', p?.forecast_revenue, 'number', 'placeholder="700"')}${f('f_br', 'Revenue budget (k€)', p?.budget_revenue, 'number', 'placeholder="480"')}
          ${f('f_fm', 'Marge forecast (%)', p?.forecast_margin, 'number', 'placeholder="32"')}${f('f_bm', 'Marge budget (%)', p?.budget_margin, 'number', 'placeholder="28"')}
        </div></section>
        <div class="grid g2"><section class="card solid card-pad"><h2 class="section-title"><label for="f_risks">Risques</label></h2><textarea class="textarea" id="f_risks" rows="5" placeholder="1. Risque principal">${esc(p?.risks || '')}</textarea></section>
          <section class="card solid card-pad"><h2 class="section-title"><label for="f_actions">Actions</label></h2><textarea class="textarea" id="f_actions" rows="5" placeholder="1. Action en cours">${esc(p?.actions || '')}</textarea></section></div>
      </div>`;
    const steps = p?.timeline_steps || [];
    // Les étapes reconnues reprennent le libellé du modèle (accents corrigés) ; les étapes personnalisées restent telles quelles.
    if (steps.length) { Timeline.enrich(steps).forEach(s => ProjectForm.addStep(s.label, s.week, s.prog, s.status, s.days || 0, s.phase || '')); ProjectForm.updateTotal(); }
    else ProjectForm.applyTemplate(true);
    document.getElementById('f_start').addEventListener('change', ProjectForm.autoWeeks);
    document.getElementById('tlSteps').addEventListener('input', e => { if (e.target.classList.contains('tl-days')) ProjectForm.updateTotal(); });
  },
  applyTemplate(withTest) {
    document.getElementById('tlSteps').innerHTML = '';
    Timeline.template(withTest).forEach(s => ProjectForm.addStep(s.name, '', 0, 'upcoming', s.days, s.phase));
    ProjectForm.updateTotal(); ProjectForm.autoWeeks();
  },
  addStep(name = '', week = '', prog = 0, status = 'upcoming', days = 0, phase = '') {
    const row = document.createElement('div');
    row.className = 'tl-step' + (Timeline.isGate(name) ? ' is-gate' : ''); row.dataset.phase = phase || '';
    const opts = [['done', 'Terminé'], ['current', 'En cours'], ['warning', 'À risque'], ['upcoming', 'À venir']];
    const ph = CONFIG.phases.find(x => x.id === phase);
    row.innerHTML = `<div class="tl-name-cell"><span class="tl-mark">${Timeline.isGate(name) ? '<span class="gate-mark" title="Gate"></span><span class="sr-only">Gate</span>' : ''}</span><input class="input input-sm tl-name" value="${esc(name)}" placeholder="Nom de l'étape" aria-label="Nom de l'étape">${ph ? `<span class="tl-phase">${esc(ph.id)}</span>` : ''}</div>
      <input class="input input-sm tl-week" value="${esc(week)}" placeholder="S6" aria-label="Semaine">
      <input class="input input-sm tl-prog" type="number" min="0" max="100" value="${Number(prog) || 0}" aria-label="Avancement en %">
      <input class="input input-sm tl-days" type="number" min="0" value="${Number(days) || 0}" aria-label="Durée en jours">
      <select class="select input-sm tl-status" aria-label="Statut de l'étape">${opts.map(([v, l]) => `<option value="${v}" ${status === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <button class="btn btn-ghost btn-sm btn-icon" data-action="tl-remove" aria-label="Supprimer l'étape">${icon('x', 'sm')}</button>`;
    document.getElementById('tlSteps').appendChild(row);
  },
  updateTotal() {
    let total = 0; document.querySelectorAll('.tl-step .tl-days').forEach(i => { total += parseInt(i.value || 0, 10) || 0; });
    const el = document.getElementById('tlTotalDays'); if (el) el.textContent = `${total} jours au total`;
  },
  /** Numéro de semaine cumulé (5 jours ouvrés par semaine) à partir de la date de début. */
  autoWeeks() {
    if (!document.getElementById('f_start')?.value) return;
    let cumul = 0;
    document.querySelectorAll('.tl-step').forEach(row => { cumul += parseInt(row.querySelector('.tl-days')?.value, 10) || 0; row.querySelector('.tl-week').value = 'S' + Math.ceil(cumul / 5); });
  },
  steps() {
    return [...document.querySelectorAll('.tl-step')].map(r => ({ name: r.querySelector('.tl-name').value, week: r.querySelector('.tl-week').value,
      prog: parseInt(r.querySelector('.tl-prog').value, 10) || 0, days: parseInt(r.querySelector('.tl-days').value, 10) || 0,
      status: r.querySelector('.tl-status').value, phase: r.dataset.phase || '' }));
  },
  async save() {
    const name = document.getElementById('f_project').value.trim();
    const err = document.getElementById('err_f_project'); err.textContent = '';
    if (!name) { err.textContent = 'Le nom du projet est obligatoire.'; document.getElementById('f_project').setAttribute('aria-invalid', 'true'); document.getElementById('f_project').focus(); return; }
    const existId = document.getElementById('f_pid').value;
    if (existId) {
      const { data: vers } = await Store.db.from('project_versions').select('id').eq('project_id', existId).limit(1);
      if (vers && vers.length) {
        Overlay.open(`<h2 class="modal-title">Enregistrer</h2><p class="muted">Ce projet a déjà une version enregistrée. Que souhaitez-vous faire ?</p>
          <div class="stack mt-4"><button class="btn btn-primary" style="width:100%;justify-content:flex-start;height:auto;padding:12px 16px" data-action="save-project-confirm" data-new="1"><span style="text-align:left"><b>Créer une nouvelle version</b><br><span class="small">L'ancienne version reste accessible</span></span></button>
          <button class="btn btn-glass" style="width:100%;justify-content:flex-start;height:auto;padding:12px 16px" data-action="save-project-confirm" data-new="0"><span style="text-align:left"><b>Mettre à jour la version actuelle</b><br><span class="small muted">Remplace les données existantes</span></span></button></div>
          <div class="modal-actions"><button class="btn btn-ghost" data-action="close-overlay">Annuler</button></div>`, { label: 'Enregistrer le projet' });
        return;
      }
    }
    ProjectForm.doSave();
  },
  async doSave() {
    Overlay.closeAll();
    const v = id => document.getElementById(id).value;
    const num = id => { const x = parseFloat(v(id)); return Number.isFinite(x) ? x : null; };
    const existId = v('f_pid');
    const payload = {
      client_name: v('f_client').trim() || null, project_name: v('f_project').trim(), version: v('f_version').trim() || 'v1',
      version_date: v('f_vdate') || null, start_date: v('f_start') || null, launch_date: v('f_launch') || null,
      status: v('f_status'), priority: parseInt(v('f_priority'), 10) || 1, risks: v('f_risks') || null, actions: v('f_actions') || null,
      forecast_revenue: num('f_fr'), budget_revenue: num('f_br'), forecast_margin: num('f_fm'), budget_margin: num('f_bm'),
      timeline_steps: ProjectForm.steps(),
      org_data: { lead: v('f_lead').trim(), operations: v('f_ops').trim(), technique: v('f_tech').trim(), sales: v('f_sales').trim(), supply_chain: v('f_supply').trim(), finance: v('f_finance').trim() },
      updated_at: new Date().toISOString(),
    };
    try {
      let projId = existId;
      if (existId) {
        if (!Store.projectIn('customer', existId)) throw new Error('Projet introuvable dans cet espace.');
        const { error } = await Store.db.from('projects').update(payload).eq('id', existId); if (error) throw error;
      } else {
        const { data, error } = await Store.db.from('projects').insert({ ...payload, created_by: Store.me?.id || null }).select().single(); if (error) throw error;
        projId = data.id;
      }
      await Store.db.from('project_versions').insert({ project_id: projId, version_number: payload.version, snapshot: payload, created_by: Store.me?.id || null });
      await Store.refreshTable('projects');
      Toast.show('Projet enregistré.');
      Router.go('customer', 'project', projId);
    } catch (err) { Toast.error(err); }
  },
};

  async save() {
    const v = id => document.getElementById(id).value.trim();
    const picked = g => [...document.querySelectorAll(`[data-group="${g}"][aria-pressed="true"]`)].map(b => b.dataset.value);
    ['err_q_name', 'err_q_end'].forEach(id => { document.getElementById(id).textContent = ''; });
    if (!v('q_name')) { document.getElementById('err_q_name').textContent = 'Le nom du projet est obligatoire.'; document.getElementById('q_name').focus(); return; }
    if (v('q_start') && v('q_end') && v('q_end') < v('q_start')) { document.getElementById('err_q_end').textContent = 'La date de fin doit suivre la date de début.'; document.getElementById('q_end').focus(); return; }
    const id = v('q_id');
    const payload = { project_name: v('q_name'), description: v('q_desc') || null, workspace: 'pdqa', status: v('q_status'), priority: parseInt(v('q_prio'), 10) || 2,

            <dt>Département</dt><dd>${esc(d.department || '—')}</dd>

/* ---------- Meeting Minutes ---------- */
const Meetings = {
  defaults: { project: '' },
  list(view) {
    const ws = App.ws, st = App.view('meetings', Meetings.defaults);
    const all = Store.meetingsIn(ws), list = all.filter(m => !st.project || m.project_id === st.project);

      `<div class="page-body"><div class="toolbar card"><select class="select" data-change="meetings-filter" aria-label="Filtrer par projet">${UI.projectOptions(ws, st.project, 'Tous les projets')}</select><span class="spacer"></span><span class="result-count">${list.length} compte(s)-rendu(s)</span></div>
      ${list.length ? list.map(m => {
        const p = Store.project(m.project_id), acts = (m.actions || []).length, parts = (m.participants || []).length;
        return `<div class="card meeting-card"><div class="date-box"><div class="d">${esc(Dates.fmt(m.meeting_date, { day: 'numeric' }))}</div><div class="m">${esc(Dates.fmt(m.meeting_date, { month: 'short' }))}</div></div>
          <div class="grow"><button class="link-btn" style="font-size:var(--fs-lg)" data-action="open-meeting" data-id="${esc(m.id)}">${esc(m.team_name)}</button>
            <div class="cell-sub">${esc(Dates.fmt(m.meeting_date))}${p ? ' · ' + esc(p.project_name) : ''}</div>
            <div class="row mt-4" style="margin-top:6px">${parts ? `<span class="chip">${parts} participant(s)</span>` : ''}${acts ? `<span class="chip">${acts} action(s)</span>` : ''}</div></div>
          ${Menu.html([{ action: 'open-meeting', icon: 'open', label: 'Ouvrir', data: { id: m.id } }, { action: 'edit-meeting', icon: 'edit', label: 'Modifier', data: { id: m.id } }, { action: 'delete-meeting', icon: 'trash', label: 'Supprimer', danger: true, data: { id: m.id } }])}</div>`;
      }).join('') : `<div class="card">${UI.empty({ icon: 'notes', title: all.length ? 'Aucun compte-rendu pour ce projet' : 'Aucun compte-rendu', sub: 'Les actions saisies deviennent automatiquement des tâches.', action: `<button class="btn btn-primary" data-action="new-meeting">${icon('plus', 'sm')}Nouveau compte-rendu</button>` })}</div>`}</div>`;
  },
  form(view, meet) {
    const ws = App.ws, selected = meet?.participants || [];
    view.innerHTML = pageHeader({ title: meet ? 'Modifier le compte-rendu' : 'Nouveau compte-rendu', sub: 'Meeting minutes',
      crumbs: [{ page: 'meetings', label: 'Meeting Minutes' }, { label: meet ? meet.team_name : 'Nouveau' }],
      actions: `<button class="btn btn-ghost" data-action="go" data-page="meetings">Annuler</button><button class="btn btn-primary" data-action="save-meeting">Enregistrer</button>` }) +
      `<div class="page-body stack"><input type="hidden" id="m_id" value="${esc(meet?.id || '')}">
        <section class="card solid card-pad"><h2 class="section-title">Informations</h2><div class="form-grid">
          <div class="field"><label class="label" for="m_team">Nom de l'équipe <span class="req">*</span></label><input class="input" id="m_team" value="${esc(meet?.team_name || '')}" placeholder="ex : Équipe projet Charlotte"></div>
          <div class="field"><label class="label" for="m_date">Date de réunion <span class="req">*</span></label><input class="input" type="date" id="m_date" value="${esc(Dates.key(meet?.meeting_date) || Dates.today())}"></div>
          <div class="field full"><label class="label" for="m_proj">Projet associé${ws === 'pdqa' ? ' <span class="req">*</span>' : ''}</label><select class="select" id="m_proj" data-change="meeting-project">${UI.projectOptions(ws, meet?.project_id, ws === 'pdqa' ? '— Choisir un projet —' : '— Aucun projet —')}</select></div>
        </div><p class="error-msg" id="err_meeting"></p></section>
        <section class="card solid card-pad"><h2 class="section-title">Participants</h2><div class="part-grid" role="group" aria-label="Participants">${Store.users.map(u => `<button type="button" class="part-chip" data-action="chip-toggle" data-group="participants" data-value="${esc(u.id)}" aria-pressed="${selected.includes(u.id)}">${avatar(u, 24)}${esc(u.name)}</button>`).join('')}</div></section>
        <section class="card solid card-pad"><h2 class="section-title"><label for="m_agenda">Ordre du jour</label></h2><textarea class="textarea" id="m_agenda" rows="4" placeholder="1. Point 1">${esc(meet?.agenda || '')}</textarea></section>
        <section class="card solid card-pad"><h2 class="section-title"><label for="m_decisions">Décisions prises</label></h2><textarea class="textarea" id="m_decisions" rows="4" placeholder="1. Décision 1">${esc(meet?.decisions || '')}</textarea></section>
        <section class="card solid card-pad"><h2 class="section-title">Actions à suivre</h2><p class="hint mb-4">Chaque action avec un responsable devient une tâche.</p>
          <div class="mm-action-row label small" style="margin-bottom:8px"><span>Action</span><span>Responsable</span><span>Échéance</span><span></span></div>
          <div id="actionRows"></div><button class="btn btn-glass btn-sm mt-4" data-action="mm-add">${icon('plus', 'sm')}Ajouter une action</button></section>
      </div>`;
    const actions = meet?.actions || [];
    if (actions.length) actions.forEach(a => Meetings.addRow(a.title, a.assignee_id, a.due_date)); else Meetings.addRow();
  },
  addRow(title = '', assigneeId = '', due = '') {
    const row = document.createElement('div'); row.className = 'mm-action-row';
    row.innerHTML = `<input class="input input-sm ma-title" value="${esc(title)}" placeholder="Description de l'action" aria-label="Action">
      <select class="select input-sm ma-assign" aria-label="Responsable">${UI.userOptions(assigneeId, '— Responsable —')}</select>
      <input class="input input-sm ma-due" type="date" value="${esc(Dates.key(due) || '')}" aria-label="Échéance">
      <button class="btn btn-ghost btn-sm btn-icon" data-action="mm-remove" aria-label="Supprimer l'action">${icon('x', 'sm')}</button>`;
    document.getElementById('actionRows').appendChild(row);
  },
  async save() {
    const ws = App.ws, v = id => document.getElementById(id).value.trim();
    const err = document.getElementById('err_meeting'); err.textContent = '';
    const team = v('m_team'), date = v('m_date'), projectId = v('m_proj') || null;
    if (!team || !date) { err.textContent = 'Le nom de l\'équipe et la date sont obligatoires.'; return; }
    if (ws === 'pdqa' && !projectId) { err.textContent = 'Dans l\'espace PDQA, un compte-rendu doit être rattaché à un projet.'; return; }
    const actions = [...document.querySelectorAll('.mm-action-row')].filter(r => r.querySelector('.ma-title'))
      .map(r => ({ title: r.querySelector('.ma-title').value, assignee_id: r.querySelector('.ma-assign').value || null, due_date: r.querySelector('.ma-due').value || null }))
      .filter(a => a.title.trim());
    const participants = [...document.querySelectorAll('[data-group="participants"][aria-pressed="true"]')].map(b => b.dataset.value);
    const payload = { team_name: team, meeting_date: date, project_id: projectId, agenda: v('m_agenda') || null, decisions: v('m_decisions') || null, participants, actions };
    const mid = v('m_id');
    try {
      const { data: saved, error } = mid
        ? await Store.db.from('meeting_minutes').update(payload).eq('id', mid).select().single()
        : await Store.db.from('meeting_minutes').insert({ ...payload, created_by: Store.me?.id || null }).select().single();
      if (error) throw error;
      const meetingId = saved?.id || mid;
      const withAssignee = actions.filter(a => a.title.trim() && a.assignee_id);
      // Comportement d'origine conservé : à chaque enregistrement, les tâches issues du
      // meeting sont recréées (voir point ouvert signalé dans le rapport de livraison).
      if (withAssignee.length) {
        if (mid) await Store.db.from('tasks').delete().eq('meeting_ref', mid);
        const { error: tErr } = await Store.db.from('tasks').insert(withAssignee.map(a => ({ title: `[${team}] ${a.title}`, project_id: projectId, assignee_id: a.assignee_id,
          due_date: a.due_date || null, priority: 'medium', status: 'todo', description: `Action issue du meeting : ${team} du ${Dates.fmt(date)}`, meeting_ref: meetingId || null })));
        if (tErr) throw tErr;
        Toast.show(`Compte-rendu enregistré · ${withAssignee.length} tâche(s) créée(s).`);
      } else Toast.show('Compte-rendu enregistré.');
      await Promise.all([Store.refreshTable('meeting_minutes'), Store.refreshTable('tasks')]);
      Router.go(ws, 'meeting', meetingId);
    } catch (e) { Toast.error(e); }
  },
  view(view, m) {
    const p = Store.project(m.project_id);
    const parts = (m.participants || []).map(Store.user).filter(Boolean);
    const acts = (m.actions || []).map((a, i) => `<div class="action-item"><span class="action-num">${i + 1}</span><span class="grow">${esc(a.title)}${a.assignee_id && Store.user(a.assignee_id) ? `<div class="cell-sub">${esc(Store.user(a.assignee_id).name)}</div>` : ''}</span>${a.due_date ? `<span class="due">${icon('clock', 'sm')}${esc(Dates.fmt(a.due_date))}</span>` : ''}</div>`).join('');
    view.innerHTML = pageHeader({ title: m.team_name, sub: 'Compte-rendu de réunion', crumbs: [{ page: 'meetings', label: 'Meeting Minutes' }, { label: m.team_name }],
      actions: `<button class="btn btn-glass" data-action="print">${icon('print', 'sm')}Imprimer</button><button class="btn btn-primary" data-action="edit-meeting" data-id="${esc(m.id)}">${icon('edit', 'sm')}Modifier</button>` }) +
      `<div class="page-body"><div class="mv-header"><div class="mv-team">${esc(m.team_name)}</div><div class="muted">${esc(Dates.long(m.meeting_date))}${p ? ` · <button class="link-muted" data-action="open-project" data-id="${esc(p.id)}">${esc(p.project_name)}</button>` : ''}</div></div>
        ${parts.length ? `<section class="mv-section"><h2 class="section-title">Participants</h2><div class="part-grid">${parts.map(u => `<span class="part-chip">${avatar(u, 24)}${esc(u.name)}</span>`).join('')}</div></section>` : ''}
        ${m.agenda ? `<section class="mv-section card card-pad"><h2 class="section-title">Ordre du jour</h2><div class="mv-content">${esc(m.agenda)}</div></section>` : ''}
        ${m.decisions ? `<section class="mv-section card card-pad"><h2 class="section-title">Décisions prises</h2><div class="mv-content">${esc(m.decisions)}</div></section>` : ''}
        ${acts ? `<section class="mv-section card"><div class="card-head"><h2 class="card-title">Actions à suivre</h2></div>${acts}</section>` : ''}</div>`;
  },
};
const meetingNotFound = view => { view.innerHTML = pageHeader({ title: 'Compte-rendu introuvable' }) + `<div class="page-body"><div class="card">${UI.empty({ icon: 'alert', title: 'Ce compte-rendu n\'existe pas dans cet espace', action: '<button class="btn btn-glass" data-action="go" data-page="meetings">Retour</button>' })}</div></div>`; };

/* ---------- Analytiques (espace client — fonctionnalités inchangées) ---------- */
const Analytics = {
  chart: null, mode: 'all',
  render(view) {
    const projects = Store.projectsIn('customer'), tasks = Store.tasksIn('customer'), today = Dates.today();
    const active = projects.filter(p => p.status === 'active').length, done = projects.filter(p => p.status === 'done').length;
    const openT = tasks.filter(t => !Rules.isTaskDone(t)).length, overdueT = tasks.filter(t => Rules.isTaskOverdue(t, today));
    const progress = projects.filter(p => (p.timeline_steps || []).length).slice(0, 8).map(p => {
      const pct = Rules.projectProgress(p, tasks), col = pct >= 80 ? 'var(--ok)' : pct >= 40 ? 'var(--brand)' : 'var(--info)';
      return `<div class="bar-row"><span class="bar-name">${esc(p.project_name)}</span><span class="bar-track"><span class="bar-fill" style="display:block;width:${pct}%;background:${col}"></span></span><span class="bar-val">${pct}%</span></div>`;
    }).join('') || '<p class="muted small">Aucune donnée de timeline.</p>';
    const upcoming = projects.filter(p => p.launch_date && Dates.key(p.launch_date) >= today && p.status !== 'done').sort((a, b) => cmp(a.launch_date, b.launch_date)).slice(0, 5);
    const map = {}; overdueT.filter(t => t.assignee_id).forEach(t => { map[t.assignee_id] = (map[t.assignee_id] || 0) + 1; });
    const max = Math.max(1, ...Object.values(map));
    const ovUsers = Store.users.filter(u => map[u.id]).sort((a, b) => map[b.id] - map[a.id]);
    const stat = (action, ic, label, value, cls = '') => `<${action ? `button data-action="${action}"` : 'div'} class="kpi ${cls}"><span class="kpi-label">${label}</span><span class="kpi-value">${value}</span></${action ? 'button' : 'div'}>`;
    view.innerHTML = pageHeader({ title: 'Analytiques', sub: 'Vue globale des projets clients.' }) +
      `<div class="page-body stack"><div class="kpi-strip card">${stat('an-active', 'target', 'Projets en cours', active)}${stat('an-open', 'list', 'Tâches ouvertes', openT)}${stat('', 'rocket', 'Projets terminés', done)}${stat('', 'alert', 'Tâches en retard', overdueT.length, overdueT.length ? 'alert' : 'calm')}</div>
        <section class="card card-pad"><div class="row wrap mb-4"><h2 class="card-title grow">Lancements par mois (projets terminés)</h2>
          <span class="small muted">Filtrer par</span><div class="row" role="group" aria-label="Filtre du graphique">
          ${[['all', 'Tous'], ['lead', 'Project Lead'], ['client', 'Client']].map(([m, l]) => `<button class="filter-chip" data-action="an-mode" data-mode="${m}" aria-pressed="${Analytics.mode === m}">${l}</button>`).join('')}</div>
          <select class="select" id="anFilterValue" data-change="an-value" style="width:auto;min-width:180px" ${Analytics.mode === 'all' ? 'hidden' : ''} aria-label="Valeur du filtre"></select></div>
          <div class="chart-box"><canvas id="launchChart" aria-label="Lancements par mois" role="img"></canvas></div></section>
        <div class="grid g2"><section class="card card-pad"><h2 class="section-title">Avancement des projets</h2>${progress}</section>
          <section class="card card-pad"><h2 class="section-title">5 prochains lancements</h2>${upcoming.length ? upcoming.map((p, i) => `<button class="list-row" style="padding-left:0;padding-right:0" data-action="open-project" data-id="${esc(p.id)}"><span class="launch-num">${i + 1}</span><span class="grow"><span class="cell-title" style="display:block">${esc(p.project_name)}</span><span class="cell-sub">${esc(p.client_name || '—')}</span></span><span class="badge b-space no-dot">${esc(Dates.fmt(p.launch_date))}</span></button>`).join('') : '<p class="muted small">Aucun lancement planifié.</p>'}</section></div>
        <section class="card card-pad"><h2 class="section-title">Tâches en retard par personne</h2>${ovUsers.length ? ovUsers.map(u => `<div class="bar-row"><span class="bar-name">${esc(u.name)}</span><span class="bar-track"><span class="bar-fill" style="display:block;width:${Math.round(map[u.id] / max * 100)}%;background:var(--brand)"></span></span><span class="bar-val">${map[u.id]}</span></div>`).join('') : '<p style="color:var(--ok);font-weight:600">Aucune tâche en retard.</p>'}</section>
      </div>`;
    Analytics.fillFilter(); Analytics.renderChart();
  },
  fillFilter() {
    const sel = document.getElementById('anFilterValue'); if (!sel) return;
    const projects = Store.projectsIn('customer');
    const values = Analytics.mode === 'lead' ? uniqueSorted(projects.map(p => p.org_data?.lead)) : uniqueSorted(projects.map(p => p.client_name));
    sel.innerHTML = UI.options(values.map(v => ({ value: v, label: v })), '', { placeholder: '— Tous —' });
  },
  renderChart() {
    const canvas = document.getElementById('launchChart'); if (!canvas || !window.Chart) return;
    const val = document.getElementById('anFilterValue')?.value || '';
    const months = [], labels = [], now = new Date();
    for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(Dates.toKey(d).slice(0, 7)); labels.push(d.toLocaleDateString(CONFIG.locale, { month: 'short', year: '2-digit' })); }
    const projects = Store.projectsIn('customer');
    const counts = months.map(m => projects.filter(p => p.status === 'done' && p.launch_date && String(p.launch_date).slice(0, 7) === m &&
      !(Analytics.mode === 'lead' && val && (p.org_data?.lead || '') !== val) && !(Analytics.mode === 'client' && val && p.client_name !== val)).length);
    if (Analytics.chart) { Analytics.chart.destroy(); Analytics.chart = null; }
    const css = getComputedStyle(document.body), text = css.getPropertyValue('--text-3').trim() || '#6E717B', grid = css.getPropertyValue('--line').trim() || 'rgba(0,0,0,.06)';
    Analytics.chart = new Chart(canvas.getContext('2d'), { type: 'bar', data: { labels, datasets: [{ label: 'Lancements terminés', data: counts, backgroundColor: 'rgba(255,150,32,.75)', borderColor: '#FF9620', borderWidth: 1, borderRadius: 6 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: text, font: { size: 11 } }, grid: { color: grid } }, y: { beginAtZero: true, ticks: { stepSize: 1, color: text, font: { size: 11 } }, grid: { color: grid } } } } });
  },
  listModal(title, rows) {
    Overlay.open(`<h2 class="modal-title">${esc(title)}</h2><div class="card solid" style="max-height:60vh;overflow:auto">${rows || '<div class="card-body muted">Aucun élément.</div>'}</div><div class="modal-actions"><button class="btn btn-ghost" data-action="close-overlay">Fermer</button></div>`, { label: title });
  },
};
Object.assign(Actions, {
  'an-mode': el => { Analytics.mode = el.dataset.mode; document.querySelectorAll('[data-action="an-mode"]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); const sel = document.getElementById('anFilterValue'); sel.hidden = Analytics.mode === 'all'; Analytics.fillFilter(); Analytics.renderChart(); },
  'an-active': () => Analytics.listModal('Projets en cours', Store.projectsIn('customer').filter(p => p.status === 'active').map(p => `<button class="list-row" data-action="modal-open-project" data-id="${esc(p.id)}"><span class="grow"><span class="cell-title" style="display:block">${esc(p.project_name)}</span><span class="cell-sub">${esc(p.client_name || '—')}${p.launch_date ? ' · ' + esc(Dates.fmt(p.launch_date)) : ''}</span></span></button>`).join('')),
  'an-open': () => Analytics.listModal('Tâches ouvertes', sortTasks(Store.tasksIn('customer').filter(t => !Rules.isTaskDone(t)), 'due').map(t => `<div class="list-row"><span class="grow"><span class="cell-title" style="display:block">${esc(t.title)}</span><span class="cell-sub">${esc([Store.project(t.project_id)?.project_name, Store.user(t.assignee_id)?.name].filter(Boolean).join(' · '))}</span></span>${UI.due(t)}</div>`).join('')),
  'modal-open-project': el => { Overlay.close(); Router.go(App.ws, 'project', el.dataset.id); },
});
ChangeActions['an-value'] = () => Analytics.renderChart();
Routes.analytics = { module: 'analytics', render: v => Analytics.render(v) };

/* ---------- Utilisateurs ---------- */
const Users = {
  render(view) {
    view.innerHTML = pageHeader({ title: 'Utilisateurs', sub: 'Équipe et fonctions. L\'accès à l\'espace PDQA dépend du champ « Fonction ».',
      actions: `<button class="btn btn-primary" data-action="new-user">${icon('plus', 'sm')}Ajouter</button>` }) +
      `<div class="page-body">${Store.users.length ? `<div class="grid g3">${Store.users.map(u => `<div class="card user-card">${avatar(u, 44)}<div class="grow"><div class="cell-title">${esc(u.name)}</div><div class="cell-sub">${esc(u.role || '')}</div>${u.email ? `<div class="cell-sub">${esc(u.email)}</div>` : ''}${Perm.canAccessPDQA(u) ? '<span class="badge b-space mt-4" style="margin-top:6px">Accès PDQA</span>' : ''}</div>
        <button class="btn btn-ghost btn-sm btn-icon" data-action="delete-user" data-id="${esc(u.id)}" aria-label="Supprimer ${esc(u.name)}">${icon('trash', 'sm')}</button></div>`).join('')}</div>` : `<div class="card">${UI.empty({ icon: 'users', title: 'Aucun utilisateur' })}</div>`}</div>`;
  },
  modal(fromLogin) {
    const panel = Overlay.open(`<h2 class="modal-title">Nouvel utilisateur</h2><form id="userForm" novalidate class="stack">
      <div class="field"><label class="label" for="nu_name">Nom complet <span class="req">*</span></label><input class="input" id="nu_name" placeholder="ex : Charlotte Dupont" autofocus></div>
      <div class="field"><label class="label" for="nu_role">Fonction <span class="req">*</span></label><input class="input" id="nu_role" list="roleList" placeholder="ex : Project Manager"><datalist id="roleList">${CONFIG.pdqaRoles.map(r => `<option value="${esc(r)}">`).join('')}</datalist>
        <span class="hint">« ${esc(CONFIG.pdqaRoles.join(' » ou « '))} » donnent accès à l'espace PDQA.</span></div>
      <div class="field"><label class="label" for="nu_email">Email <span class="muted">(facultatif)</span></label><input class="input" type="email" id="nu_email" placeholder="prenom@nutradia.be"></div>
      <div class="field"><span class="label">Couleur de profil</span><div class="row" role="radiogroup" aria-label="Couleur de profil">${CONFIG.avatarColors.map((c, i) => `<label style="cursor:pointer"><input type="radio" name="nu_color" value="${c}" ${i === 0 ? 'checked' : ''} class="sr-only"><span class="avatar" style="width:30px;height:30px;background:${c}" aria-label="${c}"></span></label>`).join('')}</div></div>
      <p class="error-msg" id="err_user"></p>
      <div class="modal-actions"><button type="button" class="btn btn-ghost" data-action="close-overlay">Annuler</button><button type="submit" class="btn btn-primary">Créer</button></div></form>`, { label: 'Nouvel utilisateur' });
    const paint = () => panel.querySelectorAll('[name="nu_color"]').forEach(r => { r.nextElementSibling.style.outline = r.checked ? '3px solid var(--brand)' : 'none'; r.nextElementSibling.style.outlineOffset = '2px'; });
    panel.addEventListener('change', paint); paint();
    panel.querySelector('#userForm').addEventListener('submit', async e => {
      e.preventDefault();
      const name = panel.querySelector('#nu_name').value.trim(), role = panel.querySelector('#nu_role').value.trim();
      if (!name || !role) { panel.querySelector('#err_user').textContent = 'Le nom et la fonction sont obligatoires.'; return; }
      const { error } = await Store.db.from('users').insert({ name, role, email: panel.querySelector('#nu_email').value.trim() || null, avatar_color: panel.querySelector('[name="nu_color"]:checked').value });
      if (error) { panel.querySelector('#err_user').textContent = friendlyError(error); return; }
      Overlay.close(); Toast.show('Utilisateur créé.');
      if (fromLogin || !Store.me) Login.render(); else { await Store.refreshTable('users'); Router.refresh(); }
    });
  },
};
Object.assign(Actions, {
  'new-user': el => Users.modal(el.dataset.from === 'login'),
  async 'delete-user'(el) {
    const u = Store.user(el.dataset.id); if (!u) return;
    if (u.id === Store.me?.id) { Toast.show('Vous ne pouvez pas supprimer votre propre profil.', 'error'); return; }
    if (!confirm(`Supprimer l'utilisateur « ${u.name} » ?`)) return;
    const { error } = await Store.db.from('users').delete().eq('id', u.id);
    if (error) { Toast.error(error); return; }
    await Store.refreshTable('users'); Toast.show('Utilisateur supprimé.'); Router.refresh();
  },
});
Routes.users = { module: 'users', render: v => Users.render(v) };

/* ---------- Démarrage ---------- */
function boot() {
  Theme.init();
  installGlobalHandlers();
  try { Store.init(); } catch (err) { document.getElementById('root').innerHTML = `<div class="login"><div class="notice">${icon('alert')}<span>${esc(err.message)}</span></div></div>`; return; }
  const remembered = Session.read();
  if (remembered) {
    Store.loadUsers().then(() => { if (Store.user(remembered)) Login.as(remembered); else { Session.clear(); Login.render(); } })
      .catch(() => Login.render());
  } else Login.render();
}
window.Jalon = { CONFIG, Dates, Rules, Perm, Store, App, Router, Kanban, Calendar };   // utile pour le diagnostic et les tests
boot();

</script>
</body>
</html>
