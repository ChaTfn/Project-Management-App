/* ==========================================================================
   Prévalidation MP (matières premières)
   Une fiche par matière : fournisseur, projet, demandeur, échéance et une
   checklist documentaire. Le statut avance seul (Demandée → Documents en
   attente → En revue) au fil des documents reçus ; la validation exige tous les
   documents obligatoires, le refus exige un motif.
   ========================================================================== */
const Mp = {
  defaults: { q: '', status: 'open', supplier: '', project: '' },
  status: id => refItem(CONFIG.pdqaModules.mpStatuses, id),
  isDecided: i => i.status === 'approved' || i.status === 'rejected',
  /** Qui peut valider ou refuser : le responsable de la revue désigné ; à défaut, toute personne autre que le demandeur.
      Le PDQA Manager peut toujours décider. (Contrôle d'interface : la base sera verrouillée avec la connexion par mot de passe.) */
  canDecide(i, me = Store.me) {
    if (!i || !me) return false;
    if (normalizeRole(me.role) === normalizeRole('PDQA Manager')) return true;
    return i.reviewer_id ? i.reviewer_id === me.id : i.requester_id !== me.id;
  },
  decisionRule(i) {
    const rev = Store.user(i.reviewer_id);
    return rev ? `Décision réservée à ${rev.name} (responsable de la revue) ou au PDQA Manager.` : 'Le demandeur ne peut pas valider sa propre demande : désignez un responsable de la revue.';
  },
  isLate: (i, today = Dates.today()) => !!i.due_date && !Mp.isDecided(i) && Dates.key(i.due_date) < today,
  /** Bilan de la checklist : documents reçus, obligatoires reçus, obligatoires manquants. */
  docs(checklist = {}) {
    const items = CONFIG.pdqaModules.mpChecklist, req = items.filter(d => d.required);
    return { done: items.filter(d => checklist[d.id]).length, total: items.length, reqDone: req.filter(d => checklist[d.id]).length, reqTotal: req.length,
      missing: req.filter(d => !checklist[d.id]).map(d => d.label) };
  },
  /** Statut proposé d'après les documents reçus (les décisions ne sont jamais changées ici). */
  autoStatus(status, checklist) {
    if (status === 'approved' || status === 'rejected') return status;
    const d = Mp.docs(checklist);
    if (d.reqDone === d.reqTotal) return 'review';
    if (d.done > 0 && status === 'requested') return 'docs_pending';
    return status === 'review' ? 'docs_pending' : status;
  },
  filtered() {
    const st = App.view('mp', Mp.defaults), q = st.q.toLowerCase();
    return PdqaData.list('mpItems').filter(i => (!q || [i.material_name, i.supplier, i.supplier_ref, i.internal_code].some(v => String(v || '').toLowerCase().includes(q))) &&
      (!st.status || (st.status === 'open' ? !Mp.isDecided(i) : st.status === 'late' ? Mp.isLate(i) : i.status === st.status)) &&
      (!st.supplier || i.supplier === st.supplier) && (!st.project || i.project_id === st.project))
      .sort((a, b) => Mp.isDecided(a) - Mp.isDecided(b) || Mp.isLate(b) - Mp.isLate(a) || cmp(Dates.key(a.due_date), Dates.key(b.due_date)) || cmp(b.created_at, a.created_at));
  },

  render(view) {
    const st = App.view('mp', Mp.defaults), all = PdqaData.list('mpItems'), cfg = CONFIG.pdqaModules;
    const n = s => all.filter(i => i.status === s).length, late = all.filter(i => Mp.isLate(i)).length;
    const chip = (value, label, count, tone = '') => `<button class="filter-chip ${tone}" data-action="mp-status" data-value="${value}" aria-pressed="${st.status === value}">${esc(label)} <b class="num">${count}</b></button>`;
    view.innerHTML = pageHeader({ title: 'Prévalidation MP', crumbs: [{ label: 'Prévalidation MP' }], sub: 'Revue documentaire des matières premières avant leur utilisation.',
      actions: `<button class="btn btn-glass" data-action="mp-export" ${all.length ? '' : 'disabled'}>${icon('download', 'sm')}Exporter en Excel</button><button class="btn btn-primary" data-action="mp-new" ${PdqaData.ready('mpItems') ? '' : 'disabled'}>${icon('plus', 'sm')}Nouvelle demande</button>` }) +
      `<div class="page-body">${PdqaData.notice('mpItems')}<div class="toolbar card board-tools" role="search">
        <div class="board-chips" role="group" aria-label="Filtrer par statut">${chip('open', 'En cours', all.filter(i => !Mp.isDecided(i)).length)}${chip('late', 'Échéance dépassée', late, 't-danger')}
          ${cfg.mpStatuses.map(s => chip(s.id, s.label, n(s.id), s.id === 'approved' ? 't-ok' : s.id === 'rejected' ? 't-danger' : '')).join('')}${chip('', 'Toutes', all.length)}</div>
        <span class="spacer"></span>
        <div class="search">${icon('search', 'sm')}<input class="input" type="search" placeholder="Matière, fournisseur, code" value="${esc(st.q)}" data-input="mp-filter" data-key="q" aria-label="Rechercher une matière"></div>
        <select class="select" data-change="mp-filter" data-key="supplier" aria-label="Filtrer par fournisseur">${UI.options(uniqueSorted(all.map(i => i.supplier)).map(s => ({ value: s, label: s })), st.supplier, { placeholder: 'Tous les fournisseurs' })}</select>
        <select class="select" data-change="mp-filter" data-key="project" aria-label="Filtrer par initiative">${UI.projectOptions('pdqa', st.project, 'Toutes les initiatives')}</select>
      </div><div id="mpBody"></div></div>`;
    Mp.renderList();
  },

  renderList() {
    const box = document.getElementById('mpBody'); if (!box) return;
    const list = Mp.filtered(), all = PdqaData.list('mpItems'), today = Dates.today();
    if (!list.length) {
      box.innerHTML = `<div class="card">${UI.empty({ icon: 'flask', title: all.length ? 'Aucune matière ne correspond aux filtres' : 'Aucune demande de prévalidation',
        sub: all.length ? 'Changez de statut ou de filtres.' : 'Ajoutez une matière première à faire valider : la checklist des documents est prête.',
        action: !all.length && PdqaData.ready('mpItems') ? `<button class="btn btn-primary" data-action="mp-new">${icon('plus', 'sm')}Nouvelle demande</button>` : '' })}</div>`;
      return;
    }
    box.innerHTML = `<div class="table-wrap"><table class="table"><thead><tr><th>Matière première</th><th>Fournisseur</th><th>Initiative</th><th>Documents obligatoires</th><th>Statut</th><th>Échéance</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>
      ${list.map(i => {
        const d = Mp.docs(i.checklist), s = Mp.status(i.status), p = Store.projectIn('pdqa', i.project_id), late = Mp.isLate(i, today);
        const pct = d.reqTotal ? Math.round(d.reqDone / d.reqTotal * 100) : 0;
        return `<tr class="is-clickable ${late ? 'is-late' : ''}" data-action="mp-edit" data-id="${esc(i.id)}">
          <td style="min-width:200px"><button class="link-btn cell-title" data-action="mp-edit" data-id="${esc(i.id)}">${esc(i.material_name)}</button><div class="cell-sub">${esc([i.internal_code, Store.user(i.requester_id)?.name].filter(Boolean).join(' · ') || '—')}</div></td>
          <td>${esc(i.supplier || '—')}${i.supplier_ref ? `<div class="cell-sub">Réf. ${esc(i.supplier_ref)}</div>` : ''}</td>
          <td>${p ? esc(p.project_name) : '<span class="muted">—</span>'}</td>
          <td><div class="progress" role="img" aria-label="${d.reqDone} documents obligatoires sur ${d.reqTotal}"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-val">${d.reqDone}/${d.reqTotal}</span></div></td>
          <td><span class="badge ${s.badge}">${esc(s.label)}</span></td>
          <td>${i.due_date ? `<span class="due ${late ? 'overdue' : ''}">${late ? icon('alert', 'sm') : icon('clock', 'sm')}${esc(Dates.fmt(i.due_date))}</span>` : '<span class="due none">—</span>'}${Mp.isDecided(i) && i.decision_date ? `<div class="cell-sub">Décision le ${esc(Dates.short(i.decision_date))}</div>` : ''}</td>
          <td class="col-actions">${Menu.html([{ action: 'mp-edit', icon: 'edit', label: 'Ouvrir', data: { id: i.id } }, { action: 'mp-delete', icon: 'trash', label: 'Supprimer', danger: true, data: { id: i.id } }])}</td></tr>`;
      }).join('')}</tbody></table></div>`;
  },

  open(id) {
    const i = id ? PdqaData.get('mpItems', id) : null;
    if (id && !i) { Toast.show('Fiche introuvable.', 'error'); return; }
    const v = i || { status: 'requested', checklist: {}, requester_id: Store.me.id }, s = Mp.status(v.status), decided = Mp.isDecided(v);
    const list = CONFIG.pdqaModules.mpChecklist, d = Mp.docs(v.checklist || {});
    const form = Form.drawer({ id: 'mpForm', title: i ? i.material_name : 'Nouvelle demande de prévalidation',
      body: `${i ? `<div class="row wrap"><span class="badge ${s.badge}">${esc(s.label)}</span>${Mp.isLate(i) ? '<span class="badge b-danger">Échéance dépassée</span>' : ''}</div>` : ''}
        ${Form.field('mp_name', 'Matière première', Form.input('mp_name', v.material_name, 'placeholder="ex : Protéine de pois 80 %" autofocus'), { req: true })}
        <div class="form-grid">${Form.field('mp_code', 'Code interne', Form.input('mp_code', v.internal_code, 'placeholder="ex : MP-01234"'))}
          ${Form.field('mp_due', 'Échéance', Form.date('mp_due', v.due_date))}
          ${Form.field('mp_supplier', 'Fournisseur', Form.input('mp_supplier', v.supplier, 'list="mpSuppliers"'))}
          ${Form.field('mp_ref', 'Référence fournisseur', Form.input('mp_ref', v.supplier_ref))}
          ${Form.field('mp_req', 'Demandeur', Form.select('mp_req', UI.userOptions(v.requester_id, '— Non défini —')))}
          ${Form.field('mp_rev', 'Responsable de la revue', Form.select('mp_rev', UI.userOptions(v.reviewer_id, '— Non défini —')))}</div>
        <datalist id="mpSuppliers">${uniqueSorted(PdqaData.list('mpItems').map(x => x.supplier)).map(x => `<option value="${esc(x)}">`).join('')}</datalist>
        ${Form.field('mp_project', 'Initiative PDQA liée', Form.select('mp_project', UI.projectOptions('pdqa', v.project_id, '— Aucune —')))}
        <fieldset class="field"><legend class="label">Documents reçus <span class="muted" id="mpDocCount">${d.reqDone}/${d.reqTotal} obligatoires</span></legend>
          <div class="checklist">${list.map(doc => `<label class="check-row"><input type="checkbox" data-doc="${doc.id}" data-change="mp-doc" ${v.checklist?.[doc.id] ? 'checked' : ''} ${decided ? 'disabled' : ''}>
            <span>${esc(doc.label)}</span>${doc.required ? '<span class="badge b-neutral no-dot">Obligatoire</span>' : '<span class="muted small">Facultatif</span>'}</label>`).join('')}</div></fieldset>
        ${Form.field('mp_notes', 'Notes', Form.textarea('mp_notes', v.notes, 3, 'Points d\'attention, échanges avec le fournisseur'))}
        <section class="mp-decision"><h3 class="label">Décision</h3>
          ${decided ? `<p class="small">${esc(s.label)} le ${esc(Dates.fmt(v.decision_date))}${Store.user(v.decided_by || v.reviewer_id) ? ` par ${esc(Store.user(v.decided_by || v.reviewer_id).name)}` : ''}.</p>${v.decision_comment ? `<p class="small mv-content">${esc(v.decision_comment)}</p>` : ''}
            ${Mp.canDecide(i) ? `<button type="button" class="btn btn-glass btn-sm" data-action="mp-decide" data-decision="reopen">${icon('undo', 'sm')}Rouvrir la revue</button>` : ''}`
          : !i ? '<p class="hint">La décision se prend une fois la demande enregistrée et les documents reçus.</p>'
          : !Mp.canDecide(i) ? `<p class="hint">${esc(Mp.decisionRule(i))}</p>`
          : `${Form.field('mp_comment', 'Commentaire de décision', Form.textarea('mp_comment', v.decision_comment, 2, 'Obligatoire en cas de refus'))}
            <div class="row wrap"><button type="button" class="btn btn-glass btn-sm" data-action="mp-decide" data-decision="approved">${icon('check', 'sm')}Valider la matière</button>
              <button type="button" class="btn btn-danger btn-sm" data-action="mp-decide" data-decision="rejected">${icon('x', 'sm')}Refuser</button></div>
            <p class="error-msg" id="err_mp_decision" role="alert"></p>`}</section>`,
      foot: `${i ? `<button type="button" class="btn btn-danger left" data-action="mp-delete" data-id="${esc(i.id)}">${icon('trash', 'sm')}Supprimer</button>` : ''}
        <button type="button" class="btn btn-ghost" data-action="close-overlay">Annuler</button><button type="submit" class="btn btn-primary">${i ? 'Enregistrer' : 'Créer la demande'}</button>` });
    form.dataset.id = i?.id || '';
    form.addEventListener('submit', e => { e.preventDefault(); Mp.save(form); });
  },

  checklistOf(form) { const out = {}; form.querySelectorAll('[data-doc]').forEach(c => { if (c.checked) out[c.dataset.doc] = true; }); return out; },

  /** decision : undefined (simple enregistrement) | 'approved' | 'rejected' | 'reopen'. */
  async save(form, decision) {
    const val = id => Form.val(form, id), item = PdqaData.get('mpItems', form.dataset.id);
    const errors = {};
    if (!val('mp_name')) errors.mp_name = 'Le nom de la matière est obligatoire.';
    const checklist = item && Mp.isDecided(item) && decision !== 'reopen' ? item.checklist || {} : Mp.checklistOf(form);
    const docs = Mp.docs(checklist);
    if (decision && !Mp.canDecide(item)) { Toast.show(Mp.decisionRule(item), 'error'); return; }
    if (decision === 'rejected' && !val('mp_comment')) errors.mp_comment = 'Indiquez le motif du refus.';
    if (decision === 'approved' && docs.missing.length) errors.mp_decision = `Validation impossible, documents obligatoires manquants : ${docs.missing.join(', ')}.`;
    if (Form.errors(form, errors)) return;
    const payload = { material_name: val('mp_name').slice(0, 200), internal_code: val('mp_code') || null, supplier: val('mp_supplier') || null, supplier_ref: val('mp_ref') || null,
      requester_id: val('mp_req') || null, reviewer_id: val('mp_rev') || null, project_id: val('mp_project') || null, due_date: val('mp_due') || null, notes: val('mp_notes') || null, checklist };
    // La décision est attribuée à la personne connectée, quelle que soit la valeur du champ « Responsable de la revue ».
    if (decision === 'approved' || decision === 'rejected') Object.assign(payload, { status: decision, decision_date: Dates.today(), decision_comment: val('mp_comment') || null, decided_by: Store.me.id, reviewer_id: payload.reviewer_id || Store.me.id });
    else if (decision === 'reopen') Object.assign(payload, { status: Mp.autoStatus('docs_pending', checklist), decision_date: null, decided_by: null });
    else Object.assign(payload, { status: Mp.autoStatus(item?.status || 'requested', checklist), ...(item && !Mp.isDecided(item) ? { decision_comment: val('mp_comment') || null } : {}) });
    const label = decision === 'approved' ? 'validée' : decision === 'rejected' ? 'refusée' : decision === 'reopen' ? 'rouverte' : item ? 'modifiée' : 'créée';
    const buttons = [...form.querySelectorAll('button[type="submit"], [data-action="mp-decide"]')];
    buttons.forEach(b => { b.disabled = true; });
    try {
      await PdqaData.save('mpItems', item?.id, payload, `Prévalidation « ${payload.material_name} » ${label}`);
      Overlay.close(); Toast.show(`Prévalidation ${label}.`); Router.refresh();
    } catch (e) { Toast.error(e); buttons.forEach(b => { b.disabled = false; }); }
  },

  async exportExcel() {
    try {
      if (!window.XLSX) await loadScript(Export.xlsxUrl);
      const list = Mp.filtered(), docs = CONFIG.pdqaModules.mpChecklist, d = v => (v ? Dates.parse(v) : null);
      const head = ['Matière première', 'Code interne', 'Fournisseur', 'Référence fournisseur', 'Initiative', 'Demandeur', 'Responsable de la revue', 'Statut', 'Échéance', 'Échéance dépassée',
        'Documents obligatoires', 'Décision prise par', ...docs.map(x => x.label), 'Date de décision', 'Commentaire de décision', 'Notes'];
      const body = list.map(i => { const k = Mp.docs(i.checklist); return [i.material_name, i.internal_code || '', i.supplier || '', i.supplier_ref || '', Store.project(i.project_id)?.project_name || '',
        Store.user(i.requester_id)?.name || '', Store.user(i.reviewer_id)?.name || '', Mp.status(i.status).label, d(i.due_date), Mp.isLate(i) ? 'Oui' : 'Non', `${k.reqDone}/${k.reqTotal}`, Store.user(i.decided_by)?.name || '',
        ...docs.map(x => (i.checklist?.[x.id] ? 'Reçu' : '')), d(i.decision_date), i.decision_comment || '', i.notes || '']; });
      const file = Export.book([['Prévalidation MP', head, body]], `${CONFIG.appName}_prevalidation_MP_${Dates.today()}.xlsx`);
      Toast.show(`${list.length} matière(s) exportée(s) : ${file}`);
    } catch (e) { Toast.error(e); }
  },
};
Object.assign(Actions, {
  'mp-new': () => Mp.open(),
  'mp-edit': el => Mp.open(el.dataset.id),
  'mp-export': () => Mp.exportExcel(),
  'mp-status': el => { App.view('mp', Mp.defaults).status = el.dataset.value; Mp.render(document.getElementById('view')); },
  'mp-decide': el => { const form = el.closest('form'); if (form) Mp.save(form, el.dataset.decision); },
  async 'mp-delete'(el) {
    const i = PdqaData.get('mpItems', el.dataset.id); if (!i || !confirm(`Supprimer la fiche « ${i.material_name} » ?`)) return;
    try { await PdqaData.remove('mpItems', i.id, `Prévalidation supprimée : « ${i.material_name} »`); if (Overlay.top()?.querySelector('#mpForm')) Overlay.close(); Toast.show('Fiche supprimée.'); Router.refresh(); } catch (e) { Toast.error(e); }
  },
});
InputActions['mp-filter'] = ChangeActions['mp-filter'] = el => { App.view('mp', Mp.defaults)[el.dataset.key] = el.value; Mp.renderList(); };
ChangeActions['mp-doc'] = el => {
  const form = el.closest('form'), d = Mp.docs(Mp.checklistOf(form)), out = form.querySelector('#mpDocCount');
  if (out) out.textContent = `${d.reqDone}/${d.reqTotal} obligatoires`;
};

/* ==========================================================================
   Jalon — 09 · Mon espace
   Toutes les tâches d'une personne, espace Clients et espace PDQA réunis, par
   échéance. Les tâches PDQA n'apparaissent que si la personne qui consulte a
   accès à l'espace PDQA (Store.tasksIn applique cette règle).
   ========================================================================== */
const MySpace = {
  defaults: { person: '', ws: '', done: false },
  /** Espaces visibles par la personne connectée. */
  spaces: () => Perm.workspacesFor(Store.me),
  tasksOf(userId, ws = '') {
    return MySpace.spaces().filter(w => !ws || w === ws).flatMap(w => Store.tasksIn(w)).filter(t => t.assignee_id === userId);
  },
  /** Tâches en retard de la personne connectée, tous espaces confondus (pastille du bandeau). */
  overdueCount: () => (Store.me ? MySpace.tasksOf(Store.me.id).filter(t => Rules.isTaskOverdue(t)).length : 0),
  BUCKETS: [
    { id: 'overdue', label: 'En retard', test: (k, t, today) => k && k < today },
    { id: 'today', label: 'Aujourd\'hui', test: (k, t, today) => k === today },
    { id: 'week', label: 'Dans les 7 prochains jours', test: (k, t, today) => k && k > today && k <= Dates.addDays(today, 7) },
    { id: 'later', label: 'Plus tard', test: k => !!k },
    { id: 'none', label: 'Sans échéance', test: () => true },
  ],

  render(view) {
    const st = App.view('mySpace', MySpace.defaults), today = Dates.today(), spaces = MySpace.spaces();
    const personId = st.person && Store.user(st.person) ? st.person : Store.me.id, person = Store.user(personId) || Store.me, self = personId === Store.me.id;
    const all = MySpace.tasksOf(personId, st.ws), open = all.filter(t => !Rules.isTaskDone(t));
    const late = open.filter(t => Rules.isTaskOverdue(t, today)).length, week = open.filter(t => { const k = Dates.key(t.due_date); return k && k >= today && k <= Dates.addDays(today, 7); }).length;
    const kpi = (label, value, foot, cls = '') => `<div class="kpi ${cls}"><span class="kpi-label">${esc(label)}</span><span class="kpi-value">${value}</span><span class="kpi-foot">${foot}</span></div>`;
    const wsChip = (value, label) => `<button class="filter-chip" data-action="my-ws" data-value="${value}" aria-pressed="${st.ws === value}">${value ? `<span class="ws-dot ${value}" aria-hidden="true"></span>` : ''}${esc(label)}</button>`;
    view.innerHTML = pageHeader({ title: self ? 'Mon espace' : `Espace de ${person.name}`, crumbs: [{ label: 'Mon espace' }],
      sub: spaces.length > 1 ? 'Toutes les tâches, espace Clients et espace PDQA réunis.' : 'Toutes les tâches de l\'espace Clients.',
      actions: `<button class="btn btn-primary" data-action="new-task">${icon('plus', 'sm')}Nouvelle tâche</button>` }) +
      `<div class="page-body"><div class="toolbar card">
          <label class="label" for="my_person" style="margin:0">Personne</label>
          <select class="select" id="my_person" data-change="my-person" aria-label="Voir les tâches de">${UI.options(Store.users.map(u => ({ value: u.id, label: u.id === Store.me.id ? `${u.name} (moi)` : u.name })), personId)}</select>
          ${spaces.length > 1 ? `<div class="board-chips" role="group" aria-label="Espace">${wsChip('', 'Tous les espaces')}${spaces.map(w => wsChip(w, CONFIG.workspaces[w].tag)).join('')}</div>` : ''}
          <span class="spacer"></span><label class="check"><input type="checkbox" data-change="my-done" ${st.done ? 'checked' : ''}>Afficher les tâches terminées</label></div>
        <section class="kpi-strip card" aria-label="Indicateurs">${kpi('Tâches ouvertes', open.length, spaces.length > 1 && !st.ws ? spaces.map(w => `${open.filter(t => Store.wsOfTask(t) === w).length} ${CONFIG.workspaces[w].tag}`).join(' · ') : CONFIG.workspaces[st.ws || 'customer'].short)}
          ${kpi('En retard', late, late ? 'À traiter en priorité' : 'Tout est à jour', late ? 'alert' : '')}${kpi('Cette semaine', week, 'échéances dans les 7 jours')}
          ${kpi('Terminées', all.length - open.length, 'au total')}</section>
        <div class="my-grid mt-6"><div class="stack" id="myLists">${MySpace.listsHTML(all, st, today)}</div>${self ? MySpace.asideHTML(today) : ''}</div></div>`;
  },

  listsHTML(all, st, today) {
    const open = sortTasks(all.filter(t => !Rules.isTaskDone(t)), 'due', 'asc'), placed = new Set(), out = [];
    MySpace.BUCKETS.forEach(b => {
      const list = open.filter(t => !placed.has(t.id) && b.test(Dates.key(t.due_date), t, today));
      list.forEach(t => placed.add(t.id));
      if (list.length) out.push(MySpace.groupHTML(b.label, list, b.id === 'overdue'));
    });
    if (st.done) { const done = sortTasks(all.filter(Rules.isTaskDone), 'due', 'desc'); if (done.length) out.push(MySpace.groupHTML('Terminées', done)); }
    return out.join('') || `<div class="card">${UI.empty({ icon: 'check', title: 'Aucune tâche ouverte', sub: 'Tout est à jour.' })}</div>`;
  },
  groupHTML(label, list, alert = false) {
    return `<section aria-label="${esc(label)}"><h2 class="section-title my-group ${alert ? 't-danger' : ''}">${alert ? icon('alert', 'sm') : ''}${esc(label)} <span class="muted">${list.length}</span></h2>
      ${taskTableHTML(list, {}, { sortable: false, showWs: MySpace.spaces().length > 1, showAssignee: false })}</section>`;
  },

  /** Colonne « Aussi pour vous » : ce qui attend la personne dans les modules PDQA. */
  asideHTML(today) {
    if (!Store.canSee('pdqa')) return '';
    const me = Store.me.id, in30 = Dates.addDays(today, 30);
    const mp = PdqaData.list('mpItems').filter(i => !Mp.isDecided(i) && (i.reviewer_id === me || i.requester_id === me));
    const evs = PdqaData.list('events').filter(e => e.status !== 'cancelled' && (e.participants || []).includes(me) && Events.end(e) >= today && Events.start(e) <= in30)
      .sort((a, b) => cmp(Events.start(a), Events.start(b)));
    const ideas = PdqaData.list('innovations').filter(i => i.owner_id === me && ['idea', 'study', 'validated'].includes(i.stage));
    const leads = Store.projectsIn('pdqa').filter(p => p.pdqa_data?.lead_id === me && p.status !== 'done');
    const block = (title, page, rows) => `<section class="card"><div class="card-head"><h2 class="card-title">${esc(title)} <span class="muted small">${rows.length}</span></h2>
      <a class="btn btn-ghost btn-sm" href="${Router.href('pdqa', page)}">Voir${icon('right', 'sm')}</a></div>${rows.slice(0, 5).join('') || '<div class="card-body muted small">Rien en attente.</div>'}</section>`;
    return `<aside class="stack" aria-label="Aussi pour vous dans l'espace PDQA"><h2 class="section-title" style="margin:0">Aussi pour vous <span class="muted">· PDQA</span></h2>
      ${block('Mes initiatives', 'projects', leads.map(p => `<button class="list-row" data-action="open-project" data-ws="pdqa" data-id="${esc(p.id)}"><span class="grow"><span class="cell-title truncate" style="display:block">${esc(p.project_name)}</span><span class="cell-sub">${esc(p.pdqa_data?.department || '')}</span></span>${UI.projectDue(p)}</button>`))}
      ${block('Prévalidations MP en cours', 'mp', mp.map(i => `<button class="list-row" data-action="mp-edit" data-id="${esc(i.id)}"><span class="grow"><span class="cell-title truncate" style="display:block">${esc(i.material_name)}</span><span class="cell-sub">${esc(i.supplier || '')}${i.reviewer_id === me ? ' · à revoir par vous' : ''}</span></span><span class="badge ${Mp.status(i.status).badge}">${esc(Mp.status(i.status).label)}</span></button>`))}
      ${block('Visites et salons à venir', 'events', evs.map(e => `<button class="list-row" data-action="open-event" data-id="${esc(e.id)}"><span class="grow"><span class="cell-title truncate" style="display:block">${esc(e.title)}</span><span class="cell-sub">${esc(Events.type(e.type).label)} · ${esc(Events.dates(e))}</span></span></button>`))}
      ${block('Mes idées', 'innovation', ideas.map(i => `<button class="list-row" data-action="inno-edit" data-id="${esc(i.id)}"><span class="grow"><span class="cell-title truncate" style="display:block">${esc(i.title)}</span></span><span class="badge ${Innovation.stage(i.stage).badge} no-dot">${esc(Innovation.stage(i.stage).label)}</span></button>`))}
    </aside>`;
  },
};
Object.assign(Actions, {
  'my-ws': el => { App.view('mySpace', MySpace.defaults).ws = el.dataset.value; Router.refresh(); },
});
ChangeActions['my-person'] = el => { App.view('mySpace', MySpace.defaults).person = el.value; Router.refresh(); };
ChangeActions['my-done'] = el => { App.view('mySpace', MySpace.defaults).done = el.checked; Router.refresh(); };

/* ---------- Routes ---------- */
Object.assign(Routes, {
  home: { module: 'home', render: v => HomeHub.render(v) },
  me: { module: 'home', render: v => MySpace.render(v) },
  projects: { module: 'projects', render: v => ProjectsHub.render(v) },
  'projects-all': { module: 'projects', render: v => ProjectsPage.render(v) },
  'projects-board': { module: 'projects', render: v => (App.ws === 'customer' ? SimplePages.board(v) : Router.redirect(App.ws, 'projects')) },
  'projects-by': { module: 'projects', render: (v, by) => ProjectsHub.groups(v, by) },
  'projects-group': { module: 'projects', render: (v, p) => ProjectsHub.group(v, p) },
  tasks: { module: 'tasks', render: v => TasksHub.render(v) },
  'tasks-all': { module: 'tasks', render: v => TasksPage.render(v) },
  'tasks-by': { module: 'tasks', render: (v, by) => TasksHub.groups(v, by) },
  'tasks-group': { module: 'tasks', render: (v, p) => TasksHub.group(v, p) },
  innovation: { module: 'innovation', render: v => Innovation.render(v) },
  events: { module: 'events', render: v => Events.list(v) },
  event: { module: 'events', render: (v, id) => { const e = PdqaData.get('events', id); if (e) Events.view(v, e); else eventNotFound(v); } },
  'event-edit': { module: 'events', render: (v, id) => { const e = id && id !== 'new' ? PdqaData.get('events', id) : null; if (id && id !== 'new' && !e) eventNotFound(v); else Events.form(v, e); } },
  planning: { module: 'planning', render: v => Planning.render(v) },
  mp: { module: 'mp', render: v => Mp.render(v) },
});

/* ---------- Démarrage ---------- */
function boot() {
  Theme.init();
  Projection.init();
  installGlobalHandlers();
  try { Store.init(); } catch (err) { document.getElementById('root').innerHTML = `<div class="login"><div class="notice">${icon('alert')}<span>${esc(err.message)}</span></div></div>`; return; }
  const remembered = Session.read();
  if (remembered) {
    Store.loadUsers().then(() => { if (Store.user(remembered)) Login.as(remembered); else { Session.clear(); Login.render(); } })
      .catch(() => Login.render());
  } else Login.render();
}
window.Jalon = { CONFIG, Dates, Rules, Timeline, Perm, Store, App, Router, Kanban, Calendar, PdqaData, Innovation, Events, Planning, Mp, MySpace };   // utile pour le diagnostic et les tests
boot();

</script>
