/* ---------- Panneau de création / modification rapide ----------
   Utilisé partout : Tâches, Kanban, Calendrier, fiches projet, dashboard.
   options : { taskId, projectId, dueDate, status, allowMeeting } */
const TaskEditor = {
  ws: 'customer',   // espace de la tâche ouverte (peut différer de l'espace courant depuis « Mon espace »)
  open(options = {}) {
    const ws = options.ws && Perm.canAccessWorkspace(Store.me, options.ws) ? options.ws : App.ws;
    TaskEditor.ws = ws;
    const task = options.taskId ? Store.taskIn(ws, options.taskId) : null;
    if (options.taskId && !task) { Toast.show('Tâche introuvable dans cet espace.', 'error'); return; }
    const v = task || { title: '', project_id: options.projectId || '', assignee_id: Store.me?.id || '', status: options.status || 'todo',
      priority: 'medium', due_date: options.dueDate || '', description: '', step_key: options.stepKey || '' };
    const lockedProject = !!options.projectId && !task;
    const typeSwitch = options.allowMeeting && !task ? `<div class="segmented" role="group" aria-label="Type d'élément">
        <button type="button" data-action="te-type" data-type="task" aria-pressed="true">Tâche</button>
        <button type="button" data-action="te-type" data-type="meeting" aria-pressed="false">Réunion</button></div>` : '';
    const projectPlaceholder = ws === 'pdqa' ? '— Choisir un projet —' : '— Aucun projet —';
    const panel = Overlay.open(`
      <form id="taskForm" novalidate style="display:contents">
        <div class="drawer-head"><h2 class="modal-title" style="margin:0" id="teTitle">${task ? 'Modifier la tâche' : 'Nouvelle tâche'}</h2>
          <button type="button" class="btn btn-ghost btn-icon" data-action="close-overlay" aria-label="Fermer">${icon('x')}</button></div>
        <div class="drawer-body">
          ${typeSwitch}
          <input type="hidden" name="type" value="task">
          <div class="field"><label class="label" for="te_title">Titre <span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="te_title" name="title" value="${esc(v.title)}" placeholder="ex : Valider la spécification" required autofocus aria-describedby="err_title">
            <span class="error-msg" id="err_title"></span></div>
          <div class="field"><label class="label" for="te_project">Projet${ws === 'pdqa' ? ' <span class="req" aria-hidden="true">*</span>' : ''}</label>
            <select class="select" id="te_project" name="project_id" ${lockedProject ? 'disabled' : ''} aria-describedby="err_project_id">${UI.projectOptions(ws, v.project_id, projectPlaceholder)}</select>
            ${lockedProject ? `<input type="hidden" name="project_id" value="${esc(v.project_id)}"><span class="hint">Pré-rempli depuis la fiche projet.</span>` : ''}
            <span class="error-msg" id="err_project_id"></span></div>
          <div class="field" id="te_step_field" data-task-only hidden><label class="label" for="te_step">Étape de la timeline <span class="muted">(facultatif)</span></label>
            <select class="select" id="te_step" name="step_key"></select><span class="hint">L'avancement de l'étape suivra les tâches qui lui sont reliées.</span></div>
          <div class="field"><label class="label" for="te_assignee">Responsable</label>
            <select class="select" id="te_assignee" name="assignee_id" aria-describedby="err_assignee_id">${UI.userOptions(v.assignee_id)}</select>
            <span class="error-msg" id="err_assignee_id"></span></div>
          <div class="form-grid" data-task-only>
            <div class="field"><label class="label" for="te_status">Statut</label>
              <select class="select" id="te_status" name="status">${UI.options(CONFIG.taskStatuses.map(s => ({ value: s.id, label: s.label })), v.status)}</select></div>
            <div class="field"><label class="label" for="te_priority">Priorité</label>
              <select class="select" id="te_priority" name="priority">${UI.options(Object.entries(CONFIG.taskPriorities).map(([id, p]) => ({ value: id, label: p.label })), v.priority || 'medium')}</select></div>
          </div>
          <div class="field"><label class="label" for="te_due" id="teDueLabel">Échéance</label>
            <input class="input" type="date" id="te_due" name="due_date" value="${esc(Dates.key(v.due_date) || '')}" aria-describedby="err_due_date">
            <span class="error-msg" id="err_due_date"></span></div>
          <div class="field" data-task-only><label class="label" for="te_desc">Description <span class="muted">(facultatif)</span></label>
            <textarea class="textarea" id="te_desc" name="description" rows="3" placeholder="Détails, critères d'acceptation…">${esc(v.description || '')}</textarea></div>
        </div>
        <div class="drawer-foot">
          ${task ? `<button type="button" class="btn btn-danger left" data-action="delete-task" data-ws="${ws}" data-id="${esc(task.id)}">${icon('trash', 'sm')}Supprimer</button>` : ''}
          <button type="button" class="btn btn-ghost" data-action="close-overlay">Annuler</button>
          <button type="submit" class="btn btn-primary" id="teSubmit">${task ? 'Enregistrer' : 'Créer la tâche'}</button>
        </div>
      </form>`, { type: 'drawer', label: task ? 'Modifier la tâche' : 'Nouvelle tâche' });
    panel.querySelector('#taskForm').addEventListener('submit', e => { e.preventDefault(); TaskEditor.save(e.target, task); });
    panel.querySelector('#te_project').addEventListener('change', e => TaskEditor.fillSteps(e.target.value, ''));
    TaskEditor.fillSteps(v.project_id, v.step_key || '');
  },
  /** Liste des étapes de la timeline du projet choisi (projets clients avec timeline uniquement). */
  fillSteps(projectId, selected) {
    const field = document.getElementById('te_step_field'), sel = document.getElementById('te_step'); if (!field || !sel) return;
    const p = projectId ? Store.projectIn(TaskEditor.ws, projectId) : null;
    const steps = p && Store.schema.stepKey !== false ? Timeline.enrich(p.timeline_steps) : [];
    field.hidden = !steps.length || document.querySelector('#taskForm [name="type"]')?.value === 'meeting';
    sel.innerHTML = `<option value="">— Aucune étape —</option>` + steps.map(s => {
      const k = Timeline.stepKey(s);
      return `<option value="${esc(k)}" ${k === selected ? 'selected' : ''}>${s.gate ? `Gate ${Timeline.gateNumber(s.name)} : ${esc(Timeline.gateTitle(s.label))}` : esc(s.label)}${s.week ? ` (${esc(s.week)})` : ''}</option>`;
    }).join('');
  },

  setType(btn) {
    const form = document.getElementById('taskForm'); if (!form) return;
    const type = btn.dataset.type;
    form.querySelector('[name="type"]').value = type;
    form.querySelectorAll('[data-action="te-type"]').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    form.querySelectorAll('[data-task-only]').forEach(el => { el.hidden = type === 'meeting'; });
    if (type !== 'meeting') TaskEditor.fillSteps(form.querySelector('[name="project_id"]:not([type="hidden"])')?.value || form.querySelector('[name="project_id"]')?.value, '');
    document.getElementById('teTitle').textContent = type === 'meeting' ? 'Nouvelle réunion' : 'Nouvelle tâche';
    document.getElementById('teDueLabel').textContent = type === 'meeting' ? 'Date de réunion' : 'Échéance';
    document.querySelector('label[for="te_assignee"]').textContent = type === 'meeting' ? 'Participant' : 'Responsable';
    document.getElementById('teSubmit').textContent = type === 'meeting' ? 'Créer la réunion' : 'Créer la tâche';
  },

  showErrors(form, fields = {}) {
    form.querySelectorAll('.error-msg').forEach(el => { el.textContent = ''; });
    form.querySelectorAll('[aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));
    let first = null;
    Object.entries(fields).forEach(([name, msg]) => {
      const out = form.querySelector('#err_' + name); if (out) out.textContent = msg;
      const input = form.querySelector(`[name="${name}"]:not([type="hidden"])`);
      if (input) { input.setAttribute('aria-invalid', 'true'); first = first || input; }
    });
    first?.focus();
  },

  async save(form, task) {
    const ws = TaskEditor.ws;
    const val = name => { const els = form.querySelectorAll(`[name="${name}"]`); const el = [...els].find(x => !x.disabled) || els[0]; return el ? el.value.trim() : ''; };
    const submit = document.getElementById('teSubmit');
    TaskEditor.showErrors(form, {});
    try {
      submit.disabled = true;
      if (val('type') === 'meeting') {
        const fields = {};
        if (!val('title')) fields.title = 'Le nom de la réunion est obligatoire.';
        if (!val('due_date')) fields.due_date = 'La date de réunion est obligatoire.';
        if (val('project_id') && !Store.projectIn(ws, val('project_id'))) fields.project_id = 'Projet non disponible.';
        if (ws === 'pdqa' && !val('project_id')) fields.project_id = 'Dans l\'espace PDQA, une réunion doit être rattachée à un projet.';
        if (Object.keys(fields).length) throw Object.assign(new Error('Formulaire incomplet'), { fields });
        const { data, error } = await Store.db.from('meeting_minutes').insert({
          team_name: val('title'), meeting_date: val('due_date'), project_id: val('project_id') || null,
          created_by: Store.me?.id || null, participants: val('assignee_id') ? [val('assignee_id')] : [], actions: [],
        }).select().single();
        if (error) throw error;
        Store.meetings.unshift(data);
        Toast.show('Réunion créée.');
      } else {
        const payload = { title: val('title'), project_id: val('project_id') || null, assignee_id: val('assignee_id') || null,
          status: val('status') || 'todo', priority: val('priority') || 'medium', due_date: val('due_date') || null, description: val('description') || null };
        const stepField = document.getElementById('te_step_field');
        payload.step_key = stepField && !stepField.hidden ? (val('step_key') || null) : null;
        if (task) { await Store.updateTask(task.id, payload, ws); Toast.show('Tâche enregistrée.'); }
        else { await Store.createTask(payload, ws); Toast.show('Tâche créée.'); }
      }
      Overlay.close();
      Router.refresh();
    } catch (err) {
      if (err.fields) TaskEditor.showErrors(form, err.fields); else Toast.error(err);
    } finally { if (document.contains(submit)) submit.disabled = false; }
  },
};

/** Espace d'une tâche cliquée : data-ws (Mon espace) ou, à défaut, l'espace courant. */

Object.assign(Actions, {

  'edit-task': el => TaskEditor.open({ taskId: el.dataset.id, ws: el.dataset.ws }),

/* ---------- Tableau de tâches réutilisable ---------- */
function sortTasks(list, sort = 'due', dir = 'asc') {
  const prioRank = t => CONFIG.taskPriorities[t.priority]?.level || 0;
  const statusRank = t => CONFIG.taskStatuses.findIndex(s => s.id === t.status);
  const key = {
    title: t => t.title, project: t => Store.project(t.project_id)?.project_name || '', assignee: t => Store.user(t.assignee_id)?.name || '',
    status: statusRank, priority: t => -prioRank(t), due: t => Dates.key(t.due_date) || '',
  }[sort] || (t => t.title);
  const sign = dir === 'desc' ? -1 : 1;
  return list.slice().sort((a, b) => {
    if (sort === 'due') { const d = Rules.isTaskDone(a) - Rules.isTaskDone(b); if (d) return d; }   // terminées en dernier
    return sign * cmp(key(a), key(b)) || cmp(a.title, b.title);
  });
}

/** Libellé de l'étape de timeline reliée à une tâche (ou ''). */
function taskStepLabel(t) {
  if (!t.step_key) return '';
  const p = Store.project(t.project_id);
  const s = p && Timeline.enrich(p.timeline_steps).find(x => Timeline.stepKey(x) === t.step_key);
  return s ? (s.gate ? `Gate ${Timeline.gateNumber(s.name)} : ${Timeline.gateTitle(s.label)}` : s.label) : '';
}
function taskTableHTML(tasks, state, { showProject = true, sortable = true, showStep = false, showWs = false, showAssignee = true } = {}) {
  const head = (label, key) => sortable ? UI.sortHeader(label, key, state) : `<th>${esc(label)}</th>`;
  const rows = tasks.map(t => {
    const p = Store.project(t.project_id);
    const late = Rules.isTaskOverdue(t), done = Rules.isTaskDone(t);
    const tws = Store.wsOfTask(t), wa = showWs ? ` data-ws="${tws}"` : '';
    const tag = showWs ? `<span class="ws-tag ${tws}">${esc(CONFIG.workspaces[tws].tag)}</span>` : '';
    return `<tr class="${late ? 'is-late' : ''} ${done ? 'is-done' : ''}">
      <td style="width:44px"><button class="task-check" role="checkbox" aria-checked="${done}" data-action="toggle-task"${wa} data-id="${esc(t.id)}" aria-label="${done ? 'Rouvrir' : 'Marquer comme terminée'} : ${esc(t.title)}">${icon('check', 'sm')}</button></td>
      <td style="min-width:240px">${tag}<button class="link-btn cell-title" data-action="edit-task"${wa} data-id="${esc(t.id)}">${esc(t.title)}</button>${t.description ? `<div class="cell-sub truncate" style="max-width:420px">${esc(t.description)}</div>` : ''}</td>
      ${showProject ? `<td>${p ? `<button class="link-muted" data-action="open-project"${wa} data-id="${esc(p.id)}">${esc(p.project_name)}</button>` : '<span class="muted">—</span>'}${taskStepLabel(t) ? `<div class="cell-sub truncate" style="max-width:220px">${esc(taskStepLabel(t))}</div>` : ''}</td>` : ''}
      ${showStep ? `<td class="small">${taskStepLabel(t) ? esc(taskStepLabel(t)) : '<span class="muted">—</span>'}</td>` : ''}
      ${showAssignee ? `<td>${UI.person(t.assignee_id)}</td>` : ''}
      <td><select class="select status-select s-${esc(t.status)}" data-change="task-status"${wa} data-id="${esc(t.id)}" aria-label="Statut de ${esc(t.title)}">${UI.options(CONFIG.taskStatuses.map(s => ({ value: s.id, label: s.label })), t.status)}</select></td>
      <td>${UI.taskPriority(t.priority)}</td>
      <td>${UI.due(t)}</td>
      <td class="col-actions">${Menu.html([{ action: 'edit-task', icon: 'edit', label: 'Modifier', data: { id: t.id, ...(showWs ? { ws: tws } : {}) } }, { action: 'delete-task', icon: 'trash', label: 'Supprimer', danger: true, data: { id: t.id, ...(showWs ? { ws: tws } : {}) } }])}</td>
    </tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="table"><thead><tr><th><span class="sr-only">Terminée</span></th>
    ${head('Tâche', 'title')}${showProject ? head('Projet', 'project') : ''}${showStep ? '<th>Étape</th>' : ''}${showAssignee ? head('Responsable', 'assignee') : ''}${head('Statut', 'status')}${head('Priorité', 'priority')}${head('Échéance', 'due')}<th><span class="sr-only">Actions</span></th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

        <div class="search">${icon('search', 'sm')}<input class="input" type="search" placeholder="Rechercher une tâche" value="${esc(st.q)}" data-input="tasks-filter" data-key="q" aria-label="Rechercher une tâche"></div>
        <select class="select" data-change="tasks-filter" data-key="project" aria-label="Filtrer par projet">${UI.projectOptions(ws, st.project, 'Tous les projets')}</select>

        <select class="select" data-change="tasks-filter" data-key="status" aria-label="Filtrer par statut">${UI.options([{ value: 'open', label: 'Ouvertes (non terminées)' }, ...CONFIG.taskStatuses.map(s => ({ value: s.id, label: s.label }))], st.status, { placeholder: 'Tous les statuts' })}</select>
        <select class="select" data-change="tasks-filter" data-key="due" aria-label="Filtrer par échéance">${UI.options([{ value: 'overdue', label: 'En retard' }, { value: 'today', label: 'Aujourd\'hui' }, { value: 'week', label: '7 prochains jours' }, { value: 'none', label: 'Sans échéance' }], st.due, { placeholder: 'Toutes les échéances' })}</select>
        <span class="spacer"></span><span class="result-count" id="tasksCount" aria-live="polite"></span>
      </div><div id="tasksTable"></div></div>`;

  },
  filtered() {

      (!st.due || (st.due === 'overdue' && Rules.isTaskOverdue(t)) || (st.due === 'none' && !t.due_date) ||
        (st.due === 'today' && Dates.key(t.due_date) === today) ||
        (st.due === 'week' && !!t.due_date && Dates.key(t.due_date) >= today && Dates.key(t.due_date) <= in7)));

  renderList() {

        : `<div class="card">${UI.empty({ icon: 'list', title: 'Aucune tâche dans cet espace', sub: 'Créez la première tâche en quelques secondes.', action: `<button class="btn btn-primary" data-action="new-task">${icon('plus', 'sm')}Nouvelle tâche</button>` })}</div>`;
  },
};
InputActions['tasks-filter'] = ChangeActions['tasks-filter'] = el => { App.view('tasks', TasksPage.defaults)[el.dataset.key] = el.value; TasksPage.renderList(); };

/* ---------- Kanban ----------
   Cause du bug d'origine : les cartes étaient « draggable » mais aucun écouteur
   « dragstart » n'enregistrait la carte déplacée ; l'identifiant restait vide et le
   dépôt ne faisait rien. Désormais : délégation d'événements sur le tableau,
   mise à jour optimiste, confirmation par la base, retour arrière en cas d'échec. */
const Kanban = {
  defaults: { project: '', assignee: '', q: '' },
  dragId: null,
  pending: new Set(),
  render(view) {
    const ws = App.ws, st = App.view('kanban', Kanban.defaults);
    view.innerHTML = pageHeader({ title: 'Kanban', crumbs: [{ page: 'tasks', label: 'Tâches' }, { label: 'Kanban' }], sub: 'Glissez une carte pour changer son statut — ou utilisez les flèches de la carte (Alt + ← / →).',
      actions: `<button class="btn btn-primary" data-action="new-task">${icon('plus', 'sm')}Nouvelle tâche</button>` }) +
      `<div class="page-body"><div class="toolbar card">
        <div class="search">${icon('search', 'sm')}<input class="input" type="search" placeholder="Filtrer les cartes" value="${esc(st.q)}" data-input="kb-filter" data-key="q" aria-label="Filtrer les cartes"></div>
        <select class="select" data-change="kb-filter" data-key="project" aria-label="Filtrer par projet">${UI.projectOptions(ws, st.project, 'Tous les projets')}</select>
        <select class="select" data-change="kb-filter" data-key="assignee" aria-label="Filtrer par membre">${UI.userOptions(st.assignee, 'Tous les membres')}</select>
      </div><div class="kanban" id="kanbanBoard"></div></div>`;
    Kanban.bind(document.getElementById('kanbanBoard'));
    Kanban.renderBoard();
  },
  cards() {
    const st = App.view('kanban', Kanban.defaults), q = st.q.toLowerCase();
    return Store.tasksIn(App.ws).filter(t => (!st.project || t.project_id === st.project) && (!st.assignee || t.assignee_id === st.assignee) && (!q || t.title?.toLowerCase().includes(q)));
  },
  renderBoard() {
    const board = document.getElementById('kanbanBoard'); if (!board) return;
    const cards = Kanban.cards();
    const statuses = CONFIG.taskStatuses;
    board.innerHTML = statuses.map((s, i) => {
      const list = sortTasks(cards.filter(t => t.status === s.id), 'due', 'asc');
      return `<section class="kb-col" data-status="${s.id}" aria-labelledby="kbh-${s.id}">
        <div class="kb-col-head"><span class="kb-dot ${s.id}" aria-hidden="true"></span><h2 class="kb-col-title" id="kbh-${s.id}">${esc(s.label)}</h2>
          <span class="kb-count" aria-label="${list.length} tâche(s)">${list.length}</span>
          <button class="btn btn-ghost btn-sm btn-icon" data-action="new-task" data-status="${s.id}" aria-label="Ajouter une tâche « ${esc(s.label)} »">${icon('plus', 'sm')}</button></div>
        <div class="kb-list">${list.length ? list.map(t => Kanban.cardHTML(t, statuses[i - 1], statuses[i + 1])).join('') : '<div class="kb-empty">Déposez une carte ici</div>'}</div>
      </section>`;
    }).join('');
  },
  cardHTML(t, prev, next) {
    const p = Store.project(t.project_id), u = Store.user(t.assignee_id);
    const saving = Kanban.pending.has(t.id);
    const move = (target, dir) => target ? `<button data-action="kb-move" data-id="${esc(t.id)}" data-to="${target.id}" aria-label="Déplacer vers ${esc(target.label)}" title="Déplacer vers ${esc(target.label)}">${icon(dir, 'sm')}</button>` : '';
    return `<article class="kb-card ${Rules.isTaskOverdue(t) ? 'is-late' : ''} ${saving ? 'is-saving' : ''}" draggable="${saving ? 'false' : 'true'}" data-task-id="${esc(t.id)}" aria-busy="${saving}">
      <div class="kb-moves">${move(prev, 'left')}${move(next, 'right')}</div>
      <button class="kb-title link-btn" data-action="edit-task" data-id="${esc(t.id)}" style="padding-right:56px">${esc(t.title)}</button>
      <div class="kb-meta">${p ? `<span class="chip truncate" style="max-width:150px">${esc(p.project_name)}</span>` : ''}${UI.due(t)}${UI.taskPriority(t.priority)}${u ? `<span title="${esc(u.name)}">${avatar(u, 24)}</span>` : ''}</div>
    </article>`;
  },
  bind(board) {
    const clearOver = () => board.querySelectorAll('.kb-col.is-over').forEach(c => c.classList.remove('is-over'));
    board.addEventListener('dragstart', e => {
      const card = e.target.closest?.('.kb-card'); if (!card) return;
      Kanban.dragId = card.dataset.taskId;
      if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', Kanban.dragId); } catch (err) { /* navigateurs anciens */ } }
      requestAnimationFrame(() => card.classList.add('is-dragging'));
    });
    board.addEventListener('dragend', e => { e.target.closest?.('.kb-card')?.classList.remove('is-dragging'); clearOver(); Kanban.dragId = null; });
    board.addEventListener('dragover', e => {
      const col = e.target.closest?.('.kb-col'); if (!col || !Kanban.dragId) return;
      e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      if (!col.classList.contains('is-over')) { clearOver(); col.classList.add('is-over'); }
    });
    board.addEventListener('dragleave', e => { const col = e.target.closest?.('.kb-col'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('is-over'); });
    board.addEventListener('drop', e => {
      const col = e.target.closest?.('.kb-col'); if (!col) return;
      e.preventDefault(); clearOver();
      let id = Kanban.dragId; try { id = e.dataTransfer?.getData('text/plain') || id; } catch (err) { /* ignore */ }
      Kanban.dragId = null;
      if (id) Kanban.move(id, col.dataset.status);
    });
    board.addEventListener('keydown', e => {
      const card = e.target.closest?.('.kb-card'); if (!card || !e.altKey || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
      e.preventDefault();
      const t = Store.task(card.dataset.taskId); if (!t) return;
      const i = CONFIG.taskStatuses.findIndex(s => s.id === t.status) + (e.key === 'ArrowRight' ? 1 : -1);
      if (CONFIG.taskStatuses[i]) Kanban.move(t.id, CONFIG.taskStatuses[i].id, true);
    });
  },
  /** Déplace une tâche : affichage immédiat, puis enregistrement ; retour arrière si la base refuse. */
  async move(id, status, refocus = false) {
    const t = Store.taskIn(App.ws, id);
    if (!t || t.status === status || Kanban.pending.has(id)) return;
    if (!CONFIG.taskStatuses.some(s => s.id === status)) return;
    const prev = t.status;
    t.status = status; Kanban.pending.add(id); Kanban.renderBoard();
    try {
      await Store.updateTask(id, { status }, App.ws);
      Toast.show(`« ${t.title} » → ${Rules.taskStatus(status).label}`);
    } catch (err) {
      t.status = prev;
      Toast.show(`Le déplacement n'a pas été enregistré. ${friendlyError(err)}`, 'error');
    } finally {
      Kanban.pending.delete(id);
      if (App.page === 'kanban') Kanban.renderBoard();
      Shell.updateCounts();
      if (refocus) [...document.querySelectorAll('.kb-card')].find(c => c.dataset.taskId === id)?.querySelector('.kb-title')?.focus();
    }
  },
};
Actions['kb-move'] = el => Kanban.move(el.dataset.id, el.dataset.to, true);
InputActions['kb-filter'] = ChangeActions['kb-filter'] = el => { App.view('kanban', Kanban.defaults)[el.dataset.key] = el.value; Kanban.renderBoard(); };
Routes.kanban = { module: 'kanban', render: v => Kanban.render(v) };

/* ==========================================================================
   Jalon — 04 · Calendrier (vues jour, semaine, mois)

   Règles d'affichage (une seule source, voir Calendar.events) :
   • Tâche     → à sa date d'échéance. « En retard » si non terminée et date passée.
                 Les tâches terminées sont masquées, sauf si « Terminées » est coché.
                 Les tâches sans échéance ne figurent pas au calendrier (compteur affiché).
   • Projet    → jalon à sa date de lancement (clients) ou de fin (PDQA).
   • Réunion   → à sa date de réunion.
   Chaque élément n'apparaît qu'une fois (clé = type + identifiant).
   Toutes les dates sont traitées en « jour local » (pas de décalage UTC / heure d'été).

   Bugs d'origine corrigés : gestionnaires « onclick » aux guillemets imbriqués qui
   cassaient le HTML (la date n'était même pas transmise à la fenêtre de détail) ;
   chargement partiel qui écrasait les listes globales des autres modules ;
   vue mois uniquement.
   ========================================================================== */
const Calendar = {
  defaults: { view: 'month', cursor: null, person: '', project: '', showTask: true, showProject: true, showMeeting: true, showEvent: true, showDone: false },
  state() { const st = App.view('calendar', Calendar.defaults); if (!st.cursor) st.cursor = Dates.today(); return st; },

  /** Construit la liste dédoublonnée des éléments de l'espace courant, groupés par jour. */
  events(from, to) {
    const ws = App.ws, st = Calendar.state(), today = Dates.today();
    const byDay = {}, seen = new Set();
    const inRange = k => k && k >= from && k <= to;
    const add = (key, ev) => { const id = ev.uid || ev.kind + ':' + ev.id; if (seen.has(id) || !inRange(key)) return; seen.add(id); (byDay[key] = byDay[key] || []).push(ev); };
    const personUser = Store.user(st.person);
    if (st.showTask) Store.tasksIn(ws).forEach(t => {
      if (!t.due_date) return;
      if (Rules.isTaskDone(t) && !st.showDone) return;
      if (st.project && t.project_id !== st.project) return;
      if (st.person && t.assignee_id !== st.person) return;
      const late = Rules.isTaskOverdue(t, today), done = Rules.isTaskDone(t);
      add(Dates.key(t.due_date), { kind: 'task', id: t.id, action: 'edit-task', cls: done ? 'ev-done' : late ? 'ev-late' : 'ev-task',
        ic: late ? 'alert' : 'check', label: t.title, state: done ? 'Terminée' : late ? 'En retard' : 'À venir', order: late ? 0 : done ? 3 : 1,
        sub: [Store.project(t.project_id)?.project_name, Store.user(t.assignee_id)?.name].filter(Boolean).join(' · ') });
    });
    if (st.showProject) Store.projectsIn(ws).forEach(p => {
      if (!p.launch_date || (st.project && p.id !== st.project)) return;
      if (personUser && !(p.pdqa_data?.lead_id === personUser.id || Rules.projectLeadName(p).toLowerCase() === personUser.name.toLowerCase())) return;
      add(Dates.key(p.launch_date), { kind: 'project', id: p.id, action: 'open-project', cls: 'ev-project', ic: ws === 'pdqa' ? 'flag' : 'rocket',
        label: (ws === 'pdqa' ? 'Fin : ' : 'Lancement : ') + p.project_name, state: ws === 'pdqa' ? 'Fin de projet' : 'Lancement', order: 2,
        sub: p.client_name || p.pdqa_data?.department || '' });
    });
    if (st.showMeeting) Store.meetingsIn(ws).forEach(m => {
      if (!m.meeting_date || (st.project && m.project_id !== st.project)) return;
      if (st.person && !(m.participants || []).includes(st.person)) return;
      add(Dates.key(m.meeting_date), { kind: 'meeting', id: m.id, action: 'open-meeting', cls: 'ev-meeting', ic: 'notes', label: m.team_name,
        state: 'Réunion', order: 2, sub: Store.project(m.project_id)?.project_name || '' });
    });
    // Visites, workshops et salons (espace PDQA) : affichés chaque jour de l'événement (31 jours au plus).
    if (ws === 'pdqa' && st.showEvent) PdqaData.list('events').forEach(e => {
      if (e.status === 'cancelled' || !Events.start(e) || (st.project && e.project_id !== st.project)) return;
      if (st.person && !(e.participants || []).includes(st.person)) return;
      for (let k = Events.start(e), n = 0; k <= Events.end(e) && n < 31; k = Dates.addDays(k, 1), n++) {
        add(k, { kind: 'event', uid: `event:${e.id}:${k}`, id: e.id, action: 'open-event', cls: 'ev-event', ic: 'pin', label: e.title,
          state: Events.type(e.type).label, order: 2, sub: [e.location, Store.project(e.project_id)?.project_name].filter(Boolean).join(' · ') });
      }
    });
    Object.values(byDay).forEach(list => list.sort((a, b) => a.order - b.order || cmp(a.label, b.label)));
    return byDay;
  },

  range() {
    const st = Calendar.state();
    if (st.view === 'day') return [st.cursor, st.cursor];
    if (st.view === 'week') { const s = Dates.startOfWeek(st.cursor); return [s, Dates.addDays(s, 6)]; }
    const first = Dates.startOfMonth(st.cursor);
    const start = Dates.startOfWeek(first);
    const last = Dates.addDays(Dates.addMonths(first, 1), -1);
    const end = Dates.addDays(Dates.startOfWeek(last), 6);
    return [start, end];
  },

  label() {
    const st = Calendar.state();
    if (st.view === 'day') return Dates.long(st.cursor);
    if (st.view === 'week') { const [a, b] = Calendar.range(); return `Semaine ${Dates.isoWeek(a)} · ${Dates.short(a)} – ${Dates.fmt(b)}`; }
    return Dates.monthLabel(st.cursor);
  },

  render(view) {
    const ws = App.ws, st = Calendar.state();
    const viewBtn = (id, label) => `<button data-action="cal-view" data-view="${id}" aria-pressed="${st.view === id}">${label}</button>`;
    view.innerHTML = pageHeader({ title: 'Calendrier', crumbs: [{ label: 'Calendrier' }], sub: 'Tâches, jalons de projets et réunions de cet espace.',
      actions: `<button class="btn btn-primary" data-action="new-task" data-date="${st.view === 'day' ? st.cursor : ''}" data-meeting="1">${icon('plus', 'sm')}Créer</button>` }) +
      `<div class="page-body">
        <div class="toolbar card">
          <select class="select" data-change="cal-filter" data-key="person" aria-label="Filtrer par personne">${UI.userOptions(st.person, 'Toutes les personnes')}</select>
          <select class="select" data-change="cal-filter" data-key="project" aria-label="Filtrer par projet">${UI.projectOptions(ws, st.project, 'Tous les projets')}</select>
          <span class="spacer"></span>
          <label class="check"><input type="checkbox" data-change="cal-toggle" data-key="showTask" ${st.showTask ? 'checked' : ''}>Tâches</label>
          <label class="check"><input type="checkbox" data-change="cal-toggle" data-key="showDone" ${st.showDone ? 'checked' : ''}>Terminées</label>
          <label class="check"><input type="checkbox" data-change="cal-toggle" data-key="showProject" ${st.showProject ? 'checked' : ''}>${ws === 'pdqa' ? 'Fins de projet' : 'Lancements'}</label>
          <label class="check"><input type="checkbox" data-change="cal-toggle" data-key="showMeeting" ${st.showMeeting ? 'checked' : ''}>Réunions</label>
          ${ws === 'pdqa' ? `<label class="check"><input type="checkbox" data-change="cal-toggle" data-key="showEvent" ${st.showEvent ? 'checked' : ''}>Visites / salons</label>` : ''}
        </div>
        <div class="cal-toolbar">
          <button class="btn btn-glass btn-sm" data-action="cal-today">Aujourd'hui</button>
          <div class="row"><button class="btn btn-glass btn-sm btn-icon" data-action="cal-move" data-dir="-1" aria-label="Période précédente">${icon('left', 'sm')}</button>
            <button class="btn btn-glass btn-sm btn-icon" data-action="cal-move" data-dir="1" aria-label="Période suivante">${icon('right', 'sm')}</button></div>
          <h2 class="cal-label" aria-live="polite">${esc(Calendar.label())}</h2>
          <span class="spacer grow"></span>
          <div class="segmented" role="group" aria-label="Mode d'affichage">${viewBtn('day', 'Jour')}${viewBtn('week', 'Semaine')}${viewBtn('month', 'Mois')}</div>
        </div>
        <div class="cal-legend" aria-label="Légende">
          <span><i class="legend-swatch ev-task"></i>Tâche à venir</span><span><i class="legend-swatch ev-late"></i>Tâche en retard</span>
          <span><i class="legend-swatch ev-done"></i>Tâche terminée</span><span><i class="legend-swatch ev-project"></i>${ws === 'pdqa' ? 'Fin de projet' : 'Lancement projet'}</span>
          <span><i class="legend-swatch ev-meeting"></i>Réunion</span>${ws === 'pdqa' ? '<span><i class="legend-swatch ev-event"></i>Visite / workshop / salon</span>' : ''}<span class="muted" id="calNoDue"></span>
        </div>
        <div id="calBody"></div>
      </div>`;
    Calendar.renderBody();
  },

  renderBody() {
    const body = document.getElementById('calBody'); if (!body) return;
    const st = Calendar.state(), [from, to] = Calendar.range();
    const evs = Calendar.events(from, to);
    const noDue = Store.tasksIn(App.ws).filter(t => !t.due_date && !Rules.isTaskDone(t)).length;
    const nd = document.getElementById('calNoDue');
    if (nd) nd.innerHTML = noDue ? `· ${noDue} tâche(s) ouverte(s) sans échéance <button class="link-muted small" data-action="tasks-nodue">voir</button>` : '';
    body.innerHTML = st.view === 'month' ? Calendar.monthHTML(from, to, evs) : st.view === 'week' ? Calendar.weekHTML(from, evs) : Calendar.dayHTML(st.cursor, evs[st.cursor] || []);
  },

  chip(ev) {
    return `<button class="ev ${ev.cls}" data-action="${ev.action}" data-id="${esc(ev.id)}" title="${esc(ev.label + (ev.sub ? ' — ' + ev.sub : ''))}">${icon(ev.ic)}<span>${esc(ev.label)}</span><span class="sr-only"> (${esc(ev.state)})</span></button>`;
  },

  monthHTML(from, to, evs) {
    const st = Calendar.state(), today = Dates.today(), month = st.cursor.slice(0, 7);
    const dows = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
    let cells = '';
    for (let k = from; k <= to; k = Dates.addDays(k, 1)) {
      const list = evs[k] || [], shown = list.slice(0, 3), extra = list.length - shown.length;
      const cls = [k.slice(0, 7) !== month ? 'is-out' : '', k === today ? 'is-today' : '', Dates.isWeekend(k) ? 'is-weekend' : ''].join(' ');
      cells += `<div class="cal-cell ${cls}" role="gridcell" aria-label="${esc(Dates.long(k))}, ${list.length} élément(s)">
        <div class="cal-cell-head"><button class="cal-num" data-action="cal-goto" data-date="${k}" aria-label="Voir le ${esc(Dates.long(k))}">${Number(k.slice(8))}</button>
          <button class="cal-add" data-action="new-task" data-date="${k}" data-meeting="1" aria-label="Créer le ${esc(Dates.long(k))}">${icon('plus', 'sm')}</button></div>
        ${shown.map(Calendar.chip).join('')}
        ${extra > 0 ? `<button class="cal-more" data-action="cal-goto" data-date="${k}">+${extra} autre${extra > 1 ? 's' : ''}</button>` : ''}
      </div>`;
    }
    return `<div class="cal-month" role="grid" aria-label="${esc(Calendar.label())}"><div class="cal-dow" role="row">${dows.map(d => `<div role="columnheader">${d}</div>`).join('')}</div><div class="cal-weeks">${cells}</div></div>`;
  },

  weekHTML(start, evs) {
    const today = Dates.today();
    let cols = '';
    for (let i = 0; i < 7; i++) {
      const k = Dates.addDays(start, i), list = evs[k] || [];
      cols += `<div class="cal-wcol ${k === today ? 'is-today' : ''}">
        <button class="cal-whead" data-action="cal-goto" data-date="${k}" aria-label="Voir le ${esc(Dates.long(k))}"><div class="dow">${esc(Dates.fmt(k, { weekday: 'short' }))}</div><div class="num">${Number(k.slice(8))}</div></button>
        <div class="cal-wbody">${list.map(Calendar.chip).join('') || '<span class="muted small" style="padding:4px">—</span>'}
          <button class="cal-more" data-action="new-task" data-date="${k}" data-meeting="1">${icon('plus', 'sm')} Ajouter</button></div>
      </div>`;
    }
    return `<div class="cal-week">${cols}</div>`;
  },

  dayHTML(key, list) {
    const typeStyle = { 'ev-task': 'background:var(--info-soft);color:var(--info)', 'ev-late': 'background:var(--danger-soft);color:var(--danger)',
      'ev-done': 'background:var(--surface-3);color:var(--text-3)', 'ev-project': 'background:var(--space-soft);color:var(--space-ink)', 'ev-meeting': 'background:#F2ECFA;color:#6B3FA0', 'ev-event': 'background:var(--space-soft);color:var(--space-ink)' };
    const items = list.map(ev => `<div class="day-item"><span class="day-type" style="${typeStyle[ev.cls]}">${icon(ev.ic)}</span>
      <div class="grow"><button class="link-btn" data-action="${ev.action}" data-id="${esc(ev.id)}">${esc(ev.label)}</button><div class="cell-sub">${esc(ev.state)}${ev.sub ? ' · ' + esc(ev.sub) : ''}</div></div>
      ${ev.kind === 'task' ? UI.taskStatusBadge(Store.task(ev.id)?.status) : ''}</div>`).join('');
    return `<div class="card solid">${items ? `<div>${items}</div>` : UI.empty({ icon: 'calendar', title: 'Rien de prévu ce jour-là', sub: Dates.long(key) })}
      <div class="card-body" style="border-top:1px solid var(--line)"><button class="btn btn-glass btn-sm" data-action="new-task" data-date="${key}" data-meeting="1">${icon('plus', 'sm')}Créer une tâche ou une réunion le ${esc(Dates.short(key))}</button></div></div>`;
  },
};

Object.assign(Actions, {
  'cal-view': el => { Calendar.state().view = el.dataset.view; Calendar.render(document.getElementById('view')); },
  'cal-today': () => { Calendar.state().cursor = Dates.today(); Calendar.render(document.getElementById('view')); },
  'cal-move': el => {
    const st = Calendar.state(), dir = Number(el.dataset.dir);
    st.cursor = st.view === 'month' ? Dates.addMonths(st.cursor, dir) : Dates.addDays(st.cursor, dir * (st.view === 'week' ? 7 : 1));
    Calendar.render(document.getElementById('view'));
  },
  'cal-goto': el => { const st = Calendar.state(); st.cursor = el.dataset.date; st.view = 'day'; Calendar.render(document.getElementById('view')); },
  'tasks-nodue': () => { Object.assign(App.view('tasks', TasksPage.defaults), TasksPage.defaults, { due: 'none', status: 'open' }); Router.go(App.ws, 'tasks-all'); },
});
ChangeActions['cal-filter'] = el => { Calendar.state()[el.dataset.key] = el.value; Calendar.renderBody(); };
ChangeActions['cal-toggle'] = el => { Calendar.state()[el.dataset.key] = el.checked; Calendar.renderBody(); };
Routes.calendar = { module: 'calendar', render: v => Calendar.render(v) };

/* ==========================================================================
   Jalon — 05 · Tableau de bord et projets
   Dashboard, liste des projets, fiche/one-pager client (logique conservée),
   formulaire client (timeline, finance, versions — logique conservée),
   formulaire et fiche des projets PDQA.
   ========================================================================== */

/* ---------- Avancement des projets clients : une ligne par projet ----------
   Vue de synthèse : pour chaque projet, sa météo (dans les temps, à risque, en
   retard), sa position sur sa propre ligne de métro, sa prochaine Gate et son
   lancement. Les mêmes informations s'exportent en Excel (onglet « Avancement »
   + onglet « Étapes » avec le détail de chaque étape de chaque projet). */
const Board = {
  defaults: { meteo: '', client: '', sort: 'urgency', hideEmpty: false },
  METEO: {
    late:      { label: 'En retard',      badge: 'b-danger',  rank: 0 },
    risk:      { label: 'À risque',       badge: 'b-warn',    rank: 1 },
    ok:        { label: 'Dans les temps', badge: 'b-ok',      rank: 2 },
    unplanned: { label: 'À planifier',    badge: 'b-neutral', rank: 3 },
    paused:    { label: 'En pause',       badge: 'b-neutral', rank: 4 },
    done:      { label: 'Lancé',          badge: 'b-neutral', rank: 5 },
  },
  GATE_SOON_DAYS: 30,

  /** Toutes les informations d'avancement d'un projet (utilisées par l'écran ET par l'export). */
  info(p) {
    const today = Dates.today(), start = Dates.key(p.start_date);
    const sg = Timeline.stage(p), steps = sg.steps;
    const plan = steps.length ? Timeline.schedule(start, p.timeline_steps) : [];
    const weeks = steps.length ? Timeline.displayWeeks(start, p.timeline_steps) : [];
    const fc = Timeline.forecast(p), late = Rules.isProjectLate(p, today);
    const step = sg.kind === 'step' ? sg.step : null;
    const reasons = [];
    if (late) reasons.push('date de lancement dépassée');
    if (sg.atRisk) reasons.push('étape à risque');
    if (fc && fc.slip > 0) reasons.push(`glissement ${Timeline.fmtSlip(fc.slip)}`);
    if (fc && fc.launchGap > 0) reasons.push('timeline au-delà du lancement');
    // Prochaine Gate non franchie, avec sa date de clôture prévue.
    const gi = steps.findIndex(s => s.gate && s.status !== 'done');
    const gate = gi < 0 ? null : {
      no: Timeline.gateNumber(steps[gi].name), title: Timeline.gateTitle(steps[gi].label),
      date: plan[gi]?.end || null, week: weeks[gi] || '',
      pending: ['current', 'warning'].includes(steps[gi].status),
      decision: Store.lastGateDecision(p.id, Timeline.gateNumber(steps[gi].name)),
    };
    if (gate) gate.inDays = gate.date ? Dates.diffDays(today, gate.date) : null;
    if (gate && gate.inDays !== null && gate.inDays < 0) reasons.push(`Gate ${gate.no} dépassée de ${-gate.inDays} j`);
    const meteo = p.status === 'done' || sg.kind === 'launched' ? 'done' : p.status === 'paused' ? 'paused'
      : late ? 'late' : reasons.length ? 'risk' : sg.kind === 'unplanned' ? 'unplanned' : 'ok';
    const done = steps.filter(s => s.status === 'done').length;
    return { p, sg, steps, plan, weeks, fc, late, step, meteo, reasons, gate,
      position: step ? sg.position + 1 : sg.kind === 'launched' ? steps.length : 0,
      progress: steps.length ? Math.round(done / steps.length * 100) : null,
      lead: Rules.projectLeadName(p),
      phase: step ? CONFIG.phases.find(ph => ph.id === step.phase) : null };
  },

  /** Périmètre facultatif : { by: 'client' | 'lead', value } (pages « Par client » et « Par Project Lead »). */
  opts: {},
  rows(scope = Board.opts.scope) {
    const st = App.view('board', Board.defaults);
    const all = Store.projectsIn('customer').filter(p => !scope || Groups.of(p, scope.by) === scope.value).map(Board.info);
    const soon = r => r.gate && r.gate.inDays !== null && r.gate.inDays <= Board.GATE_SOON_DAYS;
    const list = all.filter(r => (!st.client || r.p.client_name === st.client) &&
      (!st.meteo || (st.meteo === 'gate' ? soon(r) : st.meteo === 'open' ? !['done'].includes(r.meteo) : r.meteo === st.meteo)));
    const by = {
      urgency: (a, b) => Board.METEO[a.meteo].rank - Board.METEO[b.meteo].rank || cmp(a.gate?.date, b.gate?.date) || cmp(Dates.key(a.p.launch_date), Dates.key(b.p.launch_date)),
      launch: (a, b) => cmp(Dates.key(a.p.launch_date), Dates.key(b.p.launch_date)),
      gate: (a, b) => cmp(a.gate?.date, b.gate?.date),
      client: (a, b) => cmp(a.p.client_name, b.p.client_name) || cmp(a.p.project_name, b.p.project_name),
      name: (a, b) => cmp(a.p.project_name, b.p.project_name),
    }[st.sort] || (() => 0);
    return { all, list: list.sort(by), soon };
  },

  /** opts : { scope, hideClient } — la vue (kanban ou lignes) est mémorisée par page. */
  render(box, opts = {}) {
    Board.box = box; Board.opts = opts; Board._n = 0;
    const st = App.view('board', Board.defaults);
    const mode = App.view('boardMode', {})[App.page] || (opts.scope ? 'lines' : 'kanban');
    const { all, list, soon } = Board.rows();
    const count = k => all.filter(r => r.meteo === k).length;
    const clients = uniqueSorted(all.map(r => r.p.client_name));
    const chip = (value, label, n, tone = '') => `<button class="filter-chip ${tone}" data-action="board-meteo" data-value="${value}" aria-pressed="${st.meteo === value}">${label} <b class="num">${n}</b></button>`;
    const empty = UI.empty({ icon: 'layers', title: all.length ? 'Aucun projet ne correspond aux filtres' : 'Aucun projet ici', sub: all.length ? 'Modifiez ou retirez les filtres.' : 'Créez un projet pour le voir ici.' });
    box.innerHTML = `<div class="toolbar card board-tools">
        <div class="board-chips" role="group" aria-label="Filtrer par météo">
          ${chip('', 'Tous', all.length)}${chip('ok', 'Dans les temps', count('ok'), 't-ok')}${chip('risk', 'À risque', count('risk'), 't-warn')}${chip('late', 'En retard', count('late'), 't-danger')}${chip('gate', `Gate dans les ${Board.GATE_SOON_DAYS} j`, all.filter(soon).length, 't-gate')}
        </div>
        <span class="spacer"></span>
        ${opts.scope?.by === 'client' ? '' : `<select class="select" data-change="board-filter" data-key="client" aria-label="Filtrer par client">${UI.options(clients.map(v => ({ value: v, label: v })), st.client, { placeholder: 'Tous les clients' })}</select>`}
        <select class="select" data-change="board-filter" data-key="sort" aria-label="Trier">${UI.options([{ value: 'urgency', label: 'Trier : urgence' }, { value: 'gate', label: 'Trier : prochaine Gate' }, { value: 'launch', label: 'Trier : lancement' }, { value: 'client', label: 'Trier : client' }, { value: 'name', label: 'Trier : nom' }], st.sort)}</select>
        <div class="segmented" role="group" aria-label="Affichage"><button data-action="board-mode" data-mode="kanban" aria-pressed="${mode === 'kanban'}">Kanban</button><button data-action="board-mode" data-mode="lines" aria-pressed="${mode === 'lines'}">Lignes</button></div>
        <button class="btn btn-glass" data-action="board-export">${icon('download', 'sm')}Exporter en Excel</button>
      </div>
      ${mode === 'kanban' ? (list.length ? Board.kanbanHTML(list) : `<div class="card">${empty}</div>`) : `<section class="card board" aria-labelledby="boardH">
        <div class="board-head"><h2 class="card-title" id="boardH">Où en est chaque projet</h2>
          <div class="metro-legend">${CONFIG.phases.map((ph, i) => `<span><i style="background:var(--ph${i + 1})"></i>${esc(ph.label)}</span>`).join('')}<span><i class="gate"></i>Gate</span><span><i class="here"></i>Étape actuelle</span></div></div>
        <div class="board-cols" aria-hidden="true"><span>Projet</span><span>Avancement</span><span>Prochaine Gate</span><span>Lancement</span></div>
        ${list.length ? list.map((r, i) => Board.rowHTML(r, i)).join('') : empty}
      </section>`}`;
  },

  /** Kanban de synthèse : une colonne par étape du processus, regroupées par phase (les Gates en violet). */
  kanbanHTML(list) {
    const st = App.view('board', Board.defaults), tpl = CONFIG.timelineTemplate;
    const keyOf = r => (r.sg.kind === 'step' ? String(r.step.anchorIndex) : r.sg.kind);
    const by = {}; list.forEach(r => { (by[keyOf(r)] = by[keyOf(r)] || []).push(r); });
    const show = k => !st.hideEmpty || (by[k] || []).length;
    const col = (k, head, cls = '', ph = 0) => `<section class="bk-col ${cls}" style="--c:${ph ? `var(--ph${ph})` : 'var(--neutral)'}" aria-label="${esc(head.label)} : ${(by[k] || []).length} projet(s)">
        <header class="bk-head">${head.mark}<span class="bk-title">${head.html}</span><span class="bk-count num">${(by[k] || []).length}</span></header>
        <div class="bk-cards">${(by[k] || []).map(Board.cardHTML).join('') || '<div class="bk-empty" aria-hidden="true"></div>'}</div></section>`;
    const groups = [];
    if ((by.unplanned || []).length) groups.push({ id: 'unplanned', label: 'À planifier', sub: 'Sans timeline', ph: 0,
      cols: [col('unplanned', { label: 'Timeline non planifiée', html: 'Timeline non planifiée', mark: '' })] });
    CONFIG.phases.forEach((phase, pi) => {
      const cols = tpl.map((s, i) => ({ s, i })).filter(({ s, i }) => s.phase === phase.id && show(String(i))).map(({ s, i }) => {
        const gate = Timeline.isGate(s.name), no = Timeline.gateNumber(s.name);
        return col(String(i), { label: s.name,
          html: gate ? `<b class="bk-gno">Gate ${no}</b>${esc(Timeline.gateTitle(s.name))}` : `${esc(s.name)}${s.industrialTest ? '<span class="bk-opt">Avec test industriel</span>' : ''}`,
          mark: gate ? `<span class="bk-mark gate" aria-hidden="true">G${no}</span>` : `<span class="bk-mark" aria-hidden="true">${i + 1}</span>` }, gate ? 'is-gate' : '', pi + 1);
      });
      if (cols.length) groups.push({ id: phase.id, label: phase.label, sub: phase.id, ph: pi + 1, cols });
    });
    if ((by.launched || []).length) groups.push({ id: 'launched', label: 'Lancés', sub: 'Toutes les étapes terminées', ph: 0,
      cols: [col('launched', { label: 'Timeline terminée', html: 'Timeline terminée', mark: '' })] });
    return `<div class="bk-bar"><div class="segmented" role="group" aria-label="Aller à une phase">${CONFIG.phases.map((ph, i) => `<button data-action="bk-jump" data-phase="${esc(ph.id)}"><i class="bk-dot" style="background:var(--ph${i + 1})"></i>${esc(ph.label)}</button>`).join('')}</div>
        <label class="check"><input type="checkbox" id="bk_hide" data-change="bk-hide" ${st.hideEmpty ? 'checked' : ''}>Masquer les étapes sans projet</label></div>
      <div class="bk-scroll" id="bkScroll" tabindex="0" aria-label="Kanban des projets par étape, défilement horizontal"><div class="bk">${groups.map(g => `<div class="bk-phase" data-phase="${esc(g.id)}" style="--c:${g.ph ? `var(--ph${g.ph})` : 'var(--neutral)'}">
        <div class="bk-phase-head"><span class="bk-phase-name">${esc(g.label)}</span><span class="bk-sub">${esc(g.sub)}</span></div>
        <div class="bk-cols">${g.cols.join('')}</div></div>`).join('')}</div></div>`;
  },

  cardHTML(r) {
    const { p, step, gate } = r, m = Board.METEO[r.meteo];
    const stepState = step && step.status !== 'upcoming' ? `${CONFIG.stepStatuses[step.status].label}${step.prog ? ` · ${step.prog} %` : ''}` : '';
    return `<button class="bk-card m-${r.meteo}" data-action="open-project" data-id="${esc(p.id)}" style="--i:${Board._n = (Board._n || 0) + 1}">
      <span class="bk-name">${esc(p.project_name)}</span>
      <span class="cell-sub">${esc(p.client_name || 'Client non renseigné')}${r.lead ? ` · ${esc(r.lead)}` : ''}</span>
      <span class="brow-meteo"><span class="badge ${m.badge}">${esc(m.label)}</span>${stepState ? `<span class="bk-state">${esc(stepState)}</span>` : ''}</span>
      ${r.steps.length ? `<span class="bk-prog" aria-label="Étape ${r.position} sur ${r.steps.length}"><i style="width:${Math.round(r.position / r.steps.length * 100)}%"></i></span>` : ''}
      <span class="bk-foot">${gate && !(step && step.gate) ? `<span class="bg-title"><span class="gate-mark sm" aria-hidden="true"></span>G${gate.no}${gate.week ? ` · ${esc(gate.week)}` : ''}${gate.inDays !== null && gate.inDays < 0 ? ' <span class="t-danger">dépassée</span>' : ''}</span>`
        : gate?.pending ? '<span class="badge b-gate">Décision attendue</span>' : '<span></span>'}
        <span class="due ${r.late ? 'overdue' : ''}">${r.late ? icon('alert', 'sm') : icon('rocket', 'sm')}${p.launch_date ? `S${Dates.isoWeek(Dates.key(p.launch_date))}` : '—'}</span></span>
    </button>`;
  },

  /** Ligne de métro du projet : ses propres étapes, la position actuelle mise en évidence. */
  lineHTML(r) {
    const steps = r.steps; if (!steps.length) return '<div class="bl-empty">Timeline non planifiée : ajoutez-la depuis le one-pager.</div>';
    const gap = 20, pad = 12, y = 16, w = pad * 2 + (steps.length - 1) * gap;
    const x = i => pad + i * gap;
    const cur = r.sg.kind === 'step' ? r.sg.position : steps.length;
    const ph = s => Math.max(1, CONFIG.phases.findIndex(p => p.id === s.phase) + 1);
    const segs = steps.slice(1).map((s, k) => {
      const i = k + 1;
      return `<line class="bl-seg ${i <= cur ? '' : 'todo'}" style="stroke:var(--ph${ph(s)})" x1="${x(i - 1)}" y1="${y}" x2="${x(i)}" y2="${y}"/>`;
    }).join('');
    const marks = steps.map((s, i) => {
      const here = i === cur, tip = `${s.gate ? `Gate ${Timeline.gateNumber(s.name)} : ${Timeline.gateTitle(s.label)}` : s.label} — ${CONFIG.stepStatuses[s.status].label}${r.weeks[i] ? ` · ${r.weeks[i]}` : ''}`;
      let m;
      if (s.gate) m = `<rect class="bl-gate ${s.status === 'done' ? 'done' : ''}" x="${x(i) - 7}" y="${y - 7}" width="14" height="14" rx="4"/>`;
      else m = `<circle class="bl-dot ${s.status === 'done' ? 'done' : ''}" style="--c:var(--ph${ph(s)})" cx="${x(i)}" cy="${y}" r="4.5"/>`;
      const ring = here ? `<circle class="bl-here ${s.status === 'warning' ? 'risk' : ''}" cx="${x(i)}" cy="${y}" r="11"/>` : '';
      return `<g><title>${esc(tip)}</title>${ring}${m}</g>`;
    }).join('');
    return `<svg class="bl-svg" viewBox="0 0 ${w} 32" role="img" aria-label="Étape ${r.position} sur ${steps.length}">${segs}${marks}</svg>`;
  },

  rowHTML(r, i = 0) {
    const { p, step, gate, fc } = r, m = Board.METEO[r.meteo];
    const where = step ? (step.gate ? `Gate ${Timeline.gateNumber(step.name)} : ${Timeline.gateTitle(step.label)}` : step.label)
      : r.sg.kind === 'launched' ? 'Toutes les étapes terminées' : 'Timeline non planifiée';
    const gateCell = !gate ? `<span class="muted">${r.steps.length ? 'Toutes franchies' : '—'}</span>`
      : `<span class="bg-title"><span class="gate-mark sm" aria-hidden="true"></span>Gate ${gate.no} · ${esc(gate.title)}</span>
         <span class="cell-sub">${gate.date ? `${esc(gate.week || 'S' + Dates.isoWeek(gate.date))} · ${esc(Dates.short(gate.date))}${gate.inDays !== null ? (gate.inDays < 0 ? ` · <span class="t-danger">dépassée de ${-gate.inDays} j</span>` : gate.inDays === 0 ? " · aujourd'hui" : ` · dans ${gate.inDays} j`) : ''}` : 'Date à définir'}</span>
         ${gate.pending ? (gate.decision && !CONFIG.gateDecisions[gate.decision.decision]?.passes
            ? `<span class="badge ${CONFIG.gateDecisions[gate.decision.decision]?.badge || 'b-neutral'}">${esc(CONFIG.gateDecisions[gate.decision.decision]?.label || '')}</span>`
            : '<span class="badge b-gate">Décision attendue</span>') : ''}`;
    return `<button class="brow m-${r.meteo}" data-action="open-project" data-id="${esc(p.id)}" style="--i:${i}">
      <span class="brow-proj"><span class="brow-name">${esc(p.project_name)}</span>
        <span class="cell-sub">${esc(p.client_name || 'Client non renseigné')}${r.lead ? ` · ${esc(r.lead)}` : ''}</span>
        <span class="brow-meteo"><span class="badge ${m.badge}">${esc(m.label)}</span>${r.reasons.length && r.meteo !== 'late' ? `<span class="brow-why">${esc(r.reasons.join(', '))}</span>` : ''}</span></span>
      <span class="brow-line">${Board.lineHTML(r)}
        <span class="brow-where">${r.phase ? `<b style="color:var(--ph${CONFIG.phases.indexOf(r.phase) + 1}-ink)">${esc(r.phase.label)}</b> · ` : ''}${r.steps.length ? esc(where) : ''}${r.steps.length ? ` <span class="muted">· étape ${r.position}/${r.steps.length}</span>` : ''}</span></span>
      <span class="brow-gate">${gateCell}</span>
      <span class="brow-launch"><span class="due ${r.late ? 'overdue' : ''}">${r.late ? icon('alert', 'sm') : ''}${esc(p.launch_date ? Dates.fmt(p.launch_date) : 'À définir')}</span>
        ${p.launch_date ? `<span class="cell-sub">semaine ${Dates.isoWeek(Dates.key(p.launch_date))}</span>` : ''}
        ${fc && fc.slip ? `<span class="slip ${fc.slip > 0 ? 'late' : 'early'}">${esc(Timeline.fmtSlip(fc.slip))}</span>` : ''}</span>
    </button>`;
  },

  /** Export Excel : onglet « Avancement » (une ligne par projet) + onglet « Étapes » (une ligne par étape). */
  async exportExcel() {
    try {
      if (!window.XLSX) await loadScript(Export.xlsxUrl);
      const { list } = Board.rows();
      const d = v => (v ? Dates.parse(v) : null);
      const head = ['Projet', 'Client', 'Chef de projet', 'Météo', 'Raison', 'Statut du projet', 'Phase', 'Étape actuelle', 'Statut de l\'étape',
        'Étape n°', 'Nb d\'étapes', 'Avancement (%)', 'Prochaine Gate', 'Gate : date prévue', 'Gate : semaine', 'Décision Gate attendue',
        'Fin de timeline prévue', 'Glissement (jours)', 'Lancement', 'Semaine de lancement', 'Version one-pager', 'Mis à jour le'];
      const body = list.map(r => {
        const { p, step, gate, fc } = r;
        return [p.project_name, p.client_name || '', r.lead || '', Board.METEO[r.meteo].label, r.reasons.join(', '),
          CONFIG.projectStatuses[p.status]?.label || p.status || '', r.phase ? `${r.phase.id} · ${r.phase.label}` : '',
          step ? step.label : r.sg.kind === 'launched' ? 'Toutes les étapes terminées' : 'Timeline non planifiée',
          step ? CONFIG.stepStatuses[step.status].label : '', r.position || '', r.steps.length || '', r.progress ?? '',
          gate ? `Gate ${gate.no} : ${gate.title}` : '', d(gate?.date), gate?.week || '', gate ? (gate.pending ? 'Oui' : 'Non') : '',
          d(fc?.end), fc?.slip ?? '', d(p.launch_date), p.launch_date ? Dates.isoWeek(Dates.key(p.launch_date)) : '',
          p.version || 'v1', d(p.updated_at)];
      });
      const sHead = ['Projet', 'Client', 'Phase', 'N°', 'Étape', 'Gate', 'Statut', 'Avancement (%)', 'Semaine de clôture',
        'Clôture prévue', 'Clôture réelle', 'Référence', 'Écart (jours)', 'Durée (jours)', 'Étape actuelle'];
      const sBody = [];
      list.forEach(r => r.steps.forEach((s, i) => {
        const end = r.plan[i]?.end || s.end_date || null;
        sBody.push([r.p.project_name, r.p.client_name || '', s.phase, i + 1, s.gate ? Timeline.gateTitle(s.label) : s.label,
          s.gate ? `Gate ${Timeline.gateNumber(s.name)}` : '', CONFIG.stepStatuses[s.status].label, s.prog || (s.status === 'done' ? 100 : 0),
          r.weeks[i] || '', d(end), d(s.actual_end), d(s.planned_end), Timeline.slipDays(s.planned_end, end) ?? '',
          Number(s.days) || 0, r.sg.kind === 'step' && r.sg.position === i ? 'Oui' : '']);
      }));
      const sheet = (h, rows) => {
        const sh = XLSX.utils.aoa_to_sheet([h, ...rows], { cellDates: true, dateNF: 'dd/mm/yyyy' });
        sh['!cols'] = h.map((t, i) => ({ wch: Math.min(48, Math.max(t.length + 2, ...rows.map(x => String(x[i] instanceof Date ? '00/00/0000' : x[i] ?? '').length + 2))) }));
        sh['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: rows.length, c: h.length - 1 } }) };
        return sh;
      };
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, sheet(head, body), 'Avancement');
      XLSX.utils.book_append_sheet(wb, sheet(sHead, sBody), 'Étapes');
      const scope = Board.opts.scope ? '_' + String(Board.opts.scope.value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w-]+/g, '_') : '';
      const file = `${CONFIG.appName}_avancement_projets${scope}_${Dates.today()}.xlsx`;
      XLSX.writeFile(wb, file);
      Toast.show(`${list.length} projet(s) exporté(s) : ${file}`);
      return { head, body, sHead, sBody, file };
    } catch (e) { Toast.error(e); return null; }
  },
};

/* ---------- Liste des projets (vue principale) ---------- */
const ProjectsPage = {
  defaults: { q: '', client: '', lead: '', status: '', sort: 'updated', dir: 'desc' },
  render(view) {
    const ws = App.ws, st = App.view('projects', ProjectsPage.defaults), list = Store.projectsIn(ws);
    const pdqa = ws === 'pdqa';
    const groupValues = uniqueSorted(list.map(p => pdqa ? p.pdqa_data.department : p.client_name));
    const leads = uniqueSorted(list.map(Rules.projectLeadName));
    view.innerHTML = pageHeader({ title: pdqa ? 'Toutes les initiatives' : 'Liste complète', crumbs: [{ page: 'projects', label: 'Projets' }, { label: pdqa ? 'Toutes les initiatives' : 'Liste complète' }], sub: pdqa ? 'Initiatives internes, qualité et projets transverses.' : 'Projets de développement liés aux clients.',
      actions: `<button class="btn btn-primary" data-action="new-project">${icon('plus', 'sm')}Nouveau projet</button>` }) +
      `<div class="page-body"><div class="toolbar card" role="search">
        <div class="search">${icon('search', 'sm')}<input class="input" type="search" placeholder="Rechercher un projet" value="${esc(st.q)}" data-input="projects-filter" data-key="q" aria-label="Rechercher un projet par nom"></div>
        <select class="select" data-change="projects-filter" data-key="client" aria-label="${pdqa ? 'Filtrer par département' : 'Filtrer par client'}">${UI.options(groupValues.map(v => ({ value: v, label: v })), st.client, { placeholder: pdqa ? 'Tous les départements' : 'Tous les clients' })}</select>
        <select class="select" data-change="projects-filter" data-key="lead" aria-label="Filtrer par chef de projet">${UI.options(leads.map(v => ({ value: v, label: v })), st.lead, { placeholder: 'Tous les chefs de projet' })}</select>
        <select class="select" data-change="projects-filter" data-key="status" aria-label="Filtrer par statut">${UI.options([...Object.entries(CONFIG.projectStatuses).map(([id, s]) => ({ value: id, label: s.label })), { value: 'late', label: 'En retard' }], st.status, { placeholder: 'Tous les statuts' })}</select>
        <span class="spacer"></span><span class="result-count" id="projCount" aria-live="polite"></span>
        <button class="btn btn-glass btn-sm" data-action="projects-export" title="Exporter les projets affichés">${icon('download', 'sm')}Exporter en Excel</button>
      </div><div id="projTable"></div></div>`;
    ProjectsPage.renderList();
  },
  /** Lignes affichées, dans l'ordre du tri courant (utilisé par la liste et par l'export Excel). */
  sortedRows() {
    const st = App.view('projects', ProjectsPage.defaults);
    const key = { name: r => r.p.project_name, group: r => r.group, lead: r => r.lead, status: r => CONFIG.projectStatuses[r.p.status]?.label,
      start: r => Dates.key(r.p.start_date), due: r => Dates.key(r.p.launch_date), progress: r => r.progress, priority: r => -(Number(r.p.priority) || 0),
      updated: r => r.p.updated_at || r.p.created_at }[st.sort] || (r => r.p.project_name);
    const sign = st.dir === 'desc' ? -1 : 1;
    return ProjectsPage.rows().sort((a, b) => {
      const va = key(a), vb = key(b);
      if (va === null || va === undefined || va === '') return 1; if (vb === null || vb === undefined || vb === '') return -1;
      return sign * cmp(va, vb);
    });
  },
  rows() {
    const ws = App.ws, st = App.view('projects', ProjectsPage.defaults), q = st.q.toLowerCase(), tasks = Store.tasksIn(ws);
    return Store.projectsIn(ws).map(p => ({ p, lead: Rules.projectLeadName(p), group: ws === 'pdqa' ? p.pdqa_data.department || '' : p.client_name || '', progress: Rules.projectProgress(p, tasks), late: Rules.isProjectLate(p) }))
      .filter(r => (!q || r.p.project_name?.toLowerCase().includes(q) || r.group.toLowerCase().includes(q)) &&
        (!st.client || r.group === st.client) && (!st.lead || r.lead === st.lead) &&
        (!st.status || (st.status === 'late' ? r.late : r.p.status === st.status)));
  },
  renderList() {
    const ws = App.ws, pdqa = ws === 'pdqa', st = App.view('projects', ProjectsPage.defaults);
    const box = document.getElementById('projTable'); if (!box) return;
    const rows = ProjectsPage.sortedRows();
    document.getElementById('projCount').textContent = `${rows.length} projet${rows.length > 1 ? 's' : ''}`;
    if (!rows.length) {
      const any = Store.projectsIn(ws).length;
      box.innerHTML = `<div class="card">${any ? UI.empty({ icon: 'search', title: 'Aucun projet ne correspond aux filtres', sub: 'Modifiez la recherche ou réinitialisez les filtres.', action: '<button class="btn btn-glass" data-action="projects-reset">Réinitialiser les filtres</button>' })
        : UI.empty({ icon: 'folder', title: 'Aucun projet dans cet espace', sub: pdqa ? 'Créez la première initiative interne.' : 'Créez le premier projet client.', action: `<button class="btn btn-primary" data-action="new-project">${icon('plus', 'sm')}Nouveau projet</button>` })}</div>`;
      return;
    }
    const H = (l, k) => UI.sortHeader(l, k, st);
    box.innerHTML = `<div class="table-wrap"><table class="table"><thead><tr>
      ${H('Projet', 'name')}${H(pdqa ? 'Département' : 'Client', 'group')}${H(pdqa ? 'Responsable' : 'Chef de projet', 'lead')}${H('Statut', 'status')}${pdqa ? H('Priorité', 'priority') : ''}${H('Début', 'start')}${H(pdqa ? 'Fin' : 'Lancement', 'due')}${H('Progression', 'progress')}<th><span class="sr-only">Actions</span></th>
      </tr></thead><tbody>${rows.map(({ p, lead, group, progress, late }) => `<tr class="is-clickable ${late ? 'is-late' : ''}" data-action="open-project" data-id="${esc(p.id)}">
        <td style="min-width:220px"><button class="link-btn cell-title" data-action="open-project" data-id="${esc(p.id)}">${esc(p.project_name)}</button>
          <div class="cell-sub">${pdqa ? esc((p.description || '').slice(0, 80)) : `${esc(p.version || 'v1')}${p.updated_at ? ' · mis à jour le ' + esc(Dates.short(p.updated_at)) : ''}`}</div></td>
        <td>${esc(group || '—')}</td><td>${lead ? esc(lead) : '<span class="muted">—</span>'}</td>
        <td>${UI.projectStatusBadge(p.status)}${late ? ' <span class="badge b-danger">En retard</span>' : ''}</td>
        ${pdqa ? `<td>${UI.projectPriority(p.priority)}</td>` : ''}
        <td><span class="due">${esc(Dates.fmt(p.start_date))}</span></td><td>${UI.projectDue(p)}${(() => { const fc = !pdqa && Timeline.forecast(p); return fc && fc.slip ? `<div class="cell-sub"><span class="slip ${fc.slip > 0 ? 'late' : 'early'}">${esc(Timeline.fmtSlip(fc.slip))}</span> sur la timeline</div>` : ''; })()}</td><td>${UI.progress(progress)}</td>
        <td class="col-actions">${Menu.html([
          { action: 'open-project', icon: 'open', label: 'Ouvrir', data: { id: p.id } },
          { action: 'edit-project', icon: 'edit', label: 'Modifier', data: { id: p.id } },
          { action: 'new-task', icon: 'plus', label: 'Nouvelle tâche', data: { project: p.id } },
          ...(pdqa ? [] : [{ action: 'new-version', icon: 'copy', label: 'Nouvelle version', data: { id: p.id } }]),
          { action: 'delete-project', icon: 'trash', label: 'Supprimer', danger: true, data: { id: p.id } }])}</td>
      </tr>`).join('')}</tbody></table></div>`;
  },
};
InputActions['projects-filter'] = ChangeActions['projects-filter'] = el => { App.view('projects', ProjectsPage.defaults)[el.dataset.key] = el.value; ProjectsPage.renderList(); };
Actions['projects-export'] = () => Export.projects(ProjectsPage.sortedRows());
Actions['projects-reset'] = () => { Object.assign(App.view('projects', ProjectsPage.defaults), ProjectsPage.defaults); ProjectsPage.render(document.getElementById('view')); };

/* ---------- Actions communes aux projets ---------- */
Object.assign(Actions, {
  'new-project': () => Router.go(App.ws, 'project-edit', 'new'),
  'edit-project': el => Router.go(App.ws, 'project-edit', el.dataset.id),
  'new-version': el => { App.formPreset = { newVersionOf: el.dataset.id }; Router.go(App.ws, 'project-edit', el.dataset.id); },
  async 'delete-project'(el) {
    const ws = App.ws, p = Store.projectIn(ws, el.dataset.id); if (!p) { Toast.show('Projet introuvable.', 'error'); return; }
    const tasks = Store.tasks.filter(t => t.project_id === p.id).length, meetings = Store.meetings.filter(m => m.project_id === p.id).length;
    if (ws === 'pdqa' && (tasks || meetings)) {
      // Délier les tâches les rendrait visibles dans l'espace client : on bloque plutôt que de supprimer ou d'exposer des données.
      alert(`Ce projet PDQA contient ${tasks} tâche(s) et ${meetings} compte(s)-rendu(s).\nSupprimez-les ou passez le projet au statut « Terminé ».`);
      return;
    }
    if (!confirm(`Supprimer le projet « ${p.project_name} » ?${tasks ? `\n${tasks} tâche(s) seront conservées sans projet.` : ''}\nCette action est définitive.`)) return;
    try {
      // Logique d'origine conservée : historique supprimé, tâches et meetings déliés.
      await Store.db.from('project_versions').delete().eq('project_id', p.id);
      await Store.db.from('tasks').update({ project_id: null }).eq('project_id', p.id);
      await Store.db.from('meeting_minutes').update({ project_id: null }).eq('project_id', p.id);
      const { error } = await Store.db.from('projects').delete().eq('id', p.id);
      if (error) throw error;
      Audit.log({ entity: 'project', entityId: p.id, projectId: p.id, action: 'delete', summary: `Projet supprimé : « ${p.project_name} »` });
      await Promise.all([Store.refreshTable('projects'), Store.refreshTable('tasks'), Store.refreshTable('meeting_minutes')]);
      Toast.show('Projet supprimé.');
      if (App.page === 'projects-all') Router.refresh(); else Router.go(ws, 'projects');
    } catch (err) { Toast.error(err); }
  },
});

/** Bloc « Tâches du projet » affiché sous chaque fiche projet. */

  },
  showVersion(el) {

    const v = (OnePager.versions || []).find(x => x.id === el.dataset.ver); if (!v) return;
    const s = v.snapshot || {};
    OnePager.render({ ...s, id: el.dataset.proj, rag_timeline: s.rag_timeline || 'green', rag_team: s.rag_team || 'green', rag_fin: s.rag_fin || 'green' });
  },
  /** live = version actuelle (étapes cliquables, tâches reliées) ; false = ancienne version affichée en lecture. */
  render(p, live = false) {
    const box = document.getElementById('opContent'); if (!box) return;
    const od = p.org_data || {};
    const fc = Timeline.forecast(p);
    const slip = fc && fc.slip ? `<span class="slip ${fc.slip > 0 ? 'late' : 'early'}">${esc(Timeline.fmtSlip(fc.slip))}</span>` : '';
    const launchWarn = fc && fc.launchGap > 0 ? `<div class="notice mb-4">${icon('alert')}<span>La timeline se termine le <b>${esc(Dates.fmt(fc.end))}</b>, soit ${fc.launchGap} jour(s) après la date de lancement prévue (${esc(Dates.fmt(p.launch_date))}). Mettez à jour la date de lancement ou la timeline.</span></div>` : '';
    const rag = OnePager.rag(p);
    const fin = (label, v, unit) => `<div class="op-fin-item"><div class="op-fin-lbl">${label}</div><div class="op-fin-val">${v !== null && v !== undefined && v !== '' ? `${esc(v)} ${unit}` : '<span class="muted">Non renseigné</span>'}</div></div>`;
    const hasFin = [p.forecast_revenue, p.budget_revenue, p.forecast_margin, p.budget_margin].some(v => v !== null && v !== undefined && v !== '');
    const meta = (label, value) => `<div class="op-mf"><span class="op-ml">${label}</span><span class="op-mv">${value}</span></div>`;
    box.innerHTML = `<div class="op-header"><div class="grow">
        <div class="op-title"><span class="op-client">${esc(p.client_name || 'Client non renseigné')}</span><span class="op-proj">${esc(p.project_name)}</span></div>
        <div class="op-meta">${meta('Début', esc(Dates.fmt(p.start_date)))}${meta('Lancement', esc(Dates.fmt(p.launch_date)))}${fc ? meta('Fin de timeline', `${esc(Dates.fmt(fc.end))} ${slip}`) : ''}${meta('Version', esc(p.version || 'v1'))}${meta('Priorité', esc(CONFIG.projectPriorities[p.priority || 1]))}${meta('Statut', esc(CONFIG.projectStatuses[p.status]?.label || '—'))}</div></div>
      <div class="op-rag-grp" aria-label="Météo du projet">${rag.map(r => `<div class="op-rag-item" title="${esc(r.title)}"><span class="op-rag-dot rag-${r.level}" aria-hidden="true"></span><span>${r.label}</span><span class="sr-only">${esc(r.title)}</span></div>`).join('')}</div></div>
      ${launchWarn}<section class="op-sec"><h2 class="op-sec-title">Timeline</h2>${OnePager.timelineHTML(p, live)}</section>
      <div class="op-mid"><section class="op-sec"><h2 class="op-sec-title">Équipe projet</h2>${OnePager.orgHTML(od)}</section>
        <section class="op-sec"><h2 class="op-sec-title">Finance</h2>${hasFin ? `<div class="op-fin"><div class="op-fin-grid">
          ${fin('Revenue forecast', p.forecast_revenue, 'k€')}${fin('Revenue budget', p.budget_revenue, 'k€')}${fin('Marge forecast', p.forecast_margin, '%')}${fin('Marge budget', p.budget_margin, '%')}</div>
          <div class="op-fin-chart"><canvas id="finCanvas" aria-label="Graphique revenue et marge" role="img"></canvas></div></div>` : '<p class="muted small">Aucune donnée financière. Complétez-les via « Modifier ».</p>'}</section></div>
      <div class="op-bottom"><section class="op-sec"><h2 class="op-sec-title">Risques</h2><div class="op-txt">${p.risks ? esc(p.risks) : '<span class="muted">Aucun risque enregistré.</span>'}</div></section>
        <section class="op-sec"><h2 class="op-sec-title">Actions</h2><div class="op-txt">${p.actions ? esc(p.actions) : '<span class="muted">Aucune action enregistrée.</span>'}</div></section></div>`;
    const canvas = document.getElementById('finCanvas');
    if (OnePager.chart) { OnePager.chart.destroy(); OnePager.chart = null; }
    if (canvas && window.Chart && (p.forecast_revenue || p.budget_revenue)) {
      const css = getComputedStyle(document.body), muted = css.getPropertyValue('--text-3').trim() || '#6E717B', grid = css.getPropertyValue('--line').trim() || 'rgba(0,0,0,.08)';
      const ink = css.getPropertyValue('--text-2').trim() || '#4A4D57';
      OnePager.chart = new Chart(canvas.getContext('2d'), {
        data: { labels: ['Forecast', 'Budget'], datasets: [
          { type: 'bar', label: 'Revenue (k€)', data: [p.forecast_revenue || 0, p.budget_revenue || 0], backgroundColor: 'rgba(255,150,32,.8)', borderRadius: 4, maxBarThickness: 48, yAxisID: 'y' },
          { type: 'line', label: 'Marge %', data: [p.forecast_margin || 0, p.budget_margin || 0], borderColor: ink, backgroundColor: ink, pointRadius: 4, yAxisID: 'y2', tension: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11, family: 'Overpass' }, boxWidth: 10, color: muted } } },
          scales: { x: { ticks: { color: muted }, grid: { display: false } }, y: { beginAtZero: true, position: 'left', ticks: { font: { size: 10 }, color: muted }, grid: { color: grid } },
            y2: { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { callback: v => v + '%', font: { size: 10 }, color: muted }, max: 60 } } },
      });

  },

  /** Météo : Timeline calculée depuis les étapes et l'échéance ; Équipe et Finance si renseignées en base. */
  rag(p) {
    const steps = Timeline.enrich(p.timeline_steps);
    const late = Rules.isProjectLate(p), risk = steps.some(s => s.status === 'warning');
    const tl = !steps.length ? { level: 'none', title: 'Timeline : non planifiée' } : late || risk
      ? { level: 'red', title: `Timeline : ${late ? 'date de lancement dépassée' : 'étape à risque'}` } : { level: 'green', title: 'Timeline : dans les temps' };
    const map = { green: 'conforme', yellow: 'à surveiller', red: 'critique' };
    const field = (v, name) => (map[v] ? { level: v, title: `${name} : ${map[v]}` } : { level: 'none', title: `${name} : non évalué` });
    return [{ label: 'Timeline', ...tl }, { label: 'Équipe', ...field(p.rag_team, 'Équipe') }, { label: 'Finance', ...field(p.rag_fin, 'Finance') }];
  },

  /** Timeline en une rangée par phase ; les 4 Gates ont leur propre couleur. */
  timelineHTML(p, live = false) {
    const steps = Timeline.enrich(p.timeline_steps);
    if (!steps.length) return '<p class="muted small">Aucune étape définie. Ajoutez la timeline via « Modifier ».</p>';
    const plan = Timeline.schedule(Dates.key(p.start_date), p.timeline_steps);
    const weeks = Timeline.displayWeeks(Dates.key(p.start_date), p.timeline_steps);
    steps.forEach((s, i) => { s.week = weeks[i]; });
    const stats = live ? Timeline.taskStats(p.id, Store.tasksIn('customer')) : new Map();
    steps.forEach((s, i) => {
      s.forecastEnd = plan[i]?.end || s.end_date || null;
      s.slip = (s.status === 'done' || s.status === 'current' || s.status === 'warning') ? Timeline.slipDays(s.planned_end, s.forecastEnd) : null;
      const t = stats.get(Timeline.stepKey(s));
      s.tasks = t || null;
      if (t && t.total) s.prog = Math.round(t.done / t.total * 100);   // l'avancement suit les tâches reliées
    });
    const rows = CONFIG.phases.map(ph => ({ ph, steps: steps.filter(s => s.phase === ph.id) })).filter(r => r.steps.length);
    const other = steps.filter(s => !CONFIG.phases.some(ph => ph.id === s.phase));
    if (other.length) rows.push({ ph: { id: 'Autres', label: 'Étapes' }, steps: other });
    const chev = (s, first) => {
      const st = CONFIG.stepStatuses[s.status];
      const name = s.gate ? `<span class="chev-gate-no">Gate ${Timeline.gateNumber(s.name)}</span><span class="chev-name">${esc(Timeline.gateTitle(s.label))}</span>` : `<span class="chev-name">${esc(s.label)}</span>`;
      const tip = [`${s.label} — ${st.label}`, s.week && `semaine de clôture ${s.week}`, s.forecastEnd && `clôture ${s.actual_end ? 'réelle' : 'prévue'} le ${Dates.fmt(s.forecastEnd)}`,
        s.planned_end && `référence ${Dates.fmt(s.planned_end)}`, s.tasks && `${s.tasks.done}/${s.tasks.total} tâche(s) terminée(s)`, live && 'cliquer pour ajouter une tâche'].filter(Boolean).join(' · ');
      const slip = s.slip ? `<span class="chev-slip ${s.slip > 0 ? 'late' : 'early'}">${esc(Timeline.fmtSlip(s.slip))}</span>` : '';
      const tasks = s.tasks ? `<span class="chev-tasks">${s.gate && s.tasks.open ? `${s.tasks.open} ouverte${s.tasks.open > 1 ? 's' : ''}` : `${s.tasks.done}/${s.tasks.total} tâche${s.tasks.total > 1 ? 's' : ''}`}</span>` : '';
      const inner = `${name}<span class="chev-foot">${s.week ? `<span>${esc(s.week)}</span>` : ''}${s.gate ? `<span class="chev-state">${esc(st.gateLabel)}</span>` : s.prog > 0 && s.prog < 100 ? `<span>${s.prog} %</span>` : ''}${slip}${tasks}</span>
        <span class="sr-only">${esc(st.label)}</span>${s.prog > 0 && s.status !== 'done' ? `<span class="chev-bar"><span style="width:${s.prog}%"></span></span>` : ''}`;
      return `<li class="chev s-${s.status} ${s.gate ? 'is-gate' : ''} ${first ? 'first' : ''}" title="${esc(tip)}">${live
        ? `<button class="chev-btn" data-action="new-task" data-project="${esc(p.id)}" data-step="${esc(Timeline.stepKey(s))}" aria-label="${esc(tip)}">${inner}</button>` : inner}</li>`;
    };
    return `<div class="tl-rows">${rows.map(r => `<div class="tl-row"><div class="tl-row-head"><span class="tl-row-ph">${esc(r.ph.id)}</span><span class="tl-row-lbl">${esc(r.ph.label)}</span></div>
        <ol class="chev-row">${r.steps.map((s, i) => chev(s, i === 0)).join('')}</ol></div>`).join('')}</div>
      <div class="chev-legend"><span><i class="lg s-done"></i>Terminé</span><span><i class="lg s-current"></i>En cours</span><span><i class="lg s-warning"></i>À risque</span><span><i class="lg s-upcoming"></i>À venir</span><span><i class="lg is-gate"></i>Gate (décision)</span></div>`;
  },

  /** Organigramme en HTML : les noms s'affichent en entier. Six rôles fixes, chacun sa couleur. */
  orgHTML(od) {
    const roles = [['operations', 'Opérations', '#C27C0E'], ['technique', 'Technique', '#2F6FB5'], ['sales', 'Sales', '#2E8B57'], ['supply_chain', 'Supply Chain', '#7D4CAF'], ['finance', 'Finance', '#C0392B']];
    const card = (role, name, color, lead) => `<div class="org-card ${lead ? 'is-lead' : ''}" style="--role:${color}"><span class="org-role">${role}</span><span class="org-name ${name ? '' : 'muted'}">${esc(name || 'À désigner')}</span></div>`;
    return `<div class="org"><div class="org-top">${card('Project Lead', od.lead, '#2E8B57', true)}</div><div class="org-line" aria-hidden="true"></div>
      <div class="org-grid">${roles.map(([k, l, c]) => card(l, od[k], c)).join('')}</div></div>`;
  },
};

        </div></section>

        </section>
        <section class="card solid card-pad"><h2 class="section-title">Finance</h2><div class="form-grid">
          ${f('f_fr', 'Revenue forecast (k€)', p?.forecast_revenue, 'number', 'placeholder="700"')}${f('f_br', 'Revenue budget (k€)', p?.budget_revenue, 'number', 'placeholder="480"')}
          ${f('f_fm', 'Marge forecast (%)', p?.forecast_margin, 'number', 'placeholder="32"')}${f('f_bm', 'Marge budget (%)', p?.budget_margin, 'number', 'placeholder="28"')}
        </div></section>

      </div>`;
