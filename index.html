      { page: 'tasks-by', param: 'person', icon: 'users', color: 'var(--ph2)', title: 'Par personne', sub: plural(people, 'personne a des tâches', 'personnes ont des tâches') },
      { page: 'tasks-by', param: 'project', icon: 'folder', color: 'var(--ph1)', title: 'Par projet', sub: plural(projs, 'projet a des tâches', 'projets ont des tâches') },
      { page: 'kanban', icon: 'kanban', color: 'var(--ph3)', title: 'Kanban', sub: 'À faire, en cours, terminé : glisser pour changer de statut' },
      { page: 'tasks-all', icon: 'list', color: 'var(--bar)', title: 'Toutes les tâches', sub: `${plural(tasks.length, 'tâche', 'tâches')}, filtres et tri` },
    ];
    view.innerHTML = pageHeader({ title: 'Tâches', sub: 'Choisissez comment parcourir les tâches.', crumbs: [{ label: 'Tâches' }],
      actions: `<button class="btn btn-primary" data-action="new-task">${icon('plus', 'sm')}Nouvelle tâche</button>` }) +
      `<div class="page-body">${Tiles.html(tiles)}</div>`;
  },

  groups(view, by) {
    if (by !== 'person' && by !== 'project') { Router.redirect(App.ws, 'tasks'); return; }
    const ws = App.ws, today = Dates.today(), tasks = Store.tasksIn(ws);
    const stat = list => { const o = list.filter(t => !Rules.isTaskDone(t)); return { open: o.length, late: o.filter(t => Rules.isTaskOverdue(t, today)).length }; };
    let tiles;
    if (by === 'person') {
      tiles = Store.users.map(u => ({ u, s: stat(tasks.filter(t => t.assignee_id === u.id)) })).filter(x => x.s.open)
        .sort((a, b) => b.s.late - a.s.late || b.s.open - a.s.open || cmp(a.u.name, b.u.name))
        .map(({ u, s }) => ({ page: 'tasks-group', param: `person:${u.id}`, avatar: avatar(u, 44), title: u.name, sub: `${u.role ? u.role + ' · ' : ''}${plural(s.open, 'tâche ouverte', 'tâches ouvertes')}`,
          meta: s.late ? `<span class="badge b-danger">${s.late} en retard</span>` : '<span class="badge b-ok">Rien en retard</span>' }));
      const none = stat(tasks.filter(t => !t.assignee_id));
      if (none.open) tiles.push({ page: 'tasks-group', param: 'person:', icon: 'users', color: 'var(--neutral)', title: 'Non assignées', sub: plural(none.open, 'tâche ouverte', 'tâches ouvertes') });
    } else {
      tiles = Store.projectsIn(ws).map(p => ({ p, s: stat(tasks.filter(t => t.project_id === p.id)) })).filter(x => x.s.open)
        .sort((a, b) => b.s.late - a.s.late || b.s.open - a.s.open || cmp(a.p.project_name, b.p.project_name))
        .map(({ p, s }) => ({ page: 'tasks-group', param: `project:${p.id}`, icon: 'folder', color: 'var(--bar)', title: p.project_name,
          sub: `${p.client_name || p.pdqa_data?.department || ''}${p.client_name || p.pdqa_data?.department ? ' · ' : ''}${plural(s.open, 'tâche ouverte', 'tâches ouvertes')}`,
          meta: s.late ? `<span class="badge b-danger">${s.late} en retard</span>` : '' }));
      const none = stat(tasks.filter(t => !t.project_id));
      if (none.open) tiles.push({ page: 'tasks-group', param: 'project:', icon: 'list', color: 'var(--neutral)', title: 'Sans projet', sub: plural(none.open, 'tâche ouverte', 'tâches ouvertes') });
    }
    const title = by === 'person' ? 'Par personne' : 'Par projet';
    view.innerHTML = pageHeader({ title, sub: by === 'person' ? 'Les personnes qui ont des tâches ouvertes.' : 'Les projets qui ont des tâches ouvertes.', crumbs: [{ page: 'tasks', label: 'Tâches' }, { label: title }] }) +
      `<div class="page-body">${tiles.length ? Tiles.html(tiles) : `<div class="card">${UI.empty({ icon: 'check', title: 'Aucune tâche ouverte', sub: 'Tout est à jour.' })}</div>`}</div>`;
  },

  group(view, param) {
    const i = String(param || '').indexOf(':'), kind = param?.slice(0, i), id = param?.slice(i + 1) ?? '';
    const ws = App.ws, today = Dates.today(), st = App.view('tasks', TasksPage.defaults), g = App.view('tasksGroup', { done: false });
    let all, title, crumbs, sub = '', projectId = '';
    if (kind === 'person') {
      const u = Store.user(id); if (id && !u) { Router.redirect(ws, 'tasks'); return; }
      all = Store.tasksIn(ws).filter(t => (id ? t.assignee_id === id : !t.assignee_id));
      title = id === Store.me.id ? 'Mes tâches' : u ? u.name : 'Non assignées'; sub = u?.role || '';
      crumbs = id === Store.me.id ? [{ page: 'tasks', label: 'Tâches' }, { label: title }] : [{ page: 'tasks', label: 'Tâches' }, { page: 'tasks-by', param: 'person', label: 'Par personne' }, { label: title }];
    } else if (kind === 'project') {
      const p = id ? Store.projectIn(ws, id) : null; if (id && !p) { Router.redirect(ws, 'tasks'); return; }
      all = Store.tasksIn(ws).filter(t => (id ? t.project_id === id : !t.project_id));
      title = p ? p.project_name : 'Sans projet'; sub = p ? p.client_name || p.pdqa_data?.department || '' : ''; projectId = id;
      crumbs = [{ page: 'tasks', label: 'Tâches' }, { page: 'tasks-by', param: 'project', label: 'Par projet' }, { label: title }];
    } else if (kind === 'late') {
      all = Store.tasksIn(ws).filter(t => Rules.isTaskOverdue(t, today)); title = 'Tâches en retard';
      crumbs = [{ page: 'tasks', label: 'Tâches' }, { label: 'En retard' }];
    } else { Router.redirect(ws, 'tasks'); return; }
    const done = all.filter(Rules.isTaskDone).length, open = all.length - done;
    const list = sortTasks(all.filter(t => g.done || !Rules.isTaskDone(t)), st.sort, st.dir);
    view.innerHTML = pageHeader({ title, sub: [sub, `${plural(open, 'ouverte', 'ouvertes')} · ${plural(done, 'terminée', 'terminées')}`].filter(Boolean).join(' · '), crumbs,
      actions: `${projectId ? `<button class="btn btn-glass" data-action="open-project" data-id="${esc(projectId)}">${icon('open', 'sm')}Ouvrir le projet</button>` : ''}
        <button class="btn btn-primary" data-action="new-task" ${projectId ? `data-project="${esc(projectId)}"` : ''}>${icon('plus', 'sm')}Nouvelle tâche</button>` }) +
      `<div class="page-body"><div class="toolbar card"><label class="check"><input type="checkbox" id="tg_done" data-change="tasks-group-done" ${g.done ? 'checked' : ''}>Afficher les tâches terminées</label>
        <span class="spacer"></span><span class="result-count">${plural(list.length, 'tâche', 'tâches')}</span></div>
        ${list.length ? taskTableHTML(list, st, { showProject: kind !== 'project' }) : `<div class="card">${UI.empty({ icon: 'check', title: 'Aucune tâche ouverte ici', sub: done ? 'Cochez « Afficher les tâches terminées » pour voir les autres.' : '' })}</div>`}</div>`;
  },
};
ChangeActions['tasks-group-done'] = el => { App.view('tasksGroup', { done: false }).done = el.checked; Router.refresh(); };

/* ==========================================================================
   Jalon — 08 · Modules de l'espace PDQA
   Innovation, Visites / Workshop / Salon, Planning des projets, Prévalidation MP.
   Les données de ces modules ne sont chargées que pour les fonctions autorisées
   dans l'espace PDQA (voir PdqaData.load) et toutes les lectures et écritures
   passent par PdqaData, qui revérifie l'accès à chaque appel.
   ========================================================================== */

/* ---------- Accès aux données des modules PDQA ---------- */
const PdqaData = {
  /** Clé dans Store → table Supabase, indicateur de migration, tri, nom pour l'historique. */
  TABLES: {
    innovations: { table: 'pdqa_innovations', flag: 'innovations', order: 'created_at', entity: 'innovation' },
    events:      { table: 'pdqa_events', flag: 'events', order: 'start_date', entity: 'event' },
    mpItems:     { table: 'pdqa_mp_prevalidations', flag: 'mp', order: 'created_at', entity: 'mp' },
  },
  list(key) { return Store.canSee('pdqa') ? Store[key] : []; },
  get(key, id) { return id ? PdqaData.list(key).find(x => x.id === id) || null : null; },
  /** false seulement si la table n'existe pas encore (migration 004 non exécutée). */
  ready(key) { return Store.schema[PdqaData.TABLES[key].flag] !== false; },
  load(key) {
    const t = PdqaData.TABLES[key];
    if (!Perm.canAccessPDQA(Store.me)) { Store[key] = []; return Promise.resolve(); }   // rien n'est téléchargé sans accès
    return Store.loadOptional(t.table, key, t.flag, t.order);
  },
  loadAll() { return Promise.all(Object.keys(PdqaData.TABLES).map(PdqaData.load)); },
  guard(key) {
    if (!Store.canSee('pdqa')) throw new Error('Action réservée à l\'espace PDQA.');
    if (!PdqaData.ready(key)) throw new Error('pdqa_ : base pas encore à jour');
  },
  /** Crée (id vide) ou met à jour une ligne, et vérifie que la base a confirmé l'enregistrement. */
  async save(key, id, payload, summary) {
    PdqaData.guard(key);
    const t = PdqaData.TABLES[key], row = { ...payload, updated_at: new Date().toISOString() };
    const { data, error } = id
      ? await Store.db.from(t.table).update(row).eq('id', id).select()
      : await Store.db.from(t.table).insert({ ...row, created_by: Store.me?.id || null }).select();
    if (error) throw error;
    if (!data || !data.length) throw new Error('La base n\'a pas confirmé l\'enregistrement.');
    const saved = data[0], current = PdqaData.get(key, id);
    if (current) Object.assign(current, saved); else Store[key].unshift(saved);
    Audit.log({ entity: t.entity, entityId: saved.id, projectId: saved.project_id || null, action: id ? 'update' : 'create', summary });
    return saved;
  },
  async remove(key, id, summary) {
    PdqaData.guard(key);
    const t = PdqaData.TABLES[key], item = PdqaData.get(key, id);
    if (!item) throw new Error('Élément introuvable.');
    const { error } = await Store.db.from(t.table).delete().eq('id', id);
    if (error) throw error;
    Store[key] = Store[key].filter(x => x.id !== id);
    Audit.log({ entity: t.entity, entityId: id, projectId: item.project_id || null, action: 'delete', summary });
  },
  /** Bandeau affiché tant que la migration 004 n'a pas été exécutée. */
  notice(key) {
    return PdqaData.ready(key) ? '' : `<div class="notice mb-4">${icon('alert')}<span>Ce module a besoin de nouvelles tables dans la base.
      Exécutez une fois le script <b>MIGRATION_004_MODULES_PDQA.sql</b> dans Supabase (SQL Editor → New query → Run), puis rechargez la page.</span></div>`;
  },
};

/* ---------- Petits outils de formulaire (panneaux latéraux et pages) ---------- */
const Form = {
  field(id, label, control, { req = false, full = false, hint = '' } = {}) {
    return `<div class="field${full ? ' full' : ''}"><label class="label" for="${id}">${esc(label)}${req ? ' <span class="req" aria-hidden="true">*</span>' : ''}</label>
      ${control}${hint ? `<span class="hint">${esc(hint)}</span>` : ''}<span class="error-msg" id="err_${id}"></span></div>`;
  },
  input: (id, value, attrs = '') => `<input class="input" id="${id}" value="${esc(value ?? '')}" aria-describedby="err_${id}" ${attrs}>`,
  date: (id, value) => `<input class="input" type="date" id="${id}" value="${esc(Dates.key(value) || '')}" aria-describedby="err_${id}">`,
  textarea: (id, value, rows = 3, placeholder = '') => `<textarea class="textarea" id="${id}" rows="${rows}" placeholder="${esc(placeholder)}">${esc(value || '')}</textarea>`,
  select: (id, optionsHtml) => `<select class="select" id="${id}" aria-describedby="err_${id}">${optionsHtml}</select>`,
  val: (root, id) => (root.querySelector('#' + id)?.value || '').trim(),
  picked: (root, group) => [...root.querySelectorAll(`[data-group="${group}"][aria-pressed="true"]`)].map(b => b.dataset.value),
  chips(group, items, selected = []) {
    return `<div class="part-grid" role="group">${items.map(i => `<button type="button" class="part-chip" data-action="chip-toggle" data-group="${group}" data-value="${esc(i.value)}" aria-pressed="${selected.includes(i.value)}">${i.avatar || ''}${esc(i.label)}</button>`).join('')}</div>`;
  },
  /** Affiche les erreurs { id: message } et place le curseur sur le premier champ en erreur. */
  errors(root, fields = {}) {
    root.querySelectorAll('.error-msg').forEach(el => { el.textContent = ''; });
    root.querySelectorAll('[aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));
    let first = null;
    Object.entries(fields).forEach(([id, msg]) => {
      const out = root.querySelector('#err_' + id), input = root.querySelector('#' + id);
      if (out) out.textContent = msg;
      if (input) { input.setAttribute('aria-invalid', 'true'); first = first || input; }
    });
    first?.focus();
    return Object.keys(fields).length > 0;
  },
  /** Panneau latéral contenant un formulaire. Renvoie l'élément <form>. */
  drawer({ id, title, body, foot }) {
    const panel = Overlay.open(`<form id="${id}" novalidate style="display:contents">
        <div class="drawer-head"><h2 class="modal-title" style="margin:0">${esc(title)}</h2>
          <button type="button" class="btn btn-ghost btn-icon" data-action="close-overlay" aria-label="Fermer">${icon('x')}</button></div>
        <div class="drawer-body">${body}</div><div class="drawer-foot">${foot}</div></form>`, { type: 'drawer', label: title });
    return panel.querySelector('form');
  },
  levelOptions: selected => UI.options(Object.entries(CONFIG.pdqaModules.levels).map(([v, l]) => ({ value: v, label: l })), String(selected || 2)),
};
/** Élément d'une liste de référence (CONFIG) par identifiant ; valeur inconnue → premier élément (valeur par défaut). */
const refItem = (list, id) => list.find(x => x.id === id) || list[0];

/* ==========================================================================
   Innovation : de l'idée au projet
   Étapes : Idée → En étude → Validée → Transformée en projet (ou Abandonnée).
   Deux vues : tableau par étape, et matrice potentiel / effort pour prioriser.
   ========================================================================== */
const Innovation = {
  defaults: { q: '', owner: '', category: '', view: 'board', closed: false },
  FLOW: ['idea', 'study', 'validated'],      // étapes que l'on peut parcourir avec les flèches
  stage: id => refItem(CONFIG.pdqaModules.innovationStages, id),
  level: n => CONFIG.pdqaModules.levels[Number(n) || 2],
  /** Priorité (1 à 9) : potentiel élevé et effort faible d'abord. */
  score: i => (Number(i.potential) || 2) * (4 - (Number(i.effort) || 2)),
  linkedProject: i => (i.project_id ? Store.projectIn('pdqa', i.project_id) : null),

  filtered() {
    const st = App.view('innovation', Innovation.defaults), q = st.q.toLowerCase();
    return PdqaData.list('innovations').filter(i => (!q || [i.title, i.description, i.target].some(v => String(v || '').toLowerCase().includes(q))) &&
      (!st.owner || i.owner_id === st.owner) && (!st.category || i.category === st.category));
  },

  render(view) {
    const st = App.view('innovation', Innovation.defaults), all = PdqaData.list('innovations'), cfg = CONFIG.pdqaModules;
    const open = all.filter(i => ['idea', 'study'].includes(i.stage)).length;
    view.innerHTML = pageHeader({ title: 'Innovation', crumbs: [{ label: 'Innovation' }],
      sub: `${plural(open, 'idée à l\'étude', 'idées à l\'étude')} · ${plural(all.filter(i => i.stage === 'validated').length, 'validée', 'validées')} · ${plural(all.filter(i => i.stage === 'project').length, 'devenue projet', 'devenues projets')}`,
      actions: `<button class="btn btn-primary" data-action="inno-new" ${PdqaData.ready('innovations') ? '' : 'disabled'}>${icon('plus', 'sm')}Nouvelle idée</button>` }) +
      `<div class="page-body">${PdqaData.notice('innovations')}<div class="toolbar card" role="search">
        <div class="search">${icon('search', 'sm')}<input class="input" type="search" placeholder="Rechercher une idée" value="${esc(st.q)}" data-input="inno-filter" data-key="q" aria-label="Rechercher une idée"></div>
        <select class="select" data-change="inno-filter" data-key="owner" aria-label="Filtrer par porteur">${UI.userOptions(st.owner, 'Tous les porteurs')}</select>
        <select class="select" data-change="inno-filter" data-key="category" aria-label="Filtrer par catégorie">${UI.options(cfg.innovationCategories.map(c => ({ value: c, label: c })), st.category, { placeholder: 'Toutes les catégories' })}</select>
        <span class="spacer"></span>
        ${st.view === 'board' ? `<label class="check"><input type="checkbox" data-change="inno-closed" ${st.closed ? 'checked' : ''}>Afficher les idées abandonnées</label>` : ''}
        <div class="segmented" role="group" aria-label="Affichage"><button data-action="inno-view" data-view="board" aria-pressed="${st.view === 'board'}">Par étape</button><button data-action="inno-view" data-view="matrix" aria-pressed="${st.view === 'matrix'}">Matrice potentiel / effort</button></div>
      </div><div id="innoBody"></div></div>`;
    Innovation.renderBody();
  },
  renderBody() {
    const box = document.getElementById('innoBody'); if (!box) return;
    const st = App.view('innovation', Innovation.defaults), list = Innovation.filtered();
    if (!PdqaData.list('innovations').length) {
      box.innerHTML = `<div class="card">${UI.empty({ icon: 'bulb', title: 'Aucune idée pour le moment', sub: 'Notez une piste d\'innovation : elle pourra devenir une initiative PDQA.',
        action: PdqaData.ready('innovations') ? `<button class="btn btn-primary" data-action="inno-new">${icon('plus', 'sm')}Nouvelle idée</button>` : '' })}</div>`;
      return;
    }
    box.innerHTML = st.view === 'matrix' ? Innovation.matrixHTML(list) : Innovation.boardHTML(list);
  },

  boardHTML(list) {
    const st = App.view('innovation', Innovation.defaults);
    const stages = CONFIG.pdqaModules.innovationStages.filter(s => st.closed || s.id !== 'rejected');
    return `<div class="kanban inno-board" style="--cols:${stages.length}">${stages.map(s => {
      const cards = list.filter(i => i.stage === s.id).sort((a, b) => Innovation.score(b) - Innovation.score(a) || cmp(b.created_at, a.created_at));
      return `<section class="kb-col" aria-labelledby="inh-${s.id}"><div class="kb-col-head"><span class="badge ${s.badge} no-dot" id="inh-${s.id}">${esc(s.label)}</span>
          <span class="kb-count">${cards.length}</span></div>
        <div class="kb-list">${cards.map(Innovation.cardHTML).join('') || '<div class="kb-empty">Aucune idée</div>'}</div></section>`;
    }).join('')}</div>`;
  },

  cardHTML(i) {
    const u = Store.user(i.owner_id), pos = Innovation.FLOW.indexOf(i.stage), proj = Innovation.linkedProject(i);
    const move = (dir, label, ic) => `<button data-action="inno-move" data-id="${esc(i.id)}" data-dir="${dir}" aria-label="${esc(label)}" title="${esc(label)}">${icon(ic, 'sm')}</button>`;
    const moves = pos < 0 ? '' : `<div class="kb-moves">${pos > 0 ? move(-1, `Revenir à « ${Innovation.stage(Innovation.FLOW[pos - 1]).label} »`, 'left') : ''}${pos < Innovation.FLOW.length - 1 ? move(1, `Passer à « ${Innovation.stage(Innovation.FLOW[pos + 1]).label} »`, 'right') : ''}</div>`;
    const action = i.stage === 'validated' || (i.stage === 'project' && !proj)
      ? `<button class="btn btn-glass btn-sm" data-action="inno-project" data-id="${esc(i.id)}">${icon('folder', 'sm')}Créer le projet</button>`
      : proj ? `<button class="link-muted small" data-action="open-project" data-ws="pdqa" data-id="${esc(proj.id)}">${icon('open', 'sm')} ${esc(proj.project_name)}</button>` : '';
    return `<article class="kb-card inno-card">${moves}
      <button class="kb-title link-btn" data-action="inno-edit" data-id="${esc(i.id)}" style="padding-right:56px">${esc(i.title)}</button>
      ${i.target ? `<div class="cell-sub" style="margin:-4px 0 8px">${esc(i.target)}</div>` : ''}
      <div class="kb-meta">${i.category ? `<span class="chip">${esc(i.category)}</span>` : ''}
        <span class="inno-pe" title="Potentiel ${esc(Innovation.level(i.potential))}, effort ${esc(Innovation.level(i.effort))}">Potentiel ${esc(Innovation.level(i.potential).toLowerCase())} · effort ${esc(Innovation.level(i.effort).toLowerCase())}</span>
        ${u ? `<span title="${esc(u.name)}">${avatar(u, 24)}</span>` : ''}</div>
      ${action ? `<div class="inno-action">${action}</div>` : ''}</article>`;
  },

  /** Matrice 3 × 3 : potentiel (lignes, du plus fort au plus faible) × effort (colonnes, du plus faible au plus fort). */
  matrixHTML(list) {
    const live = list.filter(i => !['rejected', 'project'].includes(i.stage)), lv = CONFIG.pdqaModules.levels;
    const cells = [3, 2, 1].map(p => [1, 2, 3].map(e => {
      const items = live.filter(i => (Number(i.potential) || 2) === p && (Number(i.effort) || 2) === e);
      const best = p === 3 && e === 1, hint = best ? 'À prioriser' : p === 3 && e === 3 ? 'Projet de fond' : p === 1 && e === 3 ? 'À reconsidérer' : '';
      return `<div class="mx-cell ${best ? 'is-best' : ''}" role="cell" aria-label="Potentiel ${lv[p]}, effort ${lv[e]} : ${items.length} idée(s)">
        ${hint ? `<span class="mx-hint">${hint}</span>` : ''}${items.map(i => `<button class="mx-item" data-action="inno-edit" data-id="${esc(i.id)}"><span class="badge ${Innovation.stage(i.stage).badge} no-dot">${esc(Innovation.stage(i.stage).label)}</span>${esc(i.title)}</button>`).join('')}</div>`;
    }).join('')).join('');
    return `<section class="card card-pad"><p class="muted small mb-4">Idées en cours (hors idées abandonnées et devenues projets), placées selon leur potentiel et l'effort estimé.</p>
      <div class="matrix" role="table" aria-label="Matrice potentiel / effort">
        <div class="mx-ylab" aria-hidden="true">Potentiel</div>
        <div class="mx-rows">${[3, 2, 1].map(p => `<span class="mx-rl">${lv[p]}</span>`).join('')}</div>
        <div class="mx-grid">${cells}</div>
        <div></div><div></div><div class="mx-cols">${[1, 2, 3].map(e => `<span>${lv[e]}</span>`).join('')}</div>
        <div></div><div></div><div class="mx-xlab" aria-hidden="true">Effort</div>
      </div></section>`;
  },

  open(id) {
    const i = id ? PdqaData.get('innovations', id) : null;
    if (id && !i) { Toast.show('Idée introuvable.', 'error'); return; }
    const cfg = CONFIG.pdqaModules, v = i || { title: '', stage: 'idea', potential: 2, effort: 2, owner_id: Store.me.id };
    const proj = i && Innovation.linkedProject(i);
    const stages = cfg.innovationStages.filter(s => s.id !== 'project' || v.stage === 'project');
    const form = Form.drawer({ id: 'innoForm', title: i ? 'Modifier l\'idée' : 'Nouvelle idée',
      body: `${Form.field('in_title', 'Titre', Form.input('in_title', v.title, 'placeholder="ex : Barre protéinée à base de pois" autofocus required'), { req: true })}
        ${Form.field('in_desc', 'Description', Form.textarea('in_desc', v.description, 4, 'Le besoin, l\'idée, ce qui la rend intéressante'))}
        <div class="form-grid">${Form.field('in_cat', 'Catégorie', Form.select('in_cat', UI.options(cfg.innovationCategories.map(c => ({ value: c, label: c })), v.category, { placeholder: '— Choisir —' })))}
          ${Form.field('in_owner', 'Porteur de l\'idée', Form.select('in_owner', UI.userOptions(v.owner_id, '— Non défini —')))}</div>
        ${Form.field('in_target', 'Client ou marché visé', Form.input('in_target', v.target, 'placeholder="ex : Herbalife, sport, seniors…"'))}
        <div class="form-grid">${Form.field('in_pot', 'Potentiel', Form.select('in_pot', Form.levelOptions(v.potential)), { hint: 'Intérêt commercial ou stratégique' })}
          ${Form.field('in_eff', 'Effort', Form.select('in_eff', Form.levelOptions(v.effort)), { hint: 'Temps, coût, complexité' })}</div>
        ${Form.field('in_stage', 'Étape', Form.select('in_stage', UI.options(stages.map(s => ({ value: s.id, label: s.label })), v.stage)) )}
        ${proj ? `<div class="notice info">${icon('folder')}<span>Cette idée est devenue l'initiative <b>${esc(proj.project_name)}</b>.</span><button type="button" class="btn btn-glass btn-sm" data-action="open-project" data-ws="pdqa" data-id="${esc(proj.id)}">Ouvrir</button></div>` : ''}`,
      foot: `${i ? `<button type="button" class="btn btn-danger left" data-action="inno-delete" data-id="${esc(i.id)}">${icon('trash', 'sm')}Supprimer</button>` : ''}
        <button type="button" class="btn btn-ghost" data-action="close-overlay">Annuler</button><button type="submit" class="btn btn-primary">${i ? 'Enregistrer' : 'Ajouter l\'idée'}</button>` });
    form.addEventListener('submit', e => { e.preventDefault(); Innovation.save(form, i); });
  },

  async save(form, item) {
    const val = id => Form.val(form, id);
    if (!val('in_title')) { Form.errors(form, { in_title: 'Le titre est obligatoire.' }); return; }
    Form.errors(form, {});
    const payload = { title: val('in_title').slice(0, 200), description: val('in_desc') || null, category: val('in_cat') || null, target: val('in_target') || null,
      owner_id: val('in_owner') || null, stage: val('in_stage') || 'idea', potential: Number(val('in_pot')) || 2, effort: Number(val('in_eff')) || 2 };
    const btn = form.querySelector('[type="submit"]'); btn.disabled = true;
    try {
      await PdqaData.save('innovations', item?.id, payload, item ? `Idée « ${payload.title} » modifiée` : `Idée ajoutée : « ${payload.title} »`);
      Overlay.close(); Toast.show(item ? 'Idée enregistrée.' : 'Idée ajoutée.'); Router.refresh();
    } catch (e) { Toast.error(e); } finally { if (document.contains(btn)) btn.disabled = false; }
  },

  async move(id, dir) {
    const i = PdqaData.get('innovations', id), pos = i ? Innovation.FLOW.indexOf(i.stage) : -1, next = Innovation.FLOW[pos + dir];
    if (!i || pos < 0 || !next) return;
    try { await PdqaData.save('innovations', id, { stage: next }, `Idée « ${i.title} » : ${Innovation.stage(next).label}`); Toast.show(`« ${i.title} » → ${Innovation.stage(next).label}`); }
    catch (e) { Toast.error(e); }
    Innovation.renderBody();
  },

  /** Crée l'initiative PDQA à partir de l'idée, relie les deux, puis ouvre le formulaire de l'initiative pour compléter ses dates. */
  converting: new Set(),   // idées en cours de transformation (évite deux initiatives sur un double clic)
  async toProject(id) {
    const i = PdqaData.get('innovations', id); if (!i || Innovation.converting.has(id)) return;
    const existing = Innovation.linkedProject(i);
    if (existing) { Router.go('pdqa', 'project', existing.id); return; }
    if (!confirm(`Créer une initiative PDQA à partir de l'idée « ${i.title} » ?`)) return;
    let projectId = null;
    Innovation.converting.add(id);
    try {
      const { data, error } = await Store.db.from('projects').insert({ project_name: i.title, description: i.description || null, workspace: 'pdqa', status: 'active',
        priority: Math.min(3, Math.max(1, Number(i.potential) || 2)), start_date: Dates.today(), launch_date: null, created_by: Store.me?.id || null, updated_at: new Date().toISOString(),
        pdqa_data: { lead_id: i.owner_id || Store.me?.id || null, department: 'Quality & R&D', contributors: [], partners: [], innovation_id: i.id } }).select().single();
      if (error) throw error;
      projectId = data.id;
      await PdqaData.save('innovations', i.id, { stage: 'project', project_id: projectId }, `Idée « ${i.title} » transformée en initiative`);
      Audit.log({ entity: 'project', entityId: projectId, projectId, action: 'create', summary: `Initiative créée depuis l'idée « ${i.title} »` });
      await Store.refreshTable('projects');
      Overlay.closeAll();
      Toast.show('Initiative créée : complétez ses dates et son équipe.');
      Router.go('pdqa', 'project-edit', projectId);
    } catch (e) {
      // Retour arrière : pas d'initiative orpheline si le lien avec l'idée n'a pas pu être enregistré.
      if (projectId) await Store.db.from('projects').delete().eq('id', projectId);
      Toast.error(e);
    } finally { Innovation.converting.delete(id); }
  },
};
Object.assign(Actions, {
  'inno-new': () => Innovation.open(),
  'inno-edit': el => Innovation.open(el.dataset.id),
  'inno-view': el => { App.view('innovation', Innovation.defaults).view = el.dataset.view; Innovation.render(document.getElementById('view')); },
  'inno-move': el => Innovation.move(el.dataset.id, Number(el.dataset.dir)),
  'inno-project': el => Innovation.toProject(el.dataset.id),
  async 'inno-delete'(el) {
    const i = PdqaData.get('innovations', el.dataset.id); if (!i || !confirm(`Supprimer l'idée « ${i.title} » ?`)) return;
    try { await PdqaData.remove('innovations', i.id, `Idée supprimée : « ${i.title} »`); Overlay.close(); Toast.show('Idée supprimée.'); Router.refresh(); } catch (e) { Toast.error(e); }
  },
});
InputActions['inno-filter'] = ChangeActions['inno-filter'] = el => { App.view('innovation', Innovation.defaults)[el.dataset.key] = el.value; Innovation.renderBody(); };
ChangeActions['inno-closed'] = el => { App.view('innovation', Innovation.defaults).closed = el.checked; Innovation.renderBody(); };

/* ==========================================================================
   Visites / Workshop / Salon
   Un événement = type, dates, lieu, participants, contacts externes, objectifs,
   compte-rendu et actions. Si l'événement est rattaché à une initiative PDQA,
   chaque action avec un responsable devient une tâche de cette initiative
   (même logique que les Meeting Minutes : une tâche commencée n'est jamais
   supprimée). Les événements figurent aussi dans le calendrier PDQA.
   ========================================================================== */
const Events = {
  defaults: { when: 'upcoming', type: '', q: '', project: '' },
  type: id => refItem(CONFIG.pdqaModules.eventTypes, id),
  status: id => refItem(CONFIG.pdqaModules.eventStatuses, id),
  start: e => Dates.key(e.start_date),
  end: e => (Dates.key(e.end_date) && Dates.key(e.end_date) >= Dates.key(e.start_date) ? Dates.key(e.end_date) : Dates.key(e.start_date)),
  dates(e) {
    const s = Events.start(e), en = Events.end(e);
    return s === en ? Dates.fmt(s) : `${Dates.short(s)} → ${Dates.fmt(en)}`;
  },
  tasksOf: e => (e.actions || []).map(a => a.task_id && Store.task(a.task_id)).filter(Boolean),

  filtered(today = Dates.today()) {
    const st = App.view('events', Events.defaults), q = st.q.toLowerCase();
    return PdqaData.list('events').filter(e => (st.when === 'all' || (st.when === 'upcoming' ? Events.end(e) >= today : Events.end(e) < today)) &&
      (!st.type || e.type === st.type) && (!st.project || e.project_id === st.project) &&
      (!q || [e.title, e.location, e.organizer].some(v => String(v || '').toLowerCase().includes(q))))
      .sort((a, b) => (st.when === 'past' ? -1 : 1) * cmp(Events.start(a), Events.start(b)));
  },
  list(view) {
    const st = App.view('events', Events.defaults), today = Dates.today(), all = PdqaData.list('events');
    const next = all.filter(e => Events.end(e) >= today && e.status !== 'cancelled').sort((a, b) => cmp(Events.start(a), Events.start(b)))[0];
    const chip = (key, value, label) => `<button class="filter-chip" data-action="ev-filter" data-key="${key}" data-value="${value}" aria-pressed="${st[key] === value}">${esc(label)}</button>`;
    view.innerHTML = pageHeader({ title: 'Visites / Workshop / Salon', crumbs: [{ label: 'Visites / Workshop / Salon' }],
      sub: next ? `Prochain : ${Events.type(next.type).label} « ${next.title} », ${Events.dates(next)}` : 'Visites clients et fournisseurs, workshops, salons professionnels.',
      actions: `<button class="btn btn-primary" data-action="ev-new" ${PdqaData.ready('events') ? '' : 'disabled'}>${icon('plus', 'sm')}Nouvel événement</button>` }) +
      `<div class="page-body">${PdqaData.notice('events')}<div class="toolbar card" role="search">
        <div class="segmented" role="group" aria-label="Période">${[['upcoming', 'À venir'], ['past', 'Passés'], ['all', 'Tous']].map(([v, l]) => `<button data-action="ev-filter" data-key="when" data-value="${v}" aria-pressed="${st.when === v}">${l}</button>`).join('')}</div>
        <div class="board-chips" role="group" aria-label="Type">${chip('type', '', 'Tous les types')}${CONFIG.pdqaModules.eventTypes.map(t => chip('type', t.id, t.label)).join('')}</div>
        <div class="search">${icon('search', 'sm')}<input class="input" type="search" placeholder="Titre, lieu, organisateur" value="${esc(st.q)}" data-input="ev-search" aria-label="Rechercher un événement"></div>
        <select class="select" data-change="ev-project" aria-label="Filtrer par initiative">${UI.projectOptions('pdqa', st.project, 'Toutes les initiatives')}</select>
        <span class="spacer"></span><span class="result-count" id="evCount"></span></div><div id="evBody"></div></div>`;
    Events.renderList();
  },
  renderList() {
    const box = document.getElementById('evBody'); if (!box) return;
    const today = Dates.today(), all = PdqaData.list('events'), items = Events.filtered(today);
    document.getElementById('evCount').textContent = plural(items.length, 'événement', 'événements');
    let month = '';
    box.innerHTML = items.length ? items.map(e => {
      const m = Events.start(e).slice(0, 7), head = m !== month ? `<h2 class="ev-month">${esc(Dates.monthLabel(m + '-01'))}</h2>` : '';
      month = m;
      return head + Events.cardHTML(e, today);
    }).join('') : `<div class="card">${UI.empty({ icon: 'pin', title: all.length ? 'Aucun événement ne correspond' : 'Aucun événement enregistré',
      sub: all.length ? 'Changez la période ou les filtres.' : 'Préparez une visite, un workshop ou un salon : objectifs, participants, puis compte-rendu.',
      action: !all.length && PdqaData.ready('events') ? `<button class="btn btn-primary" data-action="ev-new">${icon('plus', 'sm')}Nouvel événement</button>` : '' })}</div>`;
  },

  cardHTML(e, today = Dates.today()) {
    const t = Events.type(e.type), s = Events.status(e.status), p = Store.projectIn('pdqa', e.project_id);
    const tasks = Events.tasksOf(e), openTasks = tasks.filter(x => !Rules.isTaskDone(x)).length;
    const needsReport = e.status !== 'cancelled' && Events.end(e) < today && !e.report;
    return `<div class="card meeting-card ev-card ${e.status === 'cancelled' ? 'is-cancelled' : ''}" style="--i:0">
      <div class="date-box"><div class="d">${esc(Dates.fmt(Events.start(e), { day: 'numeric' }))}</div><div class="m">${esc(Dates.fmt(Events.start(e), { month: 'short' }))}</div></div>
      <div class="grow"><div class="row wrap"><span class="badge b-space no-dot">${esc(t.label)}</span>${e.status !== 'planned' ? `<span class="badge ${s.badge}">${esc(s.label)}</span>` : ''}
          ${needsReport ? '<span class="badge b-warn">Compte-rendu à rédiger</span>' : ''}</div>
        <button class="link-btn" style="font-size:var(--fs-lg);margin-top:4px" data-action="open-event" data-id="${esc(e.id)}">${esc(e.title)}</button>
        <div class="cell-sub">${esc(Events.dates(e))}${e.location ? ' · ' + esc(e.location) : ''}${e.organizer ? ' · ' + esc(e.organizer) : ''}${p ? ' · ' + esc(p.project_name) : ''}</div>
        <div class="row" style="margin-top:6px">${(e.participants || []).map(Store.user).filter(Boolean).slice(0, 6).map(u => `<span title="${esc(u.name)}">${avatar(u, 22)}</span>`).join('')}
          ${(e.actions || []).length ? `<span class="chip">${plural(e.actions.length, 'action', 'actions')}${openTasks ? ` · ${openTasks} ouverte${openTasks > 1 ? 's' : ''}` : ''}</span>` : ''}</div></div>
      ${Menu.html([{ action: 'open-event', icon: 'open', label: 'Ouvrir', data: { id: e.id } }, { action: 'ev-edit', icon: 'edit', label: 'Modifier', data: { id: e.id } }, { action: 'ev-delete', icon: 'trash', label: 'Supprimer', danger: true, data: { id: e.id } }])}</div>`;
  },

  view(view, e) {
    const t = Events.type(e.type), s = Events.status(e.status), p = Store.projectIn('pdqa', e.project_id);
    const parts = (e.participants || []).map(Store.user).filter(Boolean);
    const acts = (e.actions || []).map((a, n) => {
      const task = a.task_id ? Store.task(a.task_id) : null;
      return `<div class="action-item"><span class="action-num">${n + 1}</span><span class="grow">${esc(a.title)}${a.assignee_id && Store.user(a.assignee_id) ? `<div class="cell-sub">${esc(Store.user(a.assignee_id).name)}</div>` : ''}</span>
        ${a.due_date ? `<span class="due">${icon('clock', 'sm')}${esc(Dates.fmt(a.due_date))}</span>` : ''}${task ? `<button class="btn btn-ghost btn-sm" data-action="edit-task" data-ws="pdqa" data-id="${esc(task.id)}">${UI.taskStatusBadge(task.status)}</button>` : ''}</div>`;
    }).join('');
    const section = (title, text) => (text ? `<section class="mv-section card card-pad"><h2 class="section-title">${title}</h2><div class="mv-content">${esc(text)}</div></section>` : '');
    view.innerHTML = pageHeader({ title: e.title, sub: `${t.label} · ${Events.dates(e)}`, crumbs: [{ page: 'events', label: 'Visites / Workshop / Salon' }, { label: e.title }],
      actions: `<button class="btn btn-glass" data-action="print">${icon('print', 'sm')}Imprimer</button><button class="btn btn-glass" data-action="ev-delete" data-id="${esc(e.id)}">${icon('trash', 'sm')}Supprimer</button>
        <button class="btn btn-primary" data-action="ev-edit" data-id="${esc(e.id)}">${icon('edit', 'sm')}${e.report ? 'Modifier' : 'Modifier / compte-rendu'}</button>` }) +
      `<div class="page-body"><div class="detail-grid"><div>
          <div class="mv-header"><div class="row wrap"><span class="badge b-space no-dot">${esc(t.label)}</span><span class="badge ${s.badge}">${esc(s.label)}</span></div>
            <div class="mv-team" style="margin-top:6px">${esc(e.title)}</div><div class="muted">${esc(Events.dates(e))}${e.location ? ' · ' + esc(e.location) : ''}</div></div>
          ${section('Objectifs', e.objectives)}
          ${e.report ? section('Compte-rendu', e.report) : `<div class="notice info mv-section">${icon('notes')}<span>Pas encore de compte-rendu.</span><button class="btn btn-glass btn-sm" data-action="ev-edit" data-id="${esc(e.id)}">Rédiger le compte-rendu</button></div>`}
          ${acts ? `<section class="mv-section card"><div class="card-head"><h2 class="card-title">Actions à suivre</h2></div>${acts}</section>` : ''}
        </div><aside class="stack"><section class="card card-pad"><h2 class="section-title">Informations</h2><dl class="kv">
          <dt>Type</dt><dd>${esc(t.label)}</dd><dt>Dates</dt><dd>${esc(Events.dates(e))}</dd><dt>Lieu</dt><dd>${esc(e.location || '—')}</dd>
          <dt>Organisateur</dt><dd>${esc(e.organizer || '—')}</dd>
          <dt>Initiative</dt><dd>${p ? `<button class="link-muted" data-action="open-project" data-ws="pdqa" data-id="${esc(p.id)}">${esc(p.project_name)}</button>` : '—'}</dd>
          <dt>Participants</dt><dd>${parts.length ? parts.map(u => `<div class="person" style="margin-bottom:4px">${avatar(u, 22)}${esc(u.name)}</div>`).join('') : '—'}</dd>
          <dt>Contacts externes</dt><dd class="mv-content">${esc(e.contacts || '—')}</dd></dl></section></aside></div></div>`;
  },

  form(view, e) {
    const cfg = CONFIG.pdqaModules, v = e || { type: 'visit', status: 'planned', start_date: Dates.today(), participants: [Store.me.id] };
    view.innerHTML = pageHeader({ title: e ? 'Modifier l\'événement' : 'Nouvel événement', sub: 'Visite, workshop ou salon',
      crumbs: [{ page: 'events', label: 'Visites / Workshop / Salon' }, { label: e ? e.title : 'Nouveau' }],
      actions: `<button class="btn btn-ghost" data-action="${e ? 'open-event' : 'go'}" data-page="events" data-id="${esc(e?.id || '')}">Annuler</button><button class="btn btn-primary" data-action="ev-save">Enregistrer</button>` }) +
      `<div class="page-body stack" id="evForm">${PdqaData.notice('events')}<input type="hidden" id="ev_id" value="${esc(e?.id || '')}">
        <section class="card solid card-pad"><h2 class="section-title">L'essentiel</h2><div class="form-grid">
          ${Form.field('ev_type', 'Type', Form.select('ev_type', UI.options(cfg.eventTypes.map(t => ({ value: t.id, label: t.label })), v.type)), { req: true })}
          ${Form.field('ev_status', 'Statut', Form.select('ev_status', UI.options(cfg.eventStatuses.map(s => ({ value: s.id, label: s.label })), v.status)))}
          ${Form.field('ev_title', 'Titre', Form.input('ev_title', v.title, 'placeholder="ex : Visite fournisseur de protéines de pois"'), { req: true, full: true })}
          ${Form.field('ev_start', 'Date de début', Form.date('ev_start', v.start_date), { req: true })}
          ${Form.field('ev_end', 'Date de fin', Form.date('ev_end', v.end_date), { hint: 'Laisser vide si l\'événement dure un jour.' })}
          ${Form.field('ev_location', 'Lieu', Form.input('ev_location', v.location, 'placeholder="Ville, site, stand…"'))}
          ${Form.field('ev_org', 'Organisateur / hôte', Form.input('ev_org', v.organizer, 'placeholder="Client, fournisseur, organisateur du salon"'))}
          ${Form.field('ev_project', 'Initiative PDQA liée', Form.select('ev_project', UI.projectOptions('pdqa', v.project_id, '— Aucune —')), { full: true, hint: 'Nécessaire pour que les actions deviennent des tâches.' })}
        </div></section>
        <section class="card solid card-pad"><h2 class="section-title">Participants internes</h2>${Form.chips('participants', Store.users.map(u => ({ value: u.id, label: u.name, avatar: avatar(u, 24) })), v.participants || [])}</section>
        <section class="card solid card-pad"><div class="form-grid">
          ${Form.field('ev_contacts', 'Contacts externes', Form.textarea('ev_contacts', v.contacts, 3, 'Nom, fonction, société, e-mail'), { full: true })}
          ${Form.field('ev_obj', 'Objectifs', Form.textarea('ev_obj', v.objectives, 3, 'Ce que l\'on veut obtenir ou vérifier'), { full: true })}
          ${Form.field('ev_report', 'Compte-rendu', Form.textarea('ev_report', v.report, 7, 'Constats, échanges, décisions, points d\'attention'), { full: true })}
        </div></section>
        <section class="card solid card-pad"><h2 class="section-title">Actions à suivre</h2><p class="hint mb-4">Avec une initiative liée, chaque action qui a un responsable devient une tâche.</p>
          <div class="mm-action-row label small" style="margin-bottom:8px"><span>Action</span><span>Responsable</span><span>Échéance</span><span></span></div>
          <div id="actionRows"></div><button class="btn btn-glass btn-sm mt-4" data-action="mm-add">${icon('plus', 'sm')}Ajouter une action</button></section>
        <p class="error-msg" id="err_ev_form"></p></div>`;
    const acts = v.actions || [];
    if (acts.length) acts.forEach(a => Meetings.addRow(a.title, a.assignee_id, a.due_date, a.task_id)); else Meetings.addRow();
  },

  async save() {
    const root = document.getElementById('evForm'); if (!root) return;
    const val = id => Form.val(root, id), id = val('ev_id'), previous = id ? PdqaData.get('events', id) : null;
    const errors = {};
    if (!val('ev_title')) errors.ev_title = 'Le titre est obligatoire.';
    if (!val('ev_start')) errors.ev_start = 'La date de début est obligatoire.';
    if (val('ev_end') && val('ev_start') && val('ev_end') < val('ev_start')) errors.ev_end = 'La date de fin doit suivre la date de début.';
    const projectId = val('ev_project') || null;
    if (projectId && !Store.projectIn('pdqa', projectId)) errors.ev_project = 'Initiative non disponible.';
    if (Form.errors(root, errors)) return;
    const actions = [...root.querySelectorAll('#actionRows .mm-action-row')].map(r => ({ title: r.querySelector('.ma-title').value.trim(), assignee_id: r.querySelector('.ma-assign').value || null,
      due_date: r.querySelector('.ma-due').value || null, task_id: r.dataset.taskId || null })).filter(a => a.title);
    const payload = { type: val('ev_type'), status: val('ev_status'), title: val('ev_title').slice(0, 200), start_date: val('ev_start'), end_date: val('ev_end') || null,
      location: val('ev_location') || null, organizer: val('ev_org') || null, project_id: projectId, participants: Form.picked(root, 'participants'),
      contacts: val('ev_contacts') || null, objectives: val('ev_obj') || null, report: val('ev_report') || null, actions };
    const btn = document.querySelector('[data-action="ev-save"]'); if (btn) btn.disabled = true;
    try {
      const saved = await PdqaData.save('events', id, payload, `${Events.type(payload.type).label} « ${payload.title} » ${id ? 'modifié' : 'créé'}`);
      const r = await Events.syncTasks(saved, actions, previous);
      if (r.linked) { const { error } = await Store.db.from('pdqa_events').update({ actions }).eq('id', saved.id); if (error) throw error; saved.actions = actions; }
      await Store.refreshTable('tasks');
      const parts = [r.created && `${r.created} tâche(s) créée(s)`, r.updated && `${r.updated} mise(s) à jour`, r.removed && `${r.removed} supprimée(s)`, r.kept && `${r.kept} conservée(s) car déjà commencée(s)`].filter(Boolean);
      Toast.show(`Événement enregistré${parts.length ? ' : ' + parts.join(', ') : ''}.${r.noProject ? ' Liez une initiative pour transformer les actions en tâches.' : ''}`);
      Router.go('pdqa', 'event', saved.id);
    } catch (e) { Toast.error(e); } finally { if (btn && document.contains(btn)) btn.disabled = false; }
  },

  /** Crée, met à jour ou retire les tâches issues des actions. Une tâche déjà commencée est toujours conservée. */
  async syncTasks(e, actions, previous) {
    const out = { created: 0, updated: 0, removed: 0, kept: 0, linked: false, noProject: false };
    const projectId = e.project_id && Store.projectIn('pdqa', e.project_id) ? e.project_id : null;
    const name = a => `[${e.title}] ${a.title}`, kept = new Set();
    for (const a of actions) {
      const task = a.task_id ? Store.task(a.task_id) : null;
      if (task) {
        kept.add(task.id);
        const patch = { title: name(a), assignee_id: a.assignee_id || task.assignee_id, due_date: a.due_date || null, ...(projectId ? { project_id: projectId } : {}) };
        if (Object.keys(patch).some(k => String(patch[k] ?? '') !== String(task[k] ?? ''))) {
          const { error } = await Store.db.from('tasks').update(patch).eq('id', task.id); if (error) throw error; out.updated++;
        }
      } else if (a.assignee_id && projectId) {
        const { data, error } = await Store.db.from('tasks').insert({ title: name(a), project_id: projectId, assignee_id: a.assignee_id, due_date: a.due_date || null, priority: 'medium',
          status: 'todo', description: `Action issue de : ${Events.type(e.type).label} « ${e.title} » du ${Dates.fmt(e.start_date)}` }).select().single();
        if (error) throw error;
        a.task_id = data.id; kept.add(data.id); out.linked = true; out.created++;
      } else {
        if (a.task_id) { a.task_id = null; out.linked = true; }
        if (a.assignee_id && !projectId) out.noProject = true;
      }
    }
    for (const a of previous?.actions || []) {
      const t = a.task_id && !kept.has(a.task_id) ? Store.task(a.task_id) : null; if (!t) continue;
      if (t.status === 'todo') { const { error } = await Store.db.from('tasks').delete().eq('id', t.id); if (error) throw error; out.removed++; } else out.kept++;
    }
    return out;
  },
};

/* ==========================================================================
   Planning des projets : diagramme de Gantt des initiatives PDQA
   Une barre par initiative, de sa date de début à sa date de fin visée ; le
   remplissage montre l'avancement (tâches terminées). Les événements liés à
   l'initiative apparaissent en repères sur sa ligne.
   ========================================================================== */
const Planning = {
  defaults: { span: 6, from: null, lead: '', dept: '', status: 'open', group: '' },
  state() {
    const st = App.view('planning', Planning.defaults);
    if (!st.from) st.from = Dates.startOfMonth(Dates.addMonths(Dates.today(), -1));
    return st;
  },
  range() { const st = Planning.state(); return [st.from, Dates.addDays(Dates.addMonths(st.from, st.span), -1)]; },

  rows() {
    const st = Planning.state();
    return Store.projectsIn('pdqa').filter(p => (!st.status || (st.status === 'open' ? p.status !== 'done' : p.status === st.status)) &&
      (!st.lead || p.pdqa_data?.lead_id === st.lead) && (!st.dept || p.pdqa_data?.department === st.dept));
  },

  render(view) {
    const st = Planning.state(), [from, to] = Planning.range(), all = Store.projectsIn('pdqa');
    const depts = uniqueSorted(all.map(p => p.pdqa_data?.department));
    const leads = uniqueSorted(all.map(p => p.pdqa_data?.lead_id)).map(Store.user).filter(Boolean);
    view.innerHTML = pageHeader({ title: 'Planning des projets', crumbs: [{ label: 'Planning des projets' }], sub: 'Les initiatives PDQA dans le temps : début, fin visée et avancement.',
      actions: `<button class="btn btn-glass" data-action="print">${icon('print', 'sm')}Imprimer</button><button class="btn btn-primary" data-action="new-project">${icon('plus', 'sm')}Nouvelle initiative</button>` }) +
      `<div class="page-body"><div class="toolbar card no-print">
          <select class="select" data-change="plan-filter" data-key="status" aria-label="Filtrer par statut">${UI.options([{ value: 'open', label: 'En cours et en pause' }, ...Object.entries(CONFIG.projectStatuses).map(([v, s]) => ({ value: v, label: s.label }))], st.status, { placeholder: 'Tous les statuts' })}</select>
          <select class="select" data-change="plan-filter" data-key="lead" aria-label="Filtrer par responsable">${UI.options(leads.map(u => ({ value: u.id, label: u.name })), st.lead, { placeholder: 'Tous les responsables' })}</select>
          <select class="select" data-change="plan-filter" data-key="dept" aria-label="Filtrer par département">${UI.options(depts.map(d => ({ value: d, label: d })), st.dept, { placeholder: 'Tous les départements' })}</select>
          <select class="select" data-change="plan-filter" data-key="group" aria-label="Regrouper">${UI.options([{ value: 'lead', label: 'Grouper par responsable' }, { value: 'dept', label: 'Grouper par département' }], st.group, { placeholder: 'Sans regroupement' })}</select>
        </div>
        <div class="cal-toolbar no-print">
          <button class="btn btn-glass btn-sm" data-action="plan-today">Aujourd'hui</button>
          <div class="row"><button class="btn btn-glass btn-sm btn-icon" data-action="plan-move" data-dir="-1" aria-label="Mois précédent">${icon('left', 'sm')}</button>
            <button class="btn btn-glass btn-sm btn-icon" data-action="plan-move" data-dir="1" aria-label="Mois suivant">${icon('right', 'sm')}</button></div>
          <h2 class="cal-label" aria-live="polite">${esc(Dates.monthLabel(from))} – ${esc(Dates.monthLabel(to))}</h2><span class="spacer grow"></span>
          <div class="segmented" role="group" aria-label="Durée affichée">${[3, 6, 12].map(n => `<button data-action="plan-span" data-span="${n}" aria-pressed="${st.span === n}">${n} mois</button>`).join('')}</div>
        </div>
        <div class="cal-legend"><span><i class="legend-swatch" style="background:var(--space)"></i>En cours</span><span><i class="legend-swatch" style="background:var(--danger)"></i>En retard</span>
          <span><i class="legend-swatch g-paused-sw"></i>En pause</span><span><i class="legend-swatch" style="background:var(--line-strong)"></i>Terminée</span>
          <span><i class="legend-swatch" style="background:var(--text);width:2px"></i>Aujourd'hui</span><span><span class="g-mark-sw" aria-hidden="true"></span>Visite / salon lié</span></div>
        <div id="planBody"></div></div>`;
    Planning.renderBody();
  },

  renderBody() {
    const box = document.getElementById('planBody'); if (!box) return;
    const st = Planning.state(), [from, to] = Planning.range(), list = Planning.rows();
    const valid = p => { const s = Dates.key(p.start_date), e = Dates.key(p.launch_date); return s && e && e >= s; };
    const planned = list.filter(valid), unplanned = list.filter(p => !valid(p));
    const visible = planned.filter(p => Dates.key(p.start_date) <= to && Dates.key(p.launch_date) >= from)
      .sort((a, b) => cmp(Dates.key(a.start_date), Dates.key(b.start_date)) || cmp(a.project_name, b.project_name));
    const outside = planned.length - visible.length;
    const groupOf = p => (st.group === 'lead' ? Store.user(p.pdqa_data?.lead_id)?.name || 'Sans responsable' : st.group === 'dept' ? p.pdqa_data?.department || 'Département non renseigné' : '');
    const groups = [];
    visible.forEach(p => { const g = groupOf(p); let entry = groups.find(x => x.label === g); if (!entry) groups.push(entry = { label: g, rows: [] }); entry.rows.push(p); });
    groups.sort((a, b) => cmp(a.label, b.label));
    const gantt = visible.length ? Planning.ganttHTML(groups, from, to)
      : `<div class="card">${UI.empty({ icon: 'gantt', title: list.length ? 'Aucune initiative sur cette période' : 'Aucune initiative à planifier', sub: list.length ? 'Changez de période ou de filtres.' : 'Créez une initiative avec une date de début et une date de fin.' })}</div>`;
    const todo = unplanned.length ? `<section class="card mt-4"><div class="card-head"><h2 class="card-title">À planifier <span class="muted small">${unplanned.length}</span></h2><span class="muted small">Date de début ou de fin manquante, ou fin avant le début</span></div>
      ${unplanned.map(p => `<button class="list-row" data-action="edit-project" data-id="${esc(p.id)}"><span class="grow"><span class="cell-title">${esc(p.project_name)}</span><span class="cell-sub" style="display:block">${esc(Store.user(p.pdqa_data?.lead_id)?.name || 'Responsable à définir')} · début ${esc(Dates.fmt(p.start_date))} · fin ${esc(Dates.fmt(p.launch_date))}</span></span>${icon('edit', 'sm')}</button>`).join('')}</section>` : '';
    box.innerHTML = gantt + (outside ? `<p class="muted small mt-4">${plural(outside, 'initiative est', 'initiatives sont')} en dehors de la période affichée.</p>` : '') + todo;
  },

  ganttHTML(groups, from, to) {
    const total = Dates.diffDays(from, to) + 1, today = Dates.today(), tasks = Store.tasksIn('pdqa');
    const pct = k => (Dates.diffDays(from, k) / total) * 100;
    const months = [];
    for (let m = from; m <= to; m = Dates.addMonths(m, 1)) months.push(m);
    const span = Planning.state().span;
    const monthLabel = m => Dates.fmt(m, span > 6 ? { month: 'short' } : { month: 'long' }) + (m.slice(5, 7) === '01' || m === from ? ` ${m.slice(0, 4)}` : '');
    const eventsBy = new Map();
    PdqaData.list('events').filter(e => e.project_id && e.status !== 'cancelled').forEach(e => { (eventsBy.get(e.project_id) || eventsBy.set(e.project_id, []).get(e.project_id)).push(e); });
    const bar = p => {
      const s = Dates.key(p.start_date), e = Dates.key(p.launch_date), cs = s < from ? from : s, ce = e > to ? to : e;
      const left = pct(cs), width = ((Dates.diffDays(cs, ce) + 1) / total) * 100;
      const late = Rules.isProjectLate(p, today), prog = Rules.projectProgress(p, tasks);
      const cls = p.status === 'done' ? 'is-done' : p.status === 'paused' ? 'is-paused' : late ? 'is-late' : 'is-active';
      const tip = `${p.project_name} : ${Dates.fmt(s)} → ${Dates.fmt(e)}${prog !== null ? ` · ${prog} % d'avancement` : ''}${late ? ' · en retard' : ''}`;
      const marks = (eventsBy.get(p.id) || []).filter(ev => Events.start(ev) >= from && Events.start(ev) <= to)
        .map(ev => `<button class="g-mark" style="left:${pct(Events.start(ev))}%" data-action="open-event" data-id="${esc(ev.id)}" title="${esc(`${Events.type(ev.type).label} : ${ev.title} · ${Events.dates(ev)}`)}" aria-label="${esc(`${Events.type(ev.type).label} : ${ev.title}`)}"></button>`).join('');
      return `<button class="g-bar ${cls} ${s < from ? 'clip-l' : ''} ${e > to ? 'clip-r' : ''}" style="left:${left}%;width:${width}%" data-action="open-project" data-id="${esc(p.id)}" title="${esc(tip)}" aria-label="${esc(tip)}">
        ${prog !== null ? `<span class="g-fill" style="width:${prog}%"></span>` : ''}<span class="g-txt">${prog !== null && width > 7 ? `${prog} %` : ''}</span></button>${marks}`;
    };
    const row = p => {
      const lead = Store.user(p.pdqa_data?.lead_id);
      return `<div class="g-row" role="row"><button class="g-label" role="rowheader" data-action="open-project" data-id="${esc(p.id)}"><span class="g-name">${esc(p.project_name)}</span>
        <span class="g-sub">${esc([lead?.name, p.pdqa_data?.department].filter(Boolean).join(' · ') || '—')}</span></button><div class="g-track" role="cell">${bar(p)}</div></div>`;
    };
    const lines = months.slice(1).map(m => `<i class="g-line" style="left:${pct(m)}%"></i>`).join('') +
      (today >= from && today <= to ? `<i class="g-today" style="left:${pct(today)}%" title="Aujourd'hui"></i>` : '');
    return `<div class="gantt-scroll card" tabindex="0" aria-label="Diagramme de Gantt, défilement horizontal"><div class="gantt" role="table" aria-label="Planning des initiatives">
      <div class="g-row g-head" role="row"><span class="g-label" role="columnheader">Initiative</span><div class="g-track" role="columnheader">${months.map(m => {
        const end = Dates.addDays(Dates.addMonths(m, 1), -1);
        return `<span class="g-month" style="left:${pct(m)}%;width:${((Dates.diffDays(m, end) + 1) / total) * 100}%">${esc(monthLabel(m))}</span>`;
      }).join('')}</div></div>
      <div class="g-body"><div class="g-grid" aria-hidden="true">${lines}</div>
        ${groups.map(g => (g.label ? `<div class="g-group" role="row"><span role="cell">${esc(g.label)} <span class="muted">${g.rows.length}</span></span></div>` : '') + g.rows.map(row).join('')).join('')}</div>
    </div></div>`;
  },
};
