    if (steps.length) {
      // Semaines saisies à la main : conservées. Pour les projets existants (sans indicateur),
      // une semaine identique à l'ancien calcul automatique est considérée comme automatique.
      const manualFlags = Timeline.manualFlags(steps, Timeline.schedule(Dates.key(p.start_date), steps));
      Timeline.enrich(steps).forEach((s, i) => {
        const manual = manualFlags[i];

        actual.disabled = !done;

      }
      if (e.target.classList.contains('tl-actual')) ProjectForm.recalc();
    });
    document.getElementById('tlSteps').addEventListener('input', e => {
      if (e.target.classList.contains('tl-days')) ProjectForm.recalc();
      if (e.target.classList.contains('tl-week')) {
        const row = e.target.closest('.tl-step');
        ProjectForm.setManual(row, e.target.value.trim() !== '');
        if (!e.target.value.trim()) ProjectForm.recalc();
      }
    });
  },
  applyTemplate(withTest) {
    document.getElementById('tlSteps').innerHTML = '';
    Timeline.template(withTest).forEach(s => ProjectForm.addStep(s.name, '', 0, 'upcoming', s.days, s.phase));
    ProjectForm.recalc();
  },
  addStep(name = '', week = '', prog = 0, status = 'upcoming', days = 0, phase = '', manual = false, ref = {}) {
    const row = document.createElement('div');
    row.className = 'tl-step' + (Timeline.isGate(name) ? ' is-gate' : ''); row.dataset.phase = phase || '';
    const opts = [['done', 'Terminé'], ['current', 'En cours'], ['warning', 'À risque'], ['upcoming', 'À venir']];
    const ph = CONFIG.phases.find(x => x.id === phase);
    row.innerHTML = `<div class="tl-name-cell"><span class="tl-mark">${Timeline.isGate(name) ? '<span class="gate-mark" title="Gate"></span><span class="sr-only">Gate</span>' : ''}</span><input class="input input-sm tl-name" value="${esc(name)}" placeholder="Nom de l'étape" aria-label="Nom de l'étape">${ph ? `<span class="tl-phase">${esc(ph.id)}</span>` : ''}</div>
      <div class="tl-week-cell"><input class="input input-sm tl-week" value="${esc(week)}" placeholder="S—" aria-label="Semaine de clôture">
        <button type="button" class="tl-week-auto" data-action="tl-week-auto" title="Semaine saisie à la main : revenir au calcul automatique" aria-label="Revenir au calcul automatique de la semaine">${icon('undo', 'sm')}</button></div>
      <span class="tl-end" aria-label="Date de clôture prévue"></span>
      <input class="input input-sm tl-actual" type="date" value="${esc(status === 'done' ? (ref.actual || '') : '')}" ${status === 'done' ? '' : 'disabled'} aria-label="Date de clôture réelle" title="Date réelle de clôture (étape terminée)">
      <input class="input input-sm tl-prog" type="number" min="0" max="100" value="${Number(prog) || 0}" aria-label="Avancement en %">
      <input class="input input-sm tl-days" type="number" min="0" value="${Number(days) || 0}" aria-label="Durée en jours">
      <select class="select input-sm tl-status" aria-label="Statut de l'étape">${opts.map(([v, l]) => `<option value="${v}" ${status === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <button class="btn btn-ghost btn-sm btn-icon" data-action="tl-remove" aria-label="Supprimer l'étape">${icon('x', 'sm')}</button>`;
    row.dataset.planned = ref.planned || '';
    document.getElementById('tlSteps').appendChild(row);
    ProjectForm.setManual(row, manual);
    // Avancement calculé à partir des tâches reliées à l'étape (non modifiable à la main).
    const st = ProjectForm.stats?.get(Timeline.norm(name));
    if (st && st.total) {
      const input = row.querySelector('.tl-prog');
      input.value = Math.round(st.done / st.total * 100); input.readOnly = true; input.classList.add('is-computed');
      input.title = `Calculé à partir des tâches reliées : ${st.done}/${st.total} terminée(s)`;
    }
  },
  setManual(row, manual) {
    row.dataset.manual = manual ? '1' : '';
    row.classList.toggle('is-manual', manual);
  },
  updateTotal() {
    let total = 0; document.querySelectorAll('.tl-step .tl-days').forEach(i => { total += parseInt(i.value || 0, 10) || 0; });
    const el = document.getElementById('tlTotalDays'); if (el) el.textContent = `${total} jours au total`;
  },
  /** Recalcule la date et la semaine de clôture de chaque étape (semaine ISO du calendrier),
      sauf pour les semaines saisies à la main. */
  recalc() {
    const start = document.getElementById('f_start')?.value || '';
    const rows = [...document.querySelectorAll('.tl-step')];
    const plan = Timeline.schedule(start, rows.map(r => ({ days: r.querySelector('.tl-days').value,
      actual_end: r.querySelector('.tl-status').value === 'done' ? r.querySelector('.tl-actual').value : null })));
    const startYear = start ? Number(start.slice(0, 4)) : null;
    rows.forEach((row, i) => {
      const p = plan[i], endEl = row.querySelector('.tl-end');
      row.dataset.end = p ? p.end : '';
      const slip = p ? Timeline.slipDays(row.dataset.planned, p.end) : null;
      endEl.innerHTML = p ? `${esc(Dates.fmt(p.end, { day: '2-digit', month: 'short', ...(p.isoYear !== startYear ? { year: '2-digit' } : {}) }))}${slip ? ` <span class="slip ${slip > 0 ? 'late' : 'early'}">${esc(Timeline.fmtSlip(slip))}</span>` : ''}` : '—';
      endEl.title = p ? `Clôture ${p.actual ? 'réelle' : 'prévue'} le ${Dates.long(p.end)} (semaine ${p.week.slice(1)} de ${p.isoYear})${row.dataset.planned ? ` — référence : ${Dates.fmt(row.dataset.planned)}` : ''}` : '';
      if (row.dataset.manual !== '1') row.querySelector('.tl-week').value = p ? p.week : '';
    });
    // Alerte si la timeline se termine après la date de lancement saisie.
    const last = plan.length ? plan[plan.length - 1] : null, launch = document.getElementById('f_launch')?.value;
    const box = document.getElementById('tlLaunch');
    if (box) box.innerHTML = last && launch && last.end > launch
      ? `<div class="notice mb-4">${icon('alert')}<span class="grow">La timeline se termine le <b>${esc(Dates.fmt(last.end))}</b>, après la date de lancement saisie (${esc(Dates.fmt(launch))}).</span><button type="button" class="btn btn-glass btn-sm" data-action="tl-use-end" data-date="${last.end}">Utiliser le ${esc(Dates.short(last.end))} comme date de lancement</button></div>` : '';
    const hint = document.getElementById('tlHint');
    if (hint) hint.textContent = start ? 'Semaines du calendrier calculées depuis la date de début (durées en jours calendaires, semaine de clôture de chaque étape). Une semaine modifiée à la main est conservée. Une étape terminée prend sa date de clôture réelle, et les suivantes sont recalculées. L\'écart avec la référence (dates prévues au premier enregistrement) est affiché à côté de la clôture prévue.'
      : 'Renseignez la date de début du projet pour calculer automatiquement la semaine de clôture de chaque étape.';
    ProjectForm.updateTotal();
  },
  steps() {
    return [...document.querySelectorAll('.tl-step')].map(r => ({ name: r.querySelector('.tl-name').value, week: r.querySelector('.tl-week').value,
      prog: parseInt(r.querySelector('.tl-prog').value, 10) || 0, days: parseInt(r.querySelector('.tl-days').value, 10) || 0,
      status: r.querySelector('.tl-status').value, phase: r.dataset.phase || '',
      week_manual: r.dataset.manual === '1', end_date: r.dataset.end || null,
      // Référence : fixée au premier enregistrement avec une date de début, puis conservée.
      planned_end: r.dataset.planned || r.dataset.end || null,
      actual_end: r.querySelector('.tl-status').value === 'done' ? (r.querySelector('.tl-actual').value || null) : null }));
  },
  async save() {
    const name = document.getElementById('f_project').value.trim();
    const err = document.getElementById('err_f_project'); err.textContent = '';
    if (!name) { err.textContent = 'Le nom du projet est obligatoire.'; document.getElementById('f_project').setAttribute('aria-invalid', 'true'); document.getElementById('f_project').focus(); return; }
    const existId = document.getElementById('f_pid').value;
    if (existId) {
      const { data: vers } = await Store.db.from('project_versions').select('id').eq('project_id', existId).limit(1);
      if (vers && vers.length) {
        Overlay.open(`<h2 class="modal-title">Enregistrer</h2><p class="muted">Ce projet a déjà une version enregistrée. Que souhaitez-vous faire ?</p>
          <div class="stack mt-4"><button class="btn btn-primary" style="width:100%;justify-content:flex-start;height:auto;padding:12px 16px" data-action="save-project-confirm" data-new="1"><span style="text-align:left"><b>Créer une nouvelle version</b><br><span class="small">L'ancienne version reste accessible</span></span></button>
          <button class="btn btn-glass" style="width:100%;justify-content:flex-start;height:auto;padding:12px 16px" data-action="save-project-confirm" data-new="0"><span style="text-align:left"><b>Mettre à jour la version actuelle</b><br><span class="small muted">Remplace les données existantes</span></span></button></div>
          <div class="modal-actions"><button class="btn btn-ghost" data-action="close-overlay">Annuler</button></div>`, { label: 'Enregistrer le projet' });
        return;
      }
    }
    ProjectForm.doSave();
  },
  async doSave() {
    Overlay.closeAll();
    const v = id => document.getElementById(id).value;
    const num = id => { const x = parseFloat(v(id)); return Number.isFinite(x) ? x : null; };
    const existId = v('f_pid');
    const payload = {
      client_name: v('f_client').trim() || null, project_name: v('f_project').trim(), version: v('f_version').trim() || 'v1',
      version_date: v('f_vdate') || null, start_date: v('f_start') || null, launch_date: v('f_launch') || null,
      status: v('f_status'), priority: parseInt(v('f_priority'), 10) || 1, risks: v('f_risks') || null, actions: v('f_actions') || null,
      forecast_revenue: num('f_fr'), budget_revenue: num('f_br'), forecast_margin: num('f_fm'), budget_margin: num('f_bm'),
      timeline_steps: ProjectForm.steps(),
      org_data: { lead: v('f_lead').trim(), operations: v('f_ops').trim(), technique: v('f_tech').trim(), sales: v('f_sales').trim(), supply_chain: v('f_supply').trim(), finance: v('f_finance').trim() },
      updated_at: new Date().toISOString(),
    };
    try {
      let projId = existId;
      if (existId) {
        const before = Store.projectIn('customer', existId);
        if (!before) throw new Error('Projet introuvable dans cet espace.');
        const { error } = await Store.db.from('projects').update(payload).eq('id', existId); if (error) throw error;
        const changes = [...Audit.diff(before, payload, Audit.projectFields), ...Audit.timelineDiff(before.timeline_steps, payload.timeline_steps)];
        Audit.log({ entity: 'project', entityId: existId, projectId: existId, action: 'update', summary: `One-pager enregistré (${payload.version})`, changes });
      } else {
        const { data, error } = await Store.db.from('projects').insert({ ...payload, created_by: Store.me?.id || null }).select().single(); if (error) throw error;
        projId = data.id;
        Audit.log({ entity: 'project', entityId: projId, projectId: projId, action: 'create', summary: `Projet créé : « ${payload.project_name} »` });
      }
      await Store.db.from('project_versions').insert({ project_id: projId, version_number: payload.version, snapshot: payload, created_by: Store.me?.id || null });
      await Store.refreshTable('projects');
      Toast.show('Projet enregistré.');
      Router.go('customer', 'project', projId);
    } catch (err) { Toast.error(err); }
  },
};
Object.assign(Actions, {
  'save-project': () => ProjectForm.save(),
  'save-project-confirm': () => ProjectForm.doSave(),
  'tl-add': () => { ProjectForm.addStep(); ProjectForm.recalc(); },

/** Message affiché à la place d'une section tant que la base n'est pas à jour. */
function migrationNotice(what) {
  return `<div class="notice info">${icon('alert')}<span>${esc(what)} sera disponible après la mise à jour de la base : exécutez le script <b>MIGRATION_003_GATES_DOCUMENTS_HISTORIQUE.sql</b> dans Supabase.</span></div>`;
}

/* ---------- Décisions de Gate ---------- */
const GateReviews = {
  /** Les 4 Gates du projet, avec l'étape correspondante de sa timeline. */
  gatesOf(p) {
    const steps = Timeline.enrich(p.timeline_steps);
    return [1, 2, 3, 4].map(n => {
      const step = steps.find(s => s.gate && Timeline.gateNumber(s.name) === n) || null;
      const tpl = CONFIG.timelineTemplate.find(s => Timeline.gateNumber(s.name) === n);
      return { n, step, title: Timeline.gateTitle(step ? step.label : tpl.name) };
    });
  },
  /** Une décision est attendue quand la Gate est l'étape en cours et qu'aucune décision « GO » n'a été prise. */
  isPending(p, gate) {
    if (!gate.step || !['current', 'warning'].includes(gate.step.status)) return false;
    const last = Store.lastGateDecision(p.id, gate.n);
    return !last || !CONFIG.gateDecisions[last.decision]?.passes;
  },
  decisionBadge(g) {
    const d = CONFIG.gateDecisions[g.decision] || { label: g.decision, badge: 'b-neutral' };
    return `<span class="badge ${d.badge}">${esc(d.label)}</span>`;
  },
  sectionHTML(p) {
    if (Store.schema.gates === false) return `<section class="card no-print"><div class="card-head"><h2 class="card-title">Décisions de Gate</h2></div><div class="card-body">${migrationNotice('Le suivi des décisions de Gate')}</div></section>`;
    const reviews = Store.gateReviewsOf('customer', p.id);
    const rows = GateReviews.gatesOf(p).map(g => {
      const hist = reviews.filter(r => Number(r.gate_no) === g.n).sort((a, b) => cmp(b.decision_date, a.decision_date) || cmp(b.created_at, a.created_at));
      const last = hist[0], pending = GateReviews.isPending(p, g);
      const who = last ? (last.deciders || []).map(id => Store.user(id)?.name).filter(Boolean).join(', ') : '';
      return `<div class="gate-row ${pending ? 'is-pending' : ''}">
        <span class="gate-mark" aria-hidden="true"></span>
        <div class="grow"><div class="gate-row-title"><span class="gate-no">Gate ${g.n}</span>${esc(g.title)}</div>
          ${last ? `<div class="cell-sub">${GateReviews.decisionBadge(last)} le ${esc(Dates.fmt(last.decision_date))}${who ? ` par ${esc(who)}` : ''}</div>
            ${last.conditions ? `<div class="gate-cond"><b>Conditions :</b> ${esc(last.conditions)}</div>` : ''}${last.comment ? `<div class="cell-sub">${esc(last.comment)}</div>` : ''}`
            : `<div class="cell-sub">${pending ? '<span class="badge b-gate">Décision attendue</span>' : 'Aucune décision enregistrée'}${g.step ? ` · étape ${esc(CONFIG.stepStatuses[g.step.status].label.toLowerCase())}` : ''}</div>`}
          ${hist.length > 1 ? `<details class="gate-hist"><summary>Décisions précédentes (${hist.length - 1})</summary>${hist.slice(1).map(r => `<div class="cell-sub">${GateReviews.decisionBadge(r)} le ${esc(Dates.fmt(r.decision_date))}${r.conditions ? ` — ${esc(r.conditions)}` : ''}${r.comment ? ` — ${esc(r.comment)}` : ''}</div>`).join('')}</details>` : ''}
        </div>
        <button class="btn ${pending ? 'btn-primary' : 'btn-glass'} btn-sm" data-action="gate-decide" data-project="${esc(p.id)}" data-gate="${g.n}">Enregistrer une décision</button>
      </div>`;
    }).join('');
    return `<section class="card no-print" aria-labelledby="gatesH"><div class="card-head"><h2 class="card-title" id="gatesH">Décisions de Gate</h2></div><div>${rows}</div></section>`;
  },
  open(projectId, gateNo) {
    const p = Store.projectIn('customer', projectId); if (!p) return;
    const g = GateReviews.gatesOf(p).find(x => x.n === Number(gateNo));
    const panel = Overlay.open(`<form id="gateForm" novalidate>
      <h2 class="modal-title"><span class="gate-mark" aria-hidden="true" style="margin-right:10px;vertical-align:2px"></span>Gate ${g.n} : ${esc(g.title)}</h2>
      <div class="stack">
        <fieldset class="field"><legend class="label">Décision <span class="req">*</span></legend><div class="decision-grid">
          ${Object.entries(CONFIG.gateDecisions).map(([id, d], i) => `<label class="option-card"><input type="radio" name="decision" value="${id}" ${i === 0 ? 'checked' : ''}>${esc(d.label)}</label>`).join('')}</div></fieldset>
        <div class="field"><label class="label" for="gd_date">Date de la décision <span class="req">*</span></label><input class="input" type="date" id="gd_date" value="${Dates.today()}"></div>
        <div class="field"><span class="label">Décideurs</span><div class="part-grid">${Store.users.map(u => `<button type="button" class="part-chip" data-action="chip-toggle" data-group="deciders" data-value="${esc(u.id)}" aria-pressed="${u.id === Store.me.id}">${avatar(u, 24)}${esc(u.name)}</button>`).join('')}</div></div>
        <div class="field" id="gd_cond_field" hidden><label class="label" for="gd_cond">Conditions <span class="req">*</span></label><textarea class="textarea" id="gd_cond" rows="3" placeholder="Conditions à lever et échéance"></textarea></div>
        <div class="field"><label class="label" for="gd_comment">Commentaire <span class="muted">(facultatif)</span></label><textarea class="textarea" id="gd_comment" rows="2"></textarea></div>
        ${g.step ? `<label class="check" id="gd_sync_wrap"><input type="checkbox" id="gd_sync" checked>Marquer la Gate comme franchie dans la timeline (clôture réelle = date de la décision)</label>` : '<p class="hint">Cette Gate ne figure pas dans la timeline du projet.</p>'}
        <p class="error-msg" id="gd_err"></p>
      </div>
      <div class="modal-actions"><button type="button" class="btn btn-ghost" data-action="close-overlay">Annuler</button><button type="submit" class="btn btn-primary" id="gd_submit">Enregistrer la décision</button></div>
    </form>`, { label: `Décision Gate ${g.n}` });
    const form = panel.querySelector('#gateForm');
    const sync = () => {
      const dec = form.querySelector('[name="decision"]:checked').value;
      panel.querySelector('#gd_cond_field').hidden = dec !== 'go_conditions';
      const wrap = panel.querySelector('#gd_sync_wrap'); if (wrap) wrap.hidden = !CONFIG.gateDecisions[dec].passes;
    };
    form.addEventListener('change', sync); sync();
    form.addEventListener('submit', e => { e.preventDefault(); GateReviews.save(p, g, panel); });
  },
  async save(p, g, panel) {
    const err = panel.querySelector('#gd_err'); err.textContent = '';
    const decision = panel.querySelector('[name="decision"]:checked').value;
    const date = panel.querySelector('#gd_date').value, conditions = panel.querySelector('#gd_cond').value.trim();
    const deciders = [...panel.querySelectorAll('[data-group="deciders"][aria-pressed="true"]')].map(b => b.dataset.value);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { err.textContent = 'Indiquez la date de la décision.'; return; }
    if (decision === 'go_conditions' && !conditions) { err.textContent = 'Précisez les conditions.'; panel.querySelector('#gd_cond').focus(); return; }
    const syncTimeline = CONFIG.gateDecisions[decision].passes && panel.querySelector('#gd_sync')?.checked && g.step;
    const btn = panel.querySelector('#gd_submit'); btn.disabled = true;
    try {
      const row = { project_id: p.id, gate_no: g.n, decision, decision_date: date, deciders, conditions: conditions || null,
        comment: panel.querySelector('#gd_comment').value.trim() || null, created_by: Store.me?.id || null };
      const { data, error } = await Store.db.from('gate_reviews').insert(row).select().single();
      if (error) throw error;
      Store.gateReviews.unshift(data); Store.schema.gates = true;
      Audit.log({ entity: 'gate', entityId: data.id, projectId: p.id, action: 'create', summary: `Gate ${g.n} : décision « ${CONFIG.gateDecisions[decision].label} » du ${Dates.fmt(date)}`,
        changes: conditions ? [{ field: 'conditions', label: 'Conditions', from: '—', to: conditions }] : [] });
      if (syncTimeline) await GateReviews.markGatePassed(p, g.n, date);
      Overlay.close(); Toast.show(`Décision enregistrée pour la Gate ${g.n}.`);
      Router.refresh();
    } catch (e) { err.textContent = friendlyError(e); }
    finally { if (document.contains(btn)) btn.disabled = false; }
  },
  /** Met à jour la timeline du projet : Gate terminée à la date de décision, étape suivante en cours. */
  async markGatePassed(p, gateNo, date) {
    const steps = (p.timeline_steps || []).map(s => ({ ...s }));
    const i = steps.findIndex(s => Timeline.isGate(s.name) && Timeline.gateNumber(s.name) === gateNo);
    if (i < 0) return;
    const before = p.timeline_steps;
    steps[i] = { ...steps[i], status: 'done', prog: 100, actual_end: date };
    const next = steps.slice(i + 1).find(s => s.status === 'upcoming');
    if (next && !steps.slice(i + 1).some(s => s.status === 'current' || s.status === 'warning')) next.status = 'current';
    const scheduled = Timeline.applySchedule(Dates.key(p.start_date), steps);
    const { error } = await Store.db.from('projects').update({ timeline_steps: scheduled, updated_at: new Date().toISOString() }).eq('id', p.id);
    if (error) throw error;
    p.timeline_steps = scheduled;
    Audit.log({ entity: 'project', entityId: p.id, projectId: p.id, action: 'update', summary: `Timeline mise à jour suite à la décision de la Gate ${gateNo}`, changes: Audit.timelineDiff(before, scheduled) });
  },
};

const Documents = {
  bucket: 'project-docs',
  fmtSize(b) { if (!b && b !== 0) return ''; return b < 1024 ? `${b} o` : b < 1048576 ? `${Math.round(b / 1024)} Ko` : `${(b / 1048576).toFixed(1).replace('.', ',')} Mo`; },
  sectionHTML(p) {
    if (Store.schema.documents === false) return `<section class="card no-print"><div class="card-head"><h2 class="card-title">Documents</h2></div><div class="card-body">${migrationNotice('Le dépôt de documents')}</div></section>`;

          <span class="cell-sub">${esc(Documents.fmtSize(d.size_bytes))}${d.uploaded_by && Store.user(d.uploaded_by) ? `, ajouté par ${esc(Store.user(d.uploaded_by).name)}` : ''} le ${esc(Dates.fmt(d.created_at))}</span></span>
        <span class="chip">${esc(d.category)}</span>
        <button class="btn btn-ghost btn-sm btn-icon" data-action="doc-delete" data-id="${esc(d.id)}" aria-label="Supprimer ${esc(d.name)}">${icon('trash', 'sm')}</button></div>`).join('')
        : '<div class="card-body muted small">Aucun document. Ajoutez le NPD Brief, la spécification, les artworks, le BAT…</div>'}</section>`;
  },
  open(projectId) {
    const panel = Overlay.open(`<form id="docForm" novalidate><h2 class="modal-title">Ajouter un document</h2><div class="stack">
      <div class="field"><label class="label" for="doc_file">Fichier <span class="req">*</span></label><input class="input" type="file" id="doc_file" style="padding-top:6px"><span class="hint">${CONFIG.maxDocumentMb} Mo maximum.</span></div>
      <div class="field"><label class="label" for="doc_cat">Catégorie</label><select class="select" id="doc_cat">${UI.options(CONFIG.documentCategories.map(c => ({ value: c, label: c })), 'Autre')}</select></div>
      <p class="error-msg" id="doc_err"></p></div>
      <div class="modal-actions"><button type="button" class="btn btn-ghost" data-action="close-overlay">Annuler</button><button type="submit" class="btn btn-primary" id="doc_submit">Ajouter</button></div></form>`, { label: 'Ajouter un document' });
    panel.querySelector('#docForm').addEventListener('submit', e => { e.preventDefault(); Documents.upload(projectId, panel); });
  },
  async upload(projectId, panel) {
    const err = panel.querySelector('#doc_err'); err.textContent = '';
    const file = panel.querySelector('#doc_file').files[0];
    if (!Store.projectIn(App.ws, projectId)) { err.textContent = 'Projet introuvable dans cet espace.'; return; }
    if (!file) { err.textContent = 'Choisissez un fichier.'; return; }
    if (file.size > CONFIG.maxDocumentMb * 1048576) { err.textContent = `Fichier trop volumineux (${Documents.fmtSize(file.size)}, ${CONFIG.maxDocumentMb} Mo maximum).`; return; }
    const safe = file.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_').slice(-120);
    const path = `${projectId}/${Date.now()}-${safe}`;
    const btn = panel.querySelector('#doc_submit'); btn.disabled = true; btn.textContent = 'Envoi…';
    try {
      const up = await Store.db.storage.from(Documents.bucket).upload(path, file, { contentType: file.type || undefined, upsert: false });
      if (up.error) throw up.error;
      const row = { project_id: projectId, name: file.name, category: panel.querySelector('#doc_cat').value, storage_path: path,
        size_bytes: file.size, mime_type: file.type || null, uploaded_by: Store.me?.id || null };
      const { data, error } = await Store.db.from('project_documents').insert(row).select().single();
      if (error) { await Store.db.storage.from(Documents.bucket).remove([path]); throw error; }   // pas de fichier orphelin
      Store.documents.unshift(data); Store.schema.documents = true;
      Audit.log({ entity: 'document', entityId: data.id, projectId, action: 'create', summary: `Document ajouté : « ${file.name} » (${row.category})` });
      Overlay.close(); Toast.show('Document ajouté.'); Router.refresh();
    } catch (e) { err.textContent = friendlyError(e); }
    finally { if (document.contains(btn)) { btn.disabled = false; btn.textContent = 'Ajouter'; } }
  },
  async download(id) {
    const d = Store.documents.find(x => x.id === id);
    if (!d || !Store.projectIn(App.ws, d.project_id)) { Toast.show('Document introuvable.', 'error'); return; }
    const { data, error } = await Store.db.storage.from(Documents.bucket).createSignedUrl(d.storage_path, 120, { download: d.name });
    if (error || !data?.signedUrl) { Toast.error(error || 'Lien de téléchargement indisponible.'); return; }
    const a = document.createElement('a'); a.href = data.signedUrl; a.target = '_blank'; a.rel = 'noopener'; a.download = d.name;
    document.body.appendChild(a); a.click(); a.remove();
  },
  async remove(id) {
    const d = Store.documents.find(x => x.id === id);
    if (!d || !Store.projectIn(App.ws, d.project_id)) return;
    if (!confirm(`Supprimer le document « ${d.name} » ? Cette action est définitive.`)) return;
    try {
      const { error } = await Store.db.from('project_documents').delete().eq('id', id);
      if (error) throw error;
      await Store.db.storage.from(Documents.bucket).remove([d.storage_path]);
      Store.documents = Store.documents.filter(x => x.id !== id);
      Audit.log({ entity: 'document', entityId: id, projectId: d.project_id, action: 'delete', summary: `Document supprimé : « ${d.name} »` });
      Toast.show('Document supprimé.'); Router.refresh();
    } catch (e) { Toast.error(e); }
  },
};
Object.assign(Actions, {
  'doc-upload': el => Documents.open(el.dataset.project),
  'doc-open': el => Documents.download(el.dataset.id),
  'doc-delete': el => Documents.remove(el.dataset.id),

/* ---------- Export Excel de la liste des projets ---------- */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    if ([...document.scripts].some(s => s.src === src)) { resolve(); return; }
    const s = document.createElement('script'); s.src = src; s.onload = resolve;
    s.onerror = () => reject(new Error('La bibliothèque d\'export n\'a pas pu être chargée. Vérifiez la connexion internet.'));
    document.head.appendChild(s);
  });
}
const Export = {
  xlsxUrl: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  /** Écrit un classeur : sheets = [[nom de l'onglet, en-têtes, lignes], …]. Colonnes ajustées, filtres activés. */
  book(sheets, file) {
    const wb = XLSX.utils.book_new();
    sheets.forEach(([name, head, rows]) => {
      const sh = XLSX.utils.aoa_to_sheet([head, ...rows], { cellDates: true, dateNF: 'dd/mm/yyyy' });
      sh['!cols'] = head.map((h, i) => ({ wch: Math.min(48, Math.max(h.length + 2, ...rows.map(r => String(r[i] instanceof Date ? '00/00/0000' : r[i] ?? '').length + 2))) }));
      sh['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: rows.length, c: head.length - 1 } }) };
      XLSX.utils.book_append_sheet(wb, sh, name.slice(0, 31));
    });
    XLSX.writeFile(wb, file);
    return file;
  },
  /** Exporte les projets affichés (filtres et tri de la liste respectés). */
  async projects(rows) {
    try {
      if (!window.XLSX) await loadScript(Export.xlsxUrl);
      const ws = App.ws, pdqa = ws === 'pdqa', tasks = Store.tasksIn(ws);
      const d = v => (v ? Dates.parse(v) : null);
      const head = pdqa
        ? ['Projet', 'Département', 'Responsable', 'Statut', 'Priorité', 'Début', 'Fin visée', 'Progression (%)', 'En retard', 'Partenaires', 'Contributeurs', 'Description']
        : ['Projet', 'Client', 'Chef de projet', 'Statut', 'Priorité', 'Début', 'Lancement', 'Étape actuelle', 'Progression (%)', 'Fin de timeline prévue', 'Glissement (jours)', 'En retard', 'Version'];
      const body = rows.map(({ p, lead, group, progress, late }) => {
        const common = [p.project_name, group || '', lead || '', CONFIG.projectStatuses[p.status]?.label || p.status, CONFIG.projectPriorities[p.priority] || '', d(p.start_date), d(p.launch_date)];
        if (pdqa) return [...common, progress ?? '', late ? 'Oui' : 'Non', (p.pdqa_data.partners || []).join(', '),
          (p.pdqa_data.contributors || []).map(id => Store.user(id)?.name).filter(Boolean).join(', '), p.description || ''];
        const sg = Timeline.stage(p), fc = Timeline.forecast(p);
        return [...common, sg.kind === 'step' ? sg.step.label : sg.kind === 'launched' ? 'Toutes les étapes terminées' : 'Timeline non planifiée',
          progress ?? '', d(fc?.end), fc?.slip ?? '', late ? 'Oui' : 'Non', p.version || 'v1'];
      });
      const sheet = XLSX.utils.aoa_to_sheet([head, ...body], { cellDates: true, dateNF: 'dd/mm/yyyy' });
      sheet['!cols'] = head.map((h, i) => ({ wch: Math.min(48, Math.max(h.length + 2, ...body.map(r => String(r[i] instanceof Date ? '00/00/0000' : r[i] ?? '').length + 2))) }));
      sheet['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: body.length, c: head.length - 1 } }) };
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, sheet, pdqa ? 'Projets PDQA' : 'Projets clients');
      const file = `${CONFIG.appName}_projets_${pdqa ? 'PDQA' : 'clients'}_${Dates.today()}.xlsx`;
      XLSX.writeFile(wb, file);
      Toast.show(`${rows.length} projet(s) exporté(s) : ${file}`);
      return { head, body, file };
    } catch (e) { Toast.error(e); return null; }
  },
};

          <div class="field"><label class="label" for="m_date">Date de réunion <span class="req">*</span></label><input class="input" type="date" id="m_date" value="${esc(Dates.key(meet?.meeting_date) || Dates.today())}"></div>

        <section class="card solid card-pad"><h2 class="section-title">Participants</h2><div class="part-grid" role="group" aria-label="Participants">${Store.users.map(u => `<button type="button" class="part-chip" data-action="chip-toggle" data-group="participants" data-value="${esc(u.id)}" aria-pressed="${selected.includes(u.id)}">${avatar(u, 24)}${esc(u.name)}</button>`).join('')}</div></section>
        <section class="card solid card-pad"><h2 class="section-title"><label for="m_agenda">Ordre du jour</label></h2><textarea class="textarea" id="m_agenda" rows="4" placeholder="1. Point 1">${esc(meet?.agenda || '')}</textarea></section>
        <section class="card solid card-pad"><h2 class="section-title"><label for="m_decisions">Décisions prises</label></h2><textarea class="textarea" id="m_decisions" rows="4" placeholder="1. Décision 1">${esc(meet?.decisions || '')}</textarea></section>
        <section class="card solid card-pad"><h2 class="section-title">Actions à suivre</h2><p class="hint mb-4">Chaque action avec un responsable devient une tâche.</p>
          <div class="mm-action-row label small" style="margin-bottom:8px"><span>Action</span><span>Responsable</span><span>Échéance</span><span></span></div>
          <div id="actionRows"></div><button class="btn btn-glass btn-sm mt-4" data-action="mm-add">${icon('plus', 'sm')}Ajouter une action</button></section>
      </div>`;
    const actions = meet?.actions || [];
    if (actions.length) actions.forEach(a => Meetings.addRow(a.title, a.assignee_id, a.due_date, a.task_id)); else Meetings.addRow();
  },
  addRow(title = '', assigneeId = '', due = '', taskId = '') {
    const row = document.createElement('div'); row.className = 'mm-action-row'; row.dataset.taskId = taskId || '';
    row.innerHTML = `<input class="input input-sm ma-title" value="${esc(title)}" placeholder="Description de l'action" aria-label="Action">
      <select class="select input-sm ma-assign" aria-label="Responsable">${UI.userOptions(assigneeId, '— Responsable —')}</select>
      <input class="input input-sm ma-due" type="date" value="${esc(Dates.key(due) || '')}" aria-label="Échéance">
      <button class="btn btn-ghost btn-sm btn-icon" data-action="mm-remove" aria-label="Supprimer l'action">${icon('x', 'sm')}</button>`;
    document.getElementById('actionRows').appendChild(row);
  },
  async save() {
    const ws = App.ws, v = id => document.getElementById(id).value.trim();
    const err = document.getElementById('err_meeting'); err.textContent = '';
    const team = v('m_team'), date = v('m_date'), projectId = v('m_proj') || null;
    if (!team || !date) { err.textContent = 'Le nom de l\'équipe et la date sont obligatoires.'; return; }
    if (ws === 'pdqa' && !projectId) { err.textContent = 'Dans l\'espace PDQA, un compte-rendu doit être rattaché à un projet.'; return; }
    const actions = [...document.querySelectorAll('.mm-action-row')].filter(r => r.querySelector('.ma-title'))
      .map(r => ({ title: r.querySelector('.ma-title').value, assignee_id: r.querySelector('.ma-assign').value || null, due_date: r.querySelector('.ma-due').value || null, task_id: r.dataset.taskId || null }))
      .filter(a => a.title.trim());
    const participants = [...document.querySelectorAll('[data-group="participants"][aria-pressed="true"]')].map(b => b.dataset.value);
    const payload = { team_name: team, meeting_date: date, project_id: projectId, agenda: v('m_agenda') || null, decisions: v('m_decisions') || null, participants, actions };
    const mid = v('m_id');
    const previous = mid ? Store.meetingIn(ws, mid) : null;
    try {
      const { data: saved, error } = mid
        ? await Store.db.from('meeting_minutes').update(payload).eq('id', mid).select().single()
        : await Store.db.from('meeting_minutes').insert({ ...payload, created_by: Store.me?.id || null }).select().single();
      if (error) throw error;
      const meetingId = saved?.id || mid;
      const r = await Meetings.syncTasks({ meetingId, team, date, projectId, actions, previousTeam: previous?.team_name });
      // Mémorise le lien action → tâche pour les prochaines modifications.
      if (r.linked) { const { error: e2 } = await Store.db.from('meeting_minutes').update({ actions }).eq('id', meetingId); if (e2) throw e2; }
      Audit.log({ entity: 'meeting', entityId: meetingId, projectId, action: mid ? 'update' : 'create', summary: `Compte-rendu « ${team} » du ${Dates.fmt(date)} ${mid ? 'modifié' : 'créé'}` });
      const parts = [r.created && `${r.created} tâche(s) créée(s)`, r.updated && `${r.updated} mise(s) à jour`, r.removed && `${r.removed} supprimée(s)`, r.kept && `${r.kept} conservée(s) car déjà commencée(s)`].filter(Boolean);
      Toast.show(`Compte-rendu enregistré${parts.length ? ' : ' + parts.join(', ') : ''}.`);
      await Promise.all([Store.refreshTable('meeting_minutes'), Store.refreshTable('tasks')]);
      Router.go(ws, 'meeting', meetingId);
    } catch (e) { Toast.error(e); }
  },
  /** Synchronise les tâches issues des actions du compte-rendu SANS perdre leur avancement :
      • action déjà liée à une tâche → la tâche est mise à jour (titre, responsable, échéance) ; son statut est conservé ;
      • nouvelle action avec responsable → une tâche est créée ;
      • action supprimée → sa tâche est supprimée si elle n'a pas commencé (« À faire »), sinon conservée.
      Les comptes-rendus enregistrés avant cette correction sont reconnus par le titre de la tâche. */
  async syncTasks({ meetingId, team, date, projectId, actions, previousTeam }) {
    const pool = Store.tasks.filter(t => t.meeting_ref === meetingId);
    const out = { created: 0, updated: 0, removed: 0, kept: 0, linked: false };
    const titleOf = (tm, a) => `[${tm}] ${a.title.trim()}`;
    for (const a of actions) {
      let task = a.task_id ? pool.find(t => t.id === a.task_id) : null;
      if (!task) task = pool.find(t => t.title === titleOf(team, a) || (previousTeam && t.title === titleOf(previousTeam, a)));
      if (task) {
        pool.splice(pool.indexOf(task), 1);
        const patch = { title: titleOf(team, a), assignee_id: a.assignee_id || task.assignee_id, due_date: a.due_date || null, project_id: projectId };
        if (Object.keys(patch).some(k => String(patch[k] ?? '') !== String(task[k] ?? ''))) {
          const { error } = await Store.db.from('tasks').update(patch).eq('id', task.id); if (error) throw error;
          out.updated++;
        }
        if (a.task_id !== task.id) { a.task_id = task.id; out.linked = true; }
      } else if (a.assignee_id) {
        const { data, error } = await Store.db.from('tasks').insert({ title: titleOf(team, a), project_id: projectId, assignee_id: a.assignee_id, due_date: a.due_date || null,
          priority: 'medium', status: 'todo', description: `Action issue du meeting : ${team} du ${Dates.fmt(date)}`, meeting_ref: meetingId }).select().single();
        if (error) throw error;
        a.task_id = data.id; out.linked = true; out.created++;
      } else if (a.task_id) { a.task_id = null; out.linked = true; }
    }
    for (const t of pool) {
      if (t.status === 'todo') { const { error } = await Store.db.from('tasks').delete().eq('id', t.id); if (error) throw error; out.removed++; }
      else out.kept++;
    }
    return out;
  },
  view(view, m) {
    const p = Store.project(m.project_id);
    const parts = (m.participants || []).map(Store.user).filter(Boolean);
    const acts = (m.actions || []).map((a, i) => `<div class="action-item"><span class="action-num">${i + 1}</span><span class="grow">${esc(a.title)}${a.assignee_id && Store.user(a.assignee_id) ? `<div class="cell-sub">${esc(Store.user(a.assignee_id).name)}</div>` : ''}</span>${a.due_date ? `<span class="due">${icon('clock', 'sm')}${esc(Dates.fmt(a.due_date))}</span>` : ''}</div>`).join('');
    view.innerHTML = pageHeader({ title: m.team_name, sub: 'Compte-rendu de réunion', crumbs: [{ page: 'meetings', label: 'Meeting Minutes' }, { label: m.team_name }],
      actions: `<button class="btn btn-glass" data-action="print">${icon('print', 'sm')}Imprimer</button><button class="btn btn-primary" data-action="edit-meeting" data-id="${esc(m.id)}">${icon('edit', 'sm')}Modifier</button>` }) +
      `<div class="page-body"><div class="mv-header"><div class="mv-team">${esc(m.team_name)}</div><div class="muted">${esc(Dates.long(m.meeting_date))}${p ? ` · <button class="link-muted" data-action="open-project" data-id="${esc(p.id)}">${esc(p.project_name)}</button>` : ''}</div></div>
        ${parts.length ? `<section class="mv-section"><h2 class="section-title">Participants</h2><div class="part-grid">${parts.map(u => `<span class="part-chip">${avatar(u, 24)}${esc(u.name)}</span>`).join('')}</div></section>` : ''}
        ${m.agenda ? `<section class="mv-section card card-pad"><h2 class="section-title">Ordre du jour</h2><div class="mv-content">${esc(m.agenda)}</div></section>` : ''}
        ${m.decisions ? `<section class="mv-section card card-pad"><h2 class="section-title">Décisions prises</h2><div class="mv-content">${esc(m.decisions)}</div></section>` : ''}
        ${acts ? `<section class="mv-section card"><div class="card-head"><h2 class="card-title">Actions à suivre</h2></div>${acts}</section>` : ''}</div>`;
  },
};

const Analytics = {
  chart: null, mode: 'all',

    const max = Math.max(1, ...Object.values(map));

      <p class="error-msg" id="err_user"></p>
      <div class="modal-actions"><button type="button" class="btn btn-ghost" data-action="close-overlay">Annuler</button><button type="submit" class="btn btn-primary">${user ? 'Enregistrer' : 'Créer'}</button></div></form>`, { label: user ? 'Modifier l\'utilisateur' : 'Nouvel utilisateur' });
    const paint = () => panel.querySelectorAll('[name="nu_color"]').forEach(r => { r.nextElementSibling.style.outline = r.checked ? '3px solid var(--brand)' : 'none'; r.nextElementSibling.style.outlineOffset = '2px'; });
    panel.addEventListener('change', paint); paint();
    panel.querySelector('#userForm').addEventListener('submit', async e => {
      e.preventDefault();
      const name = panel.querySelector('#nu_name').value.trim(), role = panel.querySelector('#nu_role').value.trim();
      if (!name || !role) { panel.querySelector('#err_user').textContent = 'Le nom et la fonction sont obligatoires.'; return; }
      const row = { name, role, email: panel.querySelector('#nu_email').value.trim() || null, avatar_color: panel.querySelector('[name="nu_color"]:checked').value };
      if (user) {
        const { data, error } = await Store.db.from('users').update(row).eq('id', user.id).select();
        if (error || !data?.length) { panel.querySelector('#err_user').textContent = friendlyError(error || 'La base n\'a pas confirmé l\'enregistrement.'); return; }
        const changes = Audit.diff(user, row, { name: ['Nom', 'text'], role: ['Fonction', 'text'], email: ['Email', 'text'] });
        if (changes.length) Audit.log({ entity: 'user', entityId: user.id, action: 'update', summary: `Utilisateur « ${name} » modifié`, changes });
        const wasPdqa = Perm.canAccessPDQA(user), isPdqa = Perm.canAccessPDQA(row);
        Overlay.close(); Toast.show(wasPdqa === isPdqa ? 'Utilisateur enregistré.' : `Utilisateur enregistré : accès PDQA ${isPdqa ? 'accordé' : 'retiré'}.`);
        await Store.refreshTable('users');
        if (user.id === Store.me?.id) { Store.me = Store.user(user.id); if (App.ws === 'pdqa' && !Perm.canAccessPDQA(Store.me)) { Router.go('customer', 'users'); return; } Shell.render(); }
        Router.refresh(); return;
      }
      const { data: created, error } = await Store.db.from('users').insert(row).select().single();
      if (error) { panel.querySelector('#err_user').textContent = friendlyError(error); return; }
      if (Store.me) Audit.log({ entity: 'user', entityId: created?.id, action: 'create', summary: `Utilisateur créé : « ${name} » (${role})` });
      Overlay.close(); Toast.show('Utilisateur créé.');
      if (fromLogin || !Store.me) Login.render(); else { await Store.refreshTable('users'); Router.refresh(); }
    });
  },
};
Object.assign(Actions, {

/* ==========================================================================
   Jalon — 07 · Navigation « poupées russes »
   Accueil (une tuile par module) → sous-choix du module → groupe (un client,
   une personne…) → liste → fiche. Chaque niveau a son adresse (#/espace/page/…),
   donc le bouton Retour du navigateur et le fil d'Ariane fonctionnent partout.
   ========================================================================== */

/* ---------- Regroupements (client / département, Project Lead / responsable) ---------- */
const Groups = {
  clean: v => String(v || '').trim().replace(/\s+/g, ' '),
  /** Valeur de regroupement d'un projet ('' = non renseigné). */
  of(p, by) {
    if (by === 'client') return Groups.clean(p.workspace === 'pdqa' ? p.pdqa_data?.department : p.client_name);
    return Groups.clean(Rules.projectLeadName(p));
  },
  same: (a, b) => Groups.clean(a).toLowerCase() === Groups.clean(b).toLowerCase(),
  noun(by, ws = App.ws, plural = false) {
    const n = by === 'client' ? (ws === 'pdqa' ? ['département', 'départements'] : ['client', 'clients'])
      : (ws === 'pdqa' ? ['responsable', 'responsables'] : ['Project Lead', 'Project Leads']);
    return n[plural ? 1 : 0];
  },
  emptyLabel: by => (by === 'client' ? (App.ws === 'pdqa' ? 'Département non renseigné' : 'Client non renseigné') : 'Sans Project Lead'),
  /** Liste des groupes d'un espace : [{ value, label, projects }], les plus fournis d'abord. */
  list(by, ws = App.ws) {
    const map = new Map();
    Store.projectsIn(ws).forEach(p => {
      const v = Groups.of(p, by), k = v.toLowerCase();
      if (!map.has(k)) map.set(k, { value: v, label: v || Groups.emptyLabel(by), projects: [] });
      map.get(k).projects.push(p);
    });
    return [...map.values()].sort((a, b) => (!a.value) - (!b.value) || b.projects.length - a.projects.length || cmp(a.label, b.label));
  },
  /** Utilisateur dont le nom correspond au Project Lead (pour afficher son avatar). */
  userNamed(name) { return name ? Store.users.find(u => Groups.same(u.name, name) || Groups.same(u.name.split(' ')[0], name)) || null : null; },
};

/* ---------- Tuiles ---------- */
const Tiles = {
  /** t : { page, param, icon, title, sub, meta, color, avatar } — chaque tuile est un vrai lien. */
  html(items, size = '') {
    return `<div class="tiles ${size}">${items.map((t, i) => `<a class="tile" href="${Router.href(App.ws, t.page, t.param)}" style="--tc:${t.color || 'var(--bar)'};--i:${i}">
      <span class="tile-top">${t.avatar || `<span class="tile-ico" aria-hidden="true">${icon(t.icon || 'folder', 'lg')}</span>`}<span class="tile-go" aria-hidden="true">${icon('right', 'sm')}</span></span>
      <span class="tile-title">${esc(t.title)}</span>
      ${t.sub ? `<span class="tile-sub">${esc(t.sub)}</span>` : ''}
      ${t.meta ? `<span class="tile-meta">${t.meta}</span>` : ''}
    </a>`).join('')}</div>`;
  },
  /** Barre de météo : répartition des projets (dans les temps / à risque / en retard / autres). */
  meteoBar(infos) {
    if (!infos.length) return '';
    const n = k => infos.filter(r => r.meteo === k).length;
    const parts = [['ok', 'var(--ok)'], ['risk', 'var(--warn)'], ['late', 'var(--danger)']].map(([k, c]) => [n(k), c]).filter(([v]) => v);
    const rest = infos.length - parts.reduce((s, [v]) => s + v, 0);
    return `<span class="mbar" aria-hidden="true">${parts.map(([v, c]) => `<i style="flex:${v};background:${c}"></i>`).join('')}${rest ? `<i style="flex:${rest};background:var(--line-strong)"></i>` : ''}</span>`;
  },
  counts(infos) {
    const n = k => infos.filter(r => r.meteo === k).length;
    return [n('late') && `<span class="badge b-danger">${n('late')} en retard</span>`, n('risk') && `<span class="badge b-warn">${n('risk')} à risque</span>`,
      n('ok') && `<span class="badge b-ok">${n('ok')} dans les temps</span>`].filter(Boolean).join('');
  },
};
const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;
const projectInfos = (ws, list = Store.projectsIn(ws)) => (ws === 'customer' ? list.map(Board.info)
  : list.map(p => ({ p, meteo: p.status === 'done' ? 'done' : p.status === 'paused' ? 'paused' : Rules.isProjectLate(p) ? 'late' : 'ok' })));

      <a class="btn btn-glass btn-sm" href="${Router.href(ws, 'projects-board')}">Voir la synthèse${icon('right', 'sm')}</a></div>` : '';
    view.innerHTML = pageHeader({ title: `Bonjour ${(me.name || '').split(' ')[0]}`, sub: `${Dates.long(today)} · ${CONFIG.workspaces[ws].label}`,

  pdqaTiles(today) {

        meta: ideas.some(i => i.stage === 'validated') ? `<span class="badge b-ok">${plural(ideas.filter(i => i.stage === 'validated').length, 'idée validée', 'idées validées')}</span>` : '' },
      { page: 'events', icon: 'pin', color: 'var(--ph2)', title: 'Visites / Workshop / Salon', sub: next ? `Prochain : ${next.title}` : 'Aucun événement à venir',
        meta: next ? `<span class="chip">${esc(Events.dates(next))}</span>` : '' },

        meta: unplanned ? `<span class="badge b-warn">${unplanned} à planifier</span>` : '' },
      { page: 'mp', icon: 'flask', color: 'var(--ph4)', title: 'Prévalidation MP', sub: plural(mpOpen.length, 'matière en revue', 'matières en revue'),

};

/* ---------- Le processus de développement client, en habillage de la page Projets ----------
   Reprend le visuel de la timeline des one-pagers (flèches par phase, Gates en violet),
   à partir du modèle CONFIG.timelineTemplate. Purement informatif. */
const Process = {
  bannerHTML() {
    const tpl = CONFIG.timelineTemplate;
    let k = 0;
    const rows = CONFIG.phases.map((ph, pi) => {
      const steps = tpl.filter(s => s.phase === ph.id);
      const days = steps.filter(s => !s.industrialTest).reduce((n, s) => n + (Number(s.days) || 0), 0);
      return `<div class="tl-row pr-row"><div class="tl-row-head" style="border-color:var(--ph${pi + 1})"><span class="tl-row-ph">${esc(ph.id)}</span><span class="tl-row-lbl">${esc(ph.label)}</span><span class="tl-row-ph">≈ ${days} j</span></div>
        <ol class="chev-row">${steps.map((s, i) => {
          const gate = Timeline.isGate(s.name);
          return `<li class="chev pr-chev ${gate ? 'is-gate' : `ph${pi + 1}`} ${s.industrialTest ? 'is-opt' : ''} ${i === 0 ? 'first' : ''}" style="--k:${k++}" title="${esc(s.name)} · ${s.days} j${s.industrialTest ? ' · seulement avec test industriel' : ''}">
            ${gate ? `<span class="chev-gate-no">Gate ${Timeline.gateNumber(s.name)}</span><span class="chev-name">${esc(Timeline.gateTitle(s.name))}</span>` : `<span class="chev-name">${esc(s.name)}</span>`}
            <span class="chev-foot"><span>${s.days} j</span>${s.industrialTest ? '<span>test indus.</span>' : ''}</span></li>`;
        }).join('')}</ol></div>`;
    }).join('');
    return `<section class="card process" aria-labelledby="procH"><div class="process-head"><h2 class="card-title" id="procH">Le processus de développement client</h2>
      <span class="muted small">${tpl.length} étapes, 4 Gates de décision · durées indicatives du modèle</span></div><div class="tl-rows">${rows}</div></section>`;
  },
};
