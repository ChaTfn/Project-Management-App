.tile .avatar { margin: 6px; box-shadow: 0 0 0 4px var(--surface), 0 0 0 6px var(--line-strong); }
.tile-go { color: var(--text-3); transition: transform var(--t-fast), color var(--t-fast); }
.tile:hover .tile-go { color: var(--text); transform: translateX(3px); }
.tile-title { font-size: var(--fs-lg); font-weight: var(--fw-bold); line-height: 1.25; overflow-wrap: anywhere; }
.tiles.lg .tile-title { font-size: var(--fs-xl); }
.tile-sub { font-size: var(--fs-sm); color: var(--text-3); }
.tile-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.mbar { display: flex; width: 100%; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; margin-bottom: 4px; }
.mbar i { display: block; height: 100%; }
.hub-alert { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-5);
  border-radius: var(--r-md); background: var(--warn-soft); color: var(--warn); font-weight: var(--fw-semibold); font-size: var(--fs-md); }
.hub-alert > span { flex: 1; min-width: 200px; }
.breadcrumb a, .breadcrumb button { color: var(--text-3); font-weight: var(--fw-medium); text-decoration: none; }

/* Kanban de synthèse : une colonne par phase */
.bk-scroll { overflow-x: auto; padding-bottom: var(--sp-2); }
.bk { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: var(--sp-3); align-items: start; }
.bk-col { background: var(--surface-3); border-radius: var(--r-lg); padding: 0 10px 10px; border-top: 5px solid var(--c); }
.bk-head { display: flex; align-items: baseline; gap: 8px; padding: 12px 4px 10px; flex-wrap: wrap; }
.bk-title { font-weight: var(--fw-bold); font-size: var(--fs-base); }
.bk-sub { font-size: var(--fs-xs); color: var(--text-3); }
.bk-count { margin-left: auto; font-size: var(--fs-sm); font-weight: var(--fw-bold); color: var(--text-2); }
.bk-cards { display: grid; gap: 8px; }
.bk-card { display: flex; flex-direction: column; gap: 5px; width: 100%; text-align: left; padding: 12px; border-radius: var(--r-md);
  background: var(--surface); border: 1px solid var(--line); transition: box-shadow var(--t-fast), transform var(--t-fast); }
.bk-card:hover { box-shadow: 0 4px 14px rgba(20,33,61,.10); transform: translateY(-1px); }
.bk-card.m-late { border-color: var(--danger); } .bk-card.m-risk { border-color: var(--warn); }
.bk-name { font-weight: var(--fw-bold); font-size: var(--fs-md); line-height: 1.3; }
.bk-card .bl-svg { margin: 4px 0 0; }
.bk-where { font-size: var(--fs-sm); color: var(--text-2); }
.bk-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.bk-foot .bg-title, .bk-foot .due { font-size: var(--fs-xs); }
@media (max-width: 760px) {
  .bk { grid-auto-flow: row; grid-auto-columns: auto; grid-template-columns: minmax(0, 1fr); }
  .tile { padding: var(--sp-4); }
  .tiles.lg { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
  .tiles.lg .tile-title { font-size: var(--fs-lg); }
  .tiles.lg .tile-sub { font-size: var(--fs-xs); }
}

/* Kanban de synthèse étape par étape ------------------------------------- */
.bk-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-2) var(--sp-4); margin-bottom: var(--sp-3); }
.bk-bar .segmented button { display: inline-flex; align-items: center; gap: 7px; }
.bk-dot { width: 10px; height: 4px; border-radius: 2px; display: inline-block; }
.bk-scroll { position: relative; overflow-x: auto; padding-bottom: var(--sp-3); scroll-padding-left: 0; }
.bk { display: flex; gap: var(--sp-4); width: max-content; align-items: stretch; }
.bk-phase { display: flex; flex-direction: column; gap: 8px; }
.bk-phase-head { display: flex; align-items: baseline; gap: 8px; padding: 0 2px 8px; border-bottom: 4px solid var(--c); position: sticky; left: 0; }
.bk-phase-name { font-weight: var(--fw-bold); font-size: var(--fs-lg); }
.bk-cols { display: flex; gap: 8px; flex: 1; }
.bk-col { width: 214px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--surface-3); border-radius: var(--r-md); border: 1px solid transparent; padding: 0; border-top: 0; }
.bk-col.is-gate { background: var(--gate-soft); border-color: var(--gate-border); }
.bk-head { display: flex; align-items: flex-start; gap: 8px; padding: 10px 10px 8px; min-height: 62px; }
.bk-mark { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 11px; font-weight: var(--fw-bold);
  background: var(--surface); color: var(--text-2); box-shadow: inset 0 0 0 3px var(--c); }
.bk-mark.gate { border-radius: 7px; background: var(--gate); color: #FFFFFF; box-shadow: none; width: 26px; }
.bk-title { flex: 1; min-width: 0; font-size: var(--fs-sm); font-weight: var(--fw-semibold); line-height: 1.3; color: var(--text-2); }
.bk-col.is-gate .bk-title { color: var(--gate-ink); }
.bk-gno { display: block; font-size: var(--fs-xs); color: var(--gate); }
.bk-opt { display: block; font-size: 11.5px; font-weight: var(--fw-regular); color: var(--text-3); margin-top: 2px; }
.bk-count { font-size: var(--fs-sm); font-weight: var(--fw-bold); color: var(--text-3); padding-top: 2px; }
.bk-cards { display: grid; gap: 6px; padding: 0 6px 6px; align-content: start; flex: 1; }
.bk-empty { min-height: 40px; border: 1.5px dashed var(--line-strong); border-radius: var(--r-sm); opacity: .55; }
.bk-card { display: flex; flex-direction: column; gap: 5px; width: 100%; text-align: left; padding: 10px 11px; border-radius: var(--r-sm);
  background: var(--surface); border: 1px solid var(--line); transition: box-shadow var(--t-fast), transform var(--t-fast) var(--ease), border-color var(--t-fast); }
.bk-card:hover { box-shadow: 0 6px 16px rgba(20,33,61,.12); transform: translateY(-2px); }
.bk-card:active { transform: translateY(0) scale(.985); }
.bk-card.m-late { border-color: var(--danger); } .bk-card.m-risk { border-color: var(--warn); }
.bk-name { font-weight: var(--fw-bold); font-size: var(--fs-md); line-height: 1.3; }
.bk-state { font-size: var(--fs-xs); color: var(--text-3); }
.bk-prog { display: block; height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; margin-top: 2px; }
.bk-prog i { display: block; height: 100%; background: var(--c, var(--bar)); border-radius: inherit; }
.bk-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.bk-foot .bg-title, .bk-foot .due { font-size: var(--fs-xs); }

/* Processus en habillage de la page Projets ------------------------------- */
.process { padding: var(--sp-4) var(--sp-5) var(--sp-5); margin-bottom: var(--sp-5); overflow: hidden; }
.process-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px var(--sp-4); margin-bottom: var(--sp-4); }
.pr-row .tl-row-head { border-left-width: 4px; }
.pr-chev { min-height: 58px; }
.chev.ph1 { background: var(--ph1); color: var(--on-brand); }
.chev.ph2 { background: var(--ph2); } .chev.ph3 { background: var(--ph3); } .chev.ph4 { background: var(--ph4); }
body.theme-dark .chev.ph2, body.theme-dark .chev.ph3, body.theme-dark .chev.ph4 { color: #0E1424; }
.chev.is-opt { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.16) 0 6px, transparent 6px 12px); }
.pr-chev:hover { filter: brightness(1.07); }
@media (max-width: 560px) { .pr-row .chev { flex: 1 1 calc(50% - 3px); } }

/* Mouvement ------------------------------------------------------------------
   Un seul langage : les éléments arrivent comme une rame qui entre en station
   (glissement court, décélération franche), et les lignes se tracent de gauche
   à droite. Joué à l'ouverture d'un module (classe .is-entering, retirée après
   1,1 s), jamais lors d'un simple filtre. */
:root { --ease-out: cubic-bezier(.16, 1, .3, 1); }
#view { view-transition-name: page; }
::view-transition-old(root), ::view-transition-new(root) { animation: none; }
::view-transition-old(page) { animation: vt-out 150ms ease-in both; }
::view-transition-new(page) { animation: vt-in 340ms var(--ease-out) both; }
html[data-nav="out"]::view-transition-new(page) { animation-name: vt-in-back; }
@keyframes vt-out { to { opacity: 0; } }
@keyframes vt-in { from { opacity: 0; transform: translateX(28px); } }
@keyframes vt-in-back { from { opacity: 0; transform: translateX(-28px); } }

@keyframes arrive { from { opacity: 0; transform: translateY(14px); } }
@keyframes arrive-side { from { opacity: 0; transform: translateX(-14px); } }
@keyframes reveal-x { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes grow-x { from { transform: scaleX(0); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.4); } }
@keyframes ring { from { box-shadow: 0 0 0 4px var(--surface), 0 0 0 4px var(--tc); } }

.is-entering .page-header { animation: arrive 360ms var(--ease-out) both; }
.is-entering .tile { animation: arrive 460ms var(--ease-out) both; animation-delay: calc(80ms + min(var(--i, 0), 9) * 45ms); }
.is-entering .tile-ico { animation: ring 700ms var(--ease-out) both; animation-delay: calc(260ms + min(var(--i, 0), 9) * 45ms); }
.is-entering .mbar i { transform-origin: left; animation: grow-x 700ms var(--ease-out) both; animation-delay: 380ms; }
.is-entering .hub-alert { animation: arrive-side 420ms var(--ease-out) both; animation-delay: 60ms; }
.is-entering .process { animation: arrive 400ms var(--ease-out) both; }
.is-entering .pr-chev { animation: reveal-x 420ms var(--ease-out) both; animation-delay: calc(140ms + var(--k, 0) * 26ms); }
.is-entering .bk-card, .is-entering .brow { animation: arrive 420ms var(--ease-out) both; animation-delay: calc(120ms + min(var(--i, 0), 14) * 28ms); }
.is-entering .bl-svg { animation: reveal-x 800ms var(--ease-out) both; animation-delay: calc(200ms + min(var(--i, 0), 14) * 28ms); }
.is-entering .chev-row .chev:not(.pr-chev) { animation: reveal-x 380ms var(--ease-out) both; }
.is-entering .table-wrap { animation: arrive 380ms var(--ease-out) both; animation-delay: 100ms; }
.is-entering .kb-card, .is-entering .cal-month, .is-entering .cal-week, .is-entering .meeting-card, .is-entering .kpi-strip, .is-entering .dash-grid { animation: arrive 400ms var(--ease-out) both; animation-delay: 120ms; }

/* Retours d'action */
.tile:active { transform: translateY(0) scale(.985); }
.tile:hover .tile-ico { box-shadow: 0 0 0 3px var(--surface), 0 0 0 7px var(--tc); }
.tile-ico { transition: box-shadow 220ms var(--ease-out); }
.filter-chip, .segmented button { transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast), transform var(--t-fast); }
.filter-chip:active, .segmented button:active { transform: scale(.96); }

@media (prefers-reduced-motion: reduce) {
  ::view-transition-old(page), ::view-transition-new(page) { animation: none !important; }
  .is-entering * { animation: none !important; }
  .tile:hover .tile-ico { transition: none; }
}
.process .tl-row { grid-template-columns: 132px minmax(0, 1fr); }
.bk-cols { align-items: flex-start; }
.bk-col { min-height: 180px; }
@media (max-width: 1100px) { .process .tl-row { grid-template-columns: 1fr; } }

/* 10. MODULES PDQA ET MON ESPACE ============================================
   Innovation, Visites / Workshop / Salon, Planning des projets (Gantt),
   Prévalidation MP, Mon espace. Mêmes tokens que le reste de l'application. */

/* Étiquette d'espace (Mon espace) */
.ws-tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: var(--r-xs); font-size: var(--fs-xs); font-weight: var(--fw-semibold); white-space: nowrap; vertical-align: 1px; margin-right: 6px; }
.ws-tag.customer { color: var(--brand-ink); background: var(--brand-soft); }
.ws-tag.pdqa { color: #0B5753; background: rgba(15,110,106,.10); }
body.theme-dark .ws-tag.pdqa { color: #6FD8D1; background: rgba(43,165,158,.16); }
.filter-chip .ws-dot { display: inline-block; margin-right: 7px; vertical-align: 1px; }
.my-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--sp-5); align-items: start; }
.my-grid:not(:has(> aside)) { grid-template-columns: minmax(0, 1fr); }
.my-group { display: flex; align-items: center; gap: 6px; margin-bottom: var(--sp-3); }
.my-grid .table-wrap { max-height: none; }
/* Colonnes identiques d'un groupe à l'autre (En retard, Aujourd'hui…) */
.my-grid .table { table-layout: fixed; min-width: 720px; }
.my-grid .table th:nth-child(1) { width: 52px; }
.my-grid .table th:nth-child(3) { width: 24%; }
.my-grid .table th:nth-child(4) { width: 130px; }
.my-grid .table th:nth-child(5) { width: 110px; }
.my-grid .table th:nth-child(6) { width: 160px; }
.my-grid .table th:nth-child(7) { width: 56px; }
.my-grid .table td:nth-child(2) { min-width: 0 !important; }
/* Téléphone : chaque tâche devient une carte (case, titre, menu ; puis projet et échéance). */
@media (max-width: 760px) {
  .my-grid .table-wrap { overflow: visible; }
  .my-grid .table { min-width: 0; table-layout: auto; }
  .my-grid .table thead { display: none; }
  .my-grid .table, .my-grid .table tbody { display: block; }
  .my-grid .table tr { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 12px 8px 12px 46px; border-bottom: 1px solid var(--line); }
  .my-grid .table tbody tr:last-child { border-bottom: 0; }
  .my-grid .table td { padding: 0; border: 0; }
  .my-grid .table td:nth-child(1) { position: absolute; left: 12px; top: 12px; }
  .my-grid .table td:nth-child(2) { flex: 1 1 0; }
  .my-grid .table td:last-child { order: 1; width: auto; }
  .my-grid .table td:nth-child(n+3):not(:last-child) { order: 2; }
  .my-grid .table td:nth-child(3) { flex-basis: 100%; font-size: var(--fs-sm); }
  .my-grid .table tr.is-late { box-shadow: inset 3px 0 0 var(--danger); }
  .my-grid .table tr.is-late td:first-child { box-shadow: none; }
}
.top-me { position: relative; text-decoration: none; }
.top-me .nav-count { margin-left: 2px; }
@media (max-width: 1240px) { .my-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 1100px) { .top-me .nav-count { position: absolute; top: 1px; right: -2px; margin: 0; } }

/* Innovation : tableau par étape et matrice potentiel / effort */
.inno-board { grid-template-columns: repeat(var(--cols, 4), minmax(240px, 1fr)); }
.inno-card { cursor: default; }
.inno-pe { font-size: var(--fs-xs); color: var(--text-2); }

.matrix { display: grid; grid-template-columns: 22px 70px minmax(0, 1fr); gap: 6px; }
.mx-ylab { writing-mode: vertical-rl; transform: rotate(180deg); align-self: center; font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-3); }
.mx-rows, .mx-grid { display: grid; grid-template-rows: repeat(3, minmax(130px, auto)); gap: 6px; }
.mx-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.mx-rl { display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-2); }
.mx-cell { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 10px; border-radius: var(--r-md); background: var(--surface-3); }
.mx-cell.is-best { background: var(--brand-soft); box-shadow: inset 0 0 0 1.5px var(--brand-border); }
.mx-hint { font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--text-3); }
.mx-cell.is-best .mx-hint { color: var(--brand-ink); }
.mx-item { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface);
  border: 1px solid var(--line); text-align: left; font-size: var(--fs-sm); font-weight: var(--fw-semibold); line-height: 1.3; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; min-width: 0; max-width: 100%;
  transition: border-color var(--t-fast), box-shadow var(--t-fast); }
.mx-item:hover { border-color: var(--line-strong); box-shadow: 0 4px 12px rgba(20,33,61,.08); }
.mx-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-2); }
.mx-xlab { text-align: center; font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-3); }
@media (max-width: 760px) {
  .matrix { grid-template-columns: 0 44px minmax(0, 1fr); gap: 4px; }
  .mx-ylab { visibility: hidden; }
  .mx-rows, .mx-grid { grid-template-rows: repeat(3, minmax(90px, auto)); gap: 4px; }
  .mx-cell { padding: 6px; }
  .mx-item { padding: 6px; font-size: var(--fs-xs); }
  .mx-item .badge { display: none; }
  .mx-hint { font-size: 10.5px; }
  .mx-rl { font-size: var(--fs-xs); }
}

/* Visites / Workshop / Salon */
.ev-month { font-size: var(--fs-lg); font-weight: var(--fw-semibold); margin: var(--sp-6) 0 var(--sp-2); }
.ev-month::first-letter { text-transform: uppercase; }
#evBody > .ev-month:first-child { margin-top: 0; }
.ev-card.is-cancelled { opacity: .7; }
.ev-card.is-cancelled .link-btn { text-decoration: line-through; }
.ev-event { color: var(--space-ink); background: var(--surface-3); border-left-style: dashed; }
.legend-swatch.ev-event { background: var(--space); }

/* Planning des projets (Gantt) */
.gantt-scroll { overflow: auto; max-height: calc(100vh - 260px); padding: 0; }
.gantt { --g-label: 260px; position: relative; min-width: 860px; }
.g-row { display: grid; grid-template-columns: var(--g-label) minmax(0, 1fr); min-height: 50px; border-bottom: 1px solid var(--line); }
.g-body > .g-row:last-child { border-bottom: 0; }
.g-head { min-height: 40px; position: sticky; top: 0; z-index: 3; background: var(--surface-2); }
.g-label { position: sticky; left: 0; z-index: 2; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0;
  padding: 6px var(--sp-4); text-align: left; background: var(--surface); border-right: 1px solid var(--line); }
.g-head .g-label { background: var(--surface-2); font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-3); }
button.g-label:hover .g-name { color: var(--space-ink); text-decoration: underline; text-underline-offset: 2px; }
.g-name, .g-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-name { font-size: var(--fs-md); font-weight: var(--fw-semibold); }
.g-sub { font-size: var(--fs-xs); color: var(--text-3); }
.g-track { position: relative; min-width: 0; }
.g-month { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding-left: 8px; overflow: hidden; white-space: nowrap;
  border-left: 1px solid var(--line); font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-2); }
.g-body { position: relative; }
.g-grid { position: absolute; top: 0; bottom: 0; left: var(--g-label); right: 0; z-index: 0; pointer-events: none; }
.g-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.g-today { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text); opacity: .7; }
.g-group { position: relative; z-index: 1; padding: 8px var(--sp-4); background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: var(--fs-sm); font-weight: var(--fw-bold); }
.g-group > span { position: sticky; left: var(--sp-4); }
.g-bar { position: absolute; top: 50%; z-index: 1; height: 24px; margin-top: -12px; min-width: 6px; display: flex; align-items: center; overflow: hidden; border-radius: 6px;
  transition: box-shadow var(--t-fast); }
.g-bar.clip-l { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.g-bar.clip-r { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.g-bar.is-active { background: var(--space-soft); box-shadow: inset 0 0 0 1.5px var(--space); }
.g-bar.is-active .g-fill { background: var(--space); opacity: .45; }
.g-bar.is-late { background: var(--danger-soft); box-shadow: inset 0 0 0 1.5px var(--danger); }
.g-bar.is-late .g-fill { background: var(--danger); opacity: .35; }
.g-bar.is-paused, .g-paused-sw { background: repeating-linear-gradient(135deg, var(--surface-3) 0 6px, var(--line-strong) 6px 8px); }
.g-bar.is-paused { box-shadow: inset 0 0 0 1px var(--line-strong); }
.g-bar.is-done { background: var(--line-strong); }
.g-bar.is-done .g-fill, .g-bar.is-paused .g-fill { background: var(--text-3); opacity: .3; }
.g-fill { position: absolute; left: 0; top: 0; bottom: 0; }
.g-txt { position: relative; z-index: 1; padding: 0 8px; font-size: var(--fs-xs); font-weight: var(--fw-bold); color: var(--text); white-space: nowrap; }
.g-bar:hover { box-shadow: inset 0 0 0 2px var(--text-2), 0 4px 12px rgba(20,33,61,.14); }
.g-bar:focus-visible, .g-mark:focus-visible { outline: 3px solid var(--brand); outline-offset: 1px; }
.g-mark, .g-mark-sw { width: 12px; height: 12px; border-radius: 2px; transform: rotate(45deg); background: var(--surface); border: 2.5px solid var(--text-2); }
.g-mark { position: absolute; top: 50%; z-index: 2; margin: -6px 0 0 -6px; }
.g-mark-sw { display: inline-block; width: 10px; height: 10px; border-width: 2px; }
@media (max-width: 760px) { .gantt { --g-label: 150px; min-width: 720px; } .g-sub { display: none; } .g-label { padding: 6px 10px; } }

/* Prévalidation MP */
.checklist { display: grid; gap: 4px; margin-top: 6px; }
.check-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); font-size: var(--fs-md); cursor: pointer; }
.check-row > span:nth-child(2) { flex: 1; min-width: 0; }
.check-row input { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--ok); }
.check-row:has(input:checked) { background: var(--ok-soft); border-color: rgba(21,127,59,.30); }
.check-row:has(input:disabled) { cursor: default; }
.mp-decision { display: grid; gap: var(--sp-3); padding-top: var(--sp-4); border-top: 1px solid var(--line); }

@media print {
  .gantt-scroll { overflow: visible; max-height: none; }
  .gantt { min-width: 0; }
  .g-head, .g-label { position: static; }
}
.is-entering .g-row:not(.g-head), .is-entering .ev-card, .is-entering .mx-cell { animation: arrive 400ms var(--ease-out) both; animation-delay: 100ms; }
.is-entering .g-bar { transform-origin: left; animation: grow-x 600ms var(--ease-out) both; animation-delay: 200ms; }

</style>

/* ---------- 2. OUTILS GÉNÉRAUX ---------- */
/** Échappe un texte avant de l'insérer dans du HTML (protection contre l'injection). */
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function icon(name, cls = '') { return `<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`; }
function initials(name) { return (name || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase(); }
function avatar(user, size = 28) {
  const bg = /^#[0-9a-f]{3,8}$/i.test(user?.avatar_color || '') ? user.avatar_color : '#3A4A6B';
  return `<span class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .38)}px;background:${bg}" aria-hidden="true">${esc(initials(user?.name))}</span>`;
}
function normalizeRole(role) {
  return String(role || '').toLowerCase().replace(/\s*&\s*/g, '&').replace(/\s+/g, ' ').trim();
}
function uniqueSorted(values) {
  return [...new Set(values.filter(v => v !== null && v !== undefined && String(v).trim() !== ''))]
    .sort((a, b) => String(a).localeCompare(String(b), 'fr', { sensitivity: 'base' }));
}
function cmp(a, b) {
  if (a === b) return 0;
  if (a === null || a === undefined || a === '') return 1;   // les valeurs vides en dernier
  if (b === null || b === undefined || b === '') return -1;
  if (typeof a === 'number' && typeof b === 'number') return a - b;
  return String(a).localeCompare(String(b), 'fr', { sensitivity: 'base', numeric: true });
}

/* ---------- 3. DATES (toujours en « jour local », jamais en UTC) ----------
   Les échéances sont des dates sans heure (AAAA-MM-JJ). On les compare comme
   des textes, ce qui évite les décalages de fuseau horaire et d'heure d'été. */
const Dates = {
  pad: n => String(n).padStart(2, '0'),
  /** Date JS -> 'AAAA-MM-JJ' selon l'heure locale de l'ordinateur. */
  toKey(d) { return `${d.getFullYear()}-${Dates.pad(d.getMonth() + 1)}-${Dates.pad(d.getDate())}`; },
  today() { return Dates.toKey(new Date()); },
  /** 'AAAA-MM-JJ' (ou horodatage) -> clé normalisée, ou null. */
  key(value) { return value ? String(value).slice(0, 10) : null; },
  /** 'AAAA-MM-JJ' -> Date locale à midi (midi évite tout effet de changement d'heure). */
  parse(value) {
    const k = Dates.key(value); if (!k) return null;
    const [y, m, d] = k.split('-').map(Number);
    return new Date(y, m - 1, d, 12);
  },
  addDays(key, n) { const d = Dates.parse(key); d.setDate(d.getDate() + n); return Dates.toKey(d); },
  addMonths(key, n) { const d = Dates.parse(key); d.setDate(1); d.setMonth(d.getMonth() + n); return Dates.toKey(d); },
  /** Nombre de jours calendaires de a vers b (b - a). */
  diffDays(a, b) {
    const da = Dates.parse(a), db = Dates.parse(b);
    return Math.round((Date.UTC(db.getFullYear(), db.getMonth(), db.getDate()) -
      Date.UTC(da.getFullYear(), da.getMonth(), da.getDate())) / 86400000);
  },
  startOfWeek(key) { const d = Dates.parse(key); const dow = (d.getDay() + 6) % 7; return Dates.addDays(key, -dow); },
  startOfMonth(key) { return Dates.key(key).slice(0, 8) + '01'; },
  isWeekend(key) { const dow = Dates.parse(key).getDay(); return dow === 0 || dow === 6; },
  fmt(value, opts = { day: '2-digit', month: 'short', year: 'numeric' }) {
    const d = Dates.parse(value); return d ? d.toLocaleDateString(CONFIG.locale, opts) : '—';
  },
  short(value) { return Dates.fmt(value, { day: 'numeric', month: 'short' }); },
  long(value) { return Dates.fmt(value, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); },
  monthLabel(key) { return Dates.fmt(key, { month: 'long', year: 'numeric' }); },
  /** Année ISO de la semaine (le 31/12/2029 appartient à la semaine 1 de 2030). */
  isoYear(key) {
    const d = Dates.parse(key); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    return t.getUTCFullYear();
  },
  isoWeek(key) {
    const d = Dates.parse(key); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 86400000 + 1) / 7);
  },
};

/* ---------- 4. RÈGLES MÉTIER ---------- */
const Rules = {
  taskStatus(id) { return CONFIG.taskStatuses.find(s => s.id === id) || CONFIG.taskStatuses[0]; },
  isTaskDone: t => t?.status === 'done',
  isTaskOverdue(t, today = Dates.today()) { return !!t.due_date && !Rules.isTaskDone(t) && Dates.key(t.due_date) < today; },
  /** État d'échéance : none | done | overdue | today | soon | later */
  dueState(t, today = Dates.today()) {
    if (!t.due_date) return 'none';
    if (Rules.isTaskDone(t)) return 'done';
    const diff = Dates.diffDays(today, Dates.key(t.due_date));
    if (diff < 0) return 'overdue';
    if (diff === 0) return 'today';
    if (diff <= CONFIG.dueSoonDays) return 'soon';
    return 'later';
  },
  /** Un projet est en retard si sa date de lancement / fin est passée et qu'il n'est pas terminé. */
  isProjectLate(p, today = Dates.today()) { return !!p.launch_date && p.status !== 'done' && Dates.key(p.launch_date) < today; },
  /** Progression : étapes de timeline terminées (projets clients) ou tâches terminées (PDQA). null si non calculable. */
  projectProgress(p, tasks) {
    const steps = Array.isArray(p.timeline_steps) ? p.timeline_steps : [];
    if (steps.length) return Math.round(steps.filter(s => s.status === 'done').length / steps.length * 100);
    const own = tasks.filter(t => t.project_id === p.id);
    if (own.length) return Math.round(own.filter(Rules.isTaskDone).length / own.length * 100);
    return null;
  },
  projectLeadName(p) {
    if (p.workspace === 'pdqa') return Store.user(p.pdqa_data?.lead_id)?.name || '';
    return (p.org_data?.lead || '').trim();
  },
};

/* ---------- 4 bis. TIMELINE CLIENT ----------
   Les étapes enregistrées dans les one-pagers sont reliées au modèle par leur nom
   (sans tenir compte des accents, majuscules ni ponctuation). Les projets existants,
   enregistrés avec des noms sans accents, sont donc reconnus automatiquement. */
const Timeline = {
  norm(name) {
    return String(name || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ').trim();
  },
  _index: null,
  index() {
    if (!Timeline._index) {
      Timeline._index = new Map();
      CONFIG.timelineTemplate.forEach((s, i) => [s.name, ...(s.aliases || [])].forEach(n => Timeline._index.set(Timeline.norm(n), i)));
    }
    return Timeline._index;
  },
  /** Position de l'étape dans le modèle, ou -1 pour une étape personnalisée. */
  templateIndexOf(name) { const i = Timeline.index().get(Timeline.norm(name)); return i === undefined ? -1 : i; },
  isGate(name) { return /^gate\s*\d/.test(Timeline.norm(name)); },
  gateNumber(name) { const m = Timeline.norm(name).match(/^gate\s*(\d)/); return m ? Number(m[1]) : null; },
  /** Libellé de la Gate sans le préfixe « Gate n : ». */
  gateTitle(name) { return String(name || '').replace(/^\s*gate\s*\d\s*[:\-–]?\s*/i, ''); },
  template(withIndustrialTest = true) {
    return CONFIG.timelineTemplate.filter(s => withIndustrialTest || !s.industrialTest);
  },
  /** Complète les étapes d'un projet : libellé normalisé, phase, Gate, position dans le modèle. */
  enrich(steps) {
    let lastPhase = CONFIG.phases[0].id, lastIdx = -1;
    return (Array.isArray(steps) ? steps : []).map(s => {
      const idx = Timeline.templateIndexOf(s.name);
      const tpl = idx >= 0 ? CONFIG.timelineTemplate[idx] : null;
      const phase = s.phase || tpl?.phase || lastPhase;
      lastPhase = phase;
      if (idx >= 0) lastIdx = idx;
      return { ...s, label: tpl ? tpl.name : (s.name || 'Étape sans nom'), phase, gate: Timeline.isGate(s.name),
        templateIndex: idx, anchorIndex: idx >= 0 ? idx : Math.max(lastIdx, 0), custom: idx < 0,
        status: CONFIG.stepStatuses[s.status] ? s.status : 'upcoming', prog: Math.max(0, Math.min(100, Number(s.prog) || 0)) };
    });
  },
  /** Planning des étapes à partir de la date de début (durées en jours calendaires).
      Une étape commence le lendemain de la fin de la précédente ; une durée de 0 jour
      correspond à un jalon le jour même. Renvoie, pour chaque étape, sa date de clôture
      et le numéro de semaine ISO de cette date (S52 ou S53, puis S1 au changement d'année). */
  schedule(startKey, items) {
    // items : durées (nombres) ou étapes { days, actual_end }. Une étape clôturée en réel
    // fixe sa date de clôture ; les étapes suivantes repartent du lendemain (prévision à jour).
    if (!startKey || !/^\d{4}-\d{2}-\d{2}$/.test(startKey)) return items.map(() => null);
    let cursor = startKey;
    return items.map(it => {
      const d = typeof it === 'object' && it !== null ? it.days : it;
      const actual = typeof it === 'object' && it !== null && /^\d{4}-\d{2}-\d{2}$/.test(it.actual_end || '') ? it.actual_end : null;
      const days = Math.max(0, parseInt(d, 10) || 0);
      const end = actual || (days > 0 ? Dates.addDays(cursor, days - 1) : cursor);
      if (actual || days > 0) cursor = Dates.addDays(end, 1);
      return { end, actual: !!actual, week: 'S' + Dates.isoWeek(end), isoYear: Dates.isoYear(end) };
    });
  },
  /** Recalcule les semaines automatiques et les dates de clôture prévues d'une liste d'étapes enregistrée. */
  applySchedule(startKey, steps) {
    const plan = Timeline.schedule(startKey, steps), manual = Timeline.manualFlags(steps, plan);
    return steps.map((s, i) => plan[i] ? { ...s, end_date: plan[i].end, week_manual: manual[i], week: manual[i] ? s.week : plan[i].week, planned_end: s.planned_end || plan[i].end }
      : { ...s, week_manual: manual[i] });
  },
  /** Semaine saisie à la main ? Oui si l'indicateur l'indique. Pour les étapes enregistrées avant
      l'indicateur : une semaine différente de l'ancien et du nouveau calcul automatique est manuelle. */
  manualFlags(steps, plan) {
    let cumul = 0;
    return steps.map((s, i) => {
      cumul += parseInt(s.days, 10) || 0;
      if (s.week_manual === true || s.week_manual === false) return s.week_manual;
      return !!s.week && s.week !== Timeline.legacyWeek(cumul) && s.week !== plan[i]?.week;
    });
  },
  /** Semaines à afficher : calcul automatique à jour, sauf semaines saisies à la main. */
  displayWeeks(startKey, steps) {
    const plan = Timeline.schedule(startKey, steps), manual = Timeline.manualFlags(steps, plan);
    return steps.map((s, i) => (manual[i] || !plan[i] ? s.week || '' : plan[i].week));
  },
  /** Écart en jours entre la référence (planned_end) et la clôture prévue ou réelle. null si pas de référence. */
  slipDays(planned, end) { return planned && end ? Dates.diffDays(planned, end) : null; },
  fmtSlip(days) {
    if (days === null || days === undefined || days === 0) return days === 0 ? 'À l\'heure' : '';
    const sign = days > 0 ? '+' : '−', a = Math.abs(days);
    return a >= 7 ? `${sign}${Math.round(a / 7)} sem.` : `${sign}${a} j`;
  },
  /** Prévision du projet : clôture de la dernière étape (recalculée) et sa référence. */
  forecast(p) {
    const steps = Array.isArray(p.timeline_steps) ? p.timeline_steps : [];
    if (!steps.length || !p.start_date) return null;
    const plan = Timeline.schedule(Dates.key(p.start_date), steps);
    const last = plan[plan.length - 1], lastStep = steps[steps.length - 1];
    const planned = lastStep.planned_end || null;
    return { end: last.end, planned, slip: Timeline.slipDays(planned, last.end),
      launchGap: p.launch_date ? Dates.diffDays(Dates.key(p.launch_date), last.end) : null };
  },
  /** Statistiques des tâches reliées à chaque étape d'un projet : clé d'étape → { total, done, open }. */
  taskStats(projectId, tasks) {
    const map = new Map();
    tasks.filter(t => t.project_id === projectId && t.step_key).forEach(t => {
      const k = t.step_key, e = map.get(k) || { total: 0, done: 0, open: 0 };
      e.total++; if (t.status === 'done') e.done++; else e.open++;
      map.set(k, e);
    });
    return map;
  },
  stepKey(step) { return Timeline.norm(step.label || step.name); },
  /** Ancien calcul (semaines du projet, 5 jours par semaine) : sert à reconnaître les
      semaines qui avaient été calculées automatiquement dans les projets existants. */
  legacyWeek(cumulDays) { return 'S' + Math.ceil(cumulDays / 5); },

  /** Étape où se trouve le projet : la première « en cours / à risque », sinon la première non terminée. */
  stage(project) {
    const steps = Timeline.enrich(project.timeline_steps);
    if (!steps.length) return { kind: 'unplanned', steps };
    let i = steps.findIndex(s => s.status === 'current' || s.status === 'warning');
    if (i < 0) i = steps.findIndex(s => s.status !== 'done');
    if (i < 0) return { kind: 'launched', steps };
    return { kind: 'step', step: steps[i], position: i, steps,
      atRisk: steps.some(s => s.status === 'warning') };
  },
};

/* ---------- 5. PERMISSIONS (point unique de décision) ----------
   IMPORTANT : tant que la connexion par mot de passe n'est pas en place, ces règles
   filtrent l'interface et la couche de données de l'application, mais la base
   Supabase elle-même n'est pas encore verrouillée (voir MIGRATION_PDQA.sql, partie B). */
const Perm = {
  canAccessPDQA(user) {
    const allowed = CONFIG.pdqaRoles.map(normalizeRole);
    return !!user && allowed.includes(normalizeRole(user.role));
  },
  canAccessWorkspace(user, ws) { return ws === 'customer' ? !!user : ws === 'pdqa' ? Perm.canAccessPDQA(user) : false; },
  workspacesFor(user) { return Object.keys(CONFIG.workspaces).filter(ws => Perm.canAccessWorkspace(user, ws)); },
  canUseModule(user, ws, module) {
    if (module === 'users') return !!user;
    return Perm.canAccessWorkspace(user, ws) && CONFIG.modules[ws].includes(module);
  },
};

/* ---------- 6. ACCÈS AUX DONNÉES ----------
   Toutes les lectures/écritures passent par Store. Les listes en mémoire contiennent
   TOUJOURS l'ensemble des données ; les vues filtrent sans jamais les remplacer.
   Les lectures « par espace » appliquent les permissions (aucune donnée PDQA ne
   sort de Store pour un utilisateur non autorisé). */
const Store = {
  db: null,
  me: null,
  users: [], projects: [], tasks: [], meetings: [], gateReviews: [], documents: [],
  innovations: [], events: [], mpItems: [],   // modules PDQA (chargés seulement si l'accès PDQA est autorisé)
  // Les migrations ont-elles été exécutées ? (null = inconnu, true/false = constaté)
  schema: { workspace: null, gates: null, documents: null, audit: null, stepKey: null, innovations: null, events: null, mp: null },

  init() {
    if (!window.supabase?.createClient) throw new Error('La librairie Supabase n\'a pas pu être chargée.');
    Store.db = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
  },

  async loadUsers() {
    const { data, error } = await Store.db.from('users').select('*').order('name');
    if (error) throw error;
    Store.users = data || [];
    return Store.users;
  },

  async loadAll() {
    const [u, p, t, m] = await Promise.all([
      Store.db.from('users').select('*').order('name'),
      Store.db.from('projects').select('*').order('created_at', { ascending: false }),
      Store.db.from('tasks').select('*').order('created_at', { ascending: false }),
      Store.db.from('meeting_minutes').select('*').order('meeting_date', { ascending: false }),
    ]);
    const err = u.error || p.error || t.error || m.error;
    if (err) throw err;
    Store.users = u.data || [];
    Store.projects = (p.data || []).map(Store.normalizeProject);
    Store.tasks = t.data || [];
    Store.meetings = m.data || [];
    if (p.data?.length) Store.schema.workspace = Object.prototype.hasOwnProperty.call(p.data[0], 'workspace');
    if (t.data?.length) Store.schema.stepKey = Object.prototype.hasOwnProperty.call(t.data[0], 'step_key');
    await Promise.all([Store.loadOptional('gate_reviews', 'gateReviews', 'gates', 'decision_date'), Store.loadOptional('project_documents', 'documents', 'documents', 'created_at'), PdqaData.loadAll()]);
  },

  /** Charge une table ajoutée par la migration 003 ; si elle n'existe pas encore, l'application continue. */
  async loadOptional(table, key, flag, orderBy) {
    const { data, error } = await Store.db.from(table).select('*').order(orderBy, { ascending: false });
    if (error) { Store.schema[flag] = !isMissingTable(error) && null; Store[key] = []; return; }
    Store.schema[flag] = true; Store[key] = data || [];
  },

  normalizeProject(p) {
    return { ...p, workspace: p.workspace === 'pdqa' ? 'pdqa' : 'customer', pdqa_data: p.pdqa_data || {} };
  },

  /* ---- lecture ---- */
  /** Index par identifiant, reconstruit seulement quand la liste est rechargée (évite des recherches répétées). */
  _idx: new WeakMap(),
  byId(list, id) {
    let map = Store._idx.get(list);
    if (!map || map.size !== list.length) { map = new Map(list.map(x => [x.id, x])); Store._idx.set(list, map); }
    return map.get(id) || null;
  },
  user: id => (id ? Store.byId(Store.users, id) : null),
  project: id => (id ? Store.byId(Store.projects, id) : null),
  task: id => (id ? Store.byId(Store.tasks, id) : null),
  meeting: id => Store.meetings.find(m => m.id === id) || null,
  /** Décisions et documents d'un projet (uniquement si le projet est visible dans l'espace). */
  gateReviewsOf(ws, projectId) { return Store.projectIn(ws, projectId) ? Store.gateReviews.filter(g => g.project_id === projectId) : []; },
  documentsOf(ws, projectId) { return Store.projectIn(ws, projectId) ? Store.documents.filter(d => d.project_id === projectId) : []; },
  /** Dernière décision enregistrée pour une Gate (par date de décision, puis d'enregistrement). */
  lastGateDecision(projectId, gateNo) {
    return Store.gateReviews.filter(g => g.project_id === projectId && Number(g.gate_no) === Number(gateNo))
      .sort((a, b) => cmp(b.decision_date, a.decision_date) || cmp(b.created_at, a.created_at))[0] || null;
  },

  /** Espace auquel appartient une entité (tâche/meeting sans projet = espace client). */
  wsOfProject: p => (p?.workspace === 'pdqa' ? 'pdqa' : 'customer'),
  wsOfTask: t => Store.wsOfProject(Store.project(t.project_id)),
  wsOfMeeting: m => Store.wsOfProject(Store.project(m.project_id)),

  canSee(ws) { return Perm.canAccessWorkspace(Store.me, ws); },
  projectsIn(ws) { return Store.canSee(ws) ? Store.projects.filter(p => Store.wsOfProject(p) === ws) : []; },
  tasksIn(ws) { return Store.canSee(ws) ? Store.tasks.filter(t => Store.wsOfTask(t) === ws) : []; },
  meetingsIn(ws) { return Store.canSee(ws) ? Store.meetings.filter(m => Store.wsOfMeeting(m) === ws) : []; },
  /** Renvoie l'entité seulement si elle appartient à l'espace demandé ET que l'utilisateur y a accès. */
  projectIn(ws, id) { const p = Store.project(id); return p && Store.wsOfProject(p) === ws && Store.canSee(ws) ? p : null; },
  taskIn(ws, id) { const t = Store.task(id); return t && Store.wsOfTask(t) === ws && Store.canSee(ws) ? t : null; },
  meetingIn(ws, id) { const m = Store.meeting(id); return m && Store.wsOfMeeting(m) === ws && Store.canSee(ws) ? m : null; },

  /* ---- écriture : tâches ---- */
  validateTask(payload, ws) {
    const errors = {};
    if (!String(payload.title || '').trim()) errors.title = 'Le titre est obligatoire.';
    if (payload.project_id && !Store.projectIn(ws, payload.project_id)) errors.project_id = 'Projet non disponible dans cet espace.';
    if (ws === 'pdqa' && !payload.project_id) errors.project_id = 'Dans l\'espace PDQA, une tâche doit être rattachée à un projet.';
    if (payload.assignee_id && !Store.user(payload.assignee_id)) errors.assignee_id = 'Responsable inconnu.';
    if (payload.status && !CONFIG.taskStatuses.some(s => s.id === payload.status)) errors.status = 'Statut invalide.';
    if (payload.priority && !CONFIG.taskPriorities[payload.priority]) errors.priority = 'Priorité invalide.';
    if (payload.due_date && !/^\d{4}-\d{2}-\d{2}$/.test(payload.due_date)) errors.due_date = 'Date invalide.';
    return errors;
  },

  async createTask(payload, ws) {
    const errors = Store.validateTask(payload, ws);
    if (Object.keys(errors).length) throw Object.assign(new Error('Formulaire incomplet'), { fields: errors });
    const row = { status: 'todo', priority: 'medium', ...payload, title: payload.title.trim() };
    if (!row.step_key) delete row.step_key;   // n'envoie pas la colonne si elle n'est pas utilisée (base pas encore migrée)
    const { data, error } = await Store.db.from('tasks').insert(row).select().single();
    if (error) throw error;
    Store.tasks.unshift(data);
    Audit.log({ entity: 'task', entityId: data.id, projectId: data.project_id, action: 'create', summary: `Tâche créée : « ${data.title} »` });
    return data;
  },

  /** Met à jour une tâche et vérifie que la base a réellement enregistré la modification. */
  async updateTask(id, patch, ws) {
    const current = Store.taskIn(ws, id);
    if (!current) throw new Error('Tâche introuvable dans cet espace.');
    const errors = Store.validateTask({ ...current, ...patch }, ws);
    if (Object.keys(errors).length) throw Object.assign(new Error(Object.values(errors)[0]), { fields: errors });
    const before = { ...current };
    const body = { ...patch };
    if ('step_key' in body && !body.step_key && !before.step_key) delete body.step_key;
    const { data, error } = await Store.db.from('tasks').update(body).eq('id', id).select();
    if (error) throw error;
    if (!data || !data.length) throw new Error('La base n\'a pas confirmé l\'enregistrement.');
    Object.assign(current, data[0]);
    const changes = Audit.diff(before, current, Audit.taskFields);
    if (changes.length) Audit.log({ entity: 'task', entityId: id, projectId: current.project_id, action: 'update', summary: `Tâche « ${current.title} » modifiée`, changes });
    return current;
  },

  async deleteTask(id, ws) {
    const t = Store.taskIn(ws, id);
    if (!t) throw new Error('Tâche introuvable dans cet espace.');
    const { error } = await Store.db.from('tasks').delete().eq('id', id);
    if (error) throw error;
    Store.tasks = Store.tasks.filter(x => x.id !== id);
    Audit.log({ entity: 'task', entityId: id, projectId: t.project_id, action: 'delete', summary: `Tâche supprimée : « ${t.title} »` });
  },

  async refreshTable(table) {
    if (table === 'gate_reviews') return Store.loadOptional('gate_reviews', 'gateReviews', 'gates', 'decision_date');
    if (table === 'project_documents') return Store.loadOptional('project_documents', 'documents', 'documents', 'created_at');
    const pdqaKey = Object.keys(PdqaData.TABLES).find(k => PdqaData.TABLES[k].table === table);
    if (pdqaKey) return PdqaData.load(pdqaKey);
    const order = { projects: ['created_at', false], tasks: ['created_at', false], meeting_minutes: ['meeting_date', false], users: ['name', true] }[table];
    const { data, error } = await Store.db.from(table).select('*').order(order[0], { ascending: order[1] });
    if (error) throw error;
    if (table === 'projects') Store.projects = (data || []).map(Store.normalizeProject);
    else if (table === 'tasks') Store.tasks = data || [];
    else if (table === 'meeting_minutes') Store.meetings = data || [];
    else Store.users = data || [];
  },
};

/* ---------- 7. HISTORIQUE DES MODIFICATIONS ----------
   Chaque création, modification ou suppression faite dans l'application est inscrite
   dans la table audit_log (qui, quoi, quand, valeurs avant/après). L'inscription ne
   bloque jamais l'action elle-même : si elle échoue, l'action reste enregistrée et
   l'échec est signalé dans la console. */
const Audit = {
  pending: [],
  fmt: {
    status: v => Rules.taskStatus(v).label,
    priority: v => CONFIG.taskPriorities[v]?.label || v,
    user: v => Store.user(v)?.name || (v ? 'utilisateur supprimé' : 'Non assigné'),
    date: v => (v ? Dates.fmt(v) : '—'),
    project: v => Store.project(v)?.project_name || (v ? 'projet supprimé' : 'Aucun'),
    projectStatus: v => CONFIG.projectStatuses[v]?.label || v,
    projectPriority: v => CONFIG.projectPriorities[v] || v,
    text: v => (v === null || v === undefined || v === '' ? '—' : String(v)),
  },
  taskFields: { title: ['Titre', 'text'], status: ['Statut', 'status'], assignee_id: ['Responsable', 'user'], due_date: ['Échéance', 'date'],
    priority: ['Priorité', 'priority'], project_id: ['Projet', 'project'], step_key: ['Étape', 'text'], description: ['Description', 'text'] },
  projectFields: { project_name: ['Nom', 'text'], client_name: ['Client', 'text'], status: ['Statut', 'projectStatus'], priority: ['Priorité', 'projectPriority'],
    start_date: ['Début', 'date'], launch_date: ['Lancement / fin', 'date'], version: ['Version', 'text'], description: ['Description', 'text'] },
  /** Liste des champs modifiés entre deux états : [{ field, label, from, to }]. */
  diff(before, after, fields) {
    const norm = v => (v === undefined || v === '' ? null : v);
    return Object.entries(fields).filter(([k]) => k in after && String(norm(before[k])) !== String(norm(after[k])))
      .map(([k, [label, f]]) => ({ field: k, label, from: Audit.fmt[f](before[k]), to: Audit.fmt[f](after[k]) }));
  },
  /** Différences de timeline d'un projet (statuts d'étapes, semaines, clôtures réelles). */
  timelineDiff(beforeSteps, afterSteps) {
    const out = [], b = new Map(Timeline.enrich(beforeSteps).map(s => [Timeline.stepKey(s), s]));
    Timeline.enrich(afterSteps).forEach(s => {
      const o = b.get(Timeline.stepKey(s));
      if (!o) { out.push({ field: 'step', label: `Étape « ${s.label} »`, from: '—', to: 'ajoutée' }); return; }
      if (o.status !== s.status) out.push({ field: 'step', label: `Étape « ${s.label} »`, from: CONFIG.stepStatuses[o.status].label, to: CONFIG.stepStatuses[s.status].label });
      if ((o.week || '') !== (s.week || '') && (o.week_manual || s.week_manual)) out.push({ field: 'week', label: `Semaine « ${s.label} »`, from: o.week || '—', to: s.week || '—' });
      if ((o.actual_end || '') !== (s.actual_end || '') && s.actual_end) out.push({ field: 'actual', label: `Clôture réelle « ${s.label} »`, from: o.actual_end ? Dates.fmt(o.actual_end) : '—', to: Dates.fmt(s.actual_end) });
      b.delete(Timeline.stepKey(s));
    });
    b.forEach(s => out.push({ field: 'step', label: `Étape « ${s.label} »`, from: 'présente', to: 'supprimée' }));
    return out;
  },
  log({ entity, entityId, projectId, action, summary, changes = [] }) {
    if (Store.schema.audit === false) return Promise.resolve();
    const row = { entity, entity_id: entityId ? String(entityId) : null, project_id: projectId || null, action, summary, changes,
      user_id: Store.me?.id || null, user_name: Store.me?.name || null };
    const p = Promise.resolve(Store.db.from('audit_log').insert(row)).then(({ error } = {}) => {
      if (error) { if (isMissingTable(error)) Store.schema.audit = false; else console.warn('Historique non enregistré :', error.message); }
      else Store.schema.audit = true;
    }).catch(e => console.warn('Historique non enregistré :', e?.message || e));
    Audit.pending.push(p);
    return p;
  },
  /** Attend que les inscriptions en cours soient terminées (avant d'afficher l'historique). */
  flush() { const all = Audit.pending.splice(0); return Promise.all(all); },
  async forProject(projectId, limit = 60) {
    await Audit.flush();
    const { data, error } = await Store.db.from('audit_log').select('*').eq('project_id', projectId).order('created_at', { ascending: false }).limit(limit);
    if (error) { if (isMissingTable(error)) Store.schema.audit = false; return null; }
    Store.schema.audit = true;
    return data || [];
  },
};

/** La table (ou colonne) n'existe pas encore : la migration n'a pas été exécutée. */
function isMissingTable(err) {
  return /does not exist|could not find the table|schema cache|PGRST205|42P01/i.test(String(err?.message || '') + ' ' + String(err?.code || ''));
}

/** Traduit une erreur technique en message compréhensible. */
function friendlyError(err) {
  const msg = String(err?.message || err || '');
  if (/pdqa_innovations|pdqa_events|pdqa_mp_prevalidations|pdqa_ : base/i.test(msg))
    return 'La base n\'est pas encore à jour : exécutez le script MIGRATION_004_MODULES_PDQA.sql dans Supabase.';
  if (/step_key|gate_reviews|project_documents|audit_log|project-docs|bucket not found/i.test(msg))
    return 'La base n\'est pas encore à jour : exécutez le script MIGRATION_003_GATES_DOCUMENTS_HISTORIQUE.sql dans Supabase.';
  if (/exceeded the maximum allowed size|payload too large|entity too large/i.test(msg))
    return `Fichier trop volumineux (${CONFIG.maxDocumentMb} Mo maximum).`;
  if (/failed to fetch|networkerror|load failed/i.test(msg))
    return 'Connexion à la base impossible. Vérifiez le réseau ou réactivez le projet dans Supabase.';
  if (/workspace|pdqa_data|description/i.test(msg) && /column|schema cache/i.test(msg))
    return 'La base n\'est pas encore à jour : exécutez le script MIGRATION_PDQA.sql dans Supabase.';
  if (/JWT|permission|policy|row-level/i.test(msg)) return 'Action refusée par la base de données.';
  return msg || 'Une erreur inattendue est survenue.';
}

/* ==========================================================================
   Jalon — 02 · Interface commune
   Notifications, fenêtres, menus, navigation (routes), coque de l'application,
   connexion, thème, recherche globale, distribution centralisée des actions.
   ========================================================================== */

/* ---------- État de l'application ---------- */
const App = {
  ws: 'customer',     // espace courant
  page: 'home',       // page courante
  param: null,        // identifiant éventuel (projet, meeting…)
  ui: { customer: {}, pdqa: {} },   // préférences de filtres par espace et par page
  /** État de filtres d'une page, mémorisé tant que l'onglet est ouvert. */
  view(page, defaults) {
    const bucket = App.ui[App.ws];
    if (!bucket[page]) bucket[page] = { ...defaults };
    return bucket[page];
  },
};

/* ---------- Notifications ---------- */
const Toast = {
  show(message, type = 'ok') {
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.setAttribute('role', type === 'error' ? 'alert' : 'status');
    el.innerHTML = `${icon(type === 'error' ? 'alert' : 'check')}<span>${esc(message)}</span>`;
    box.appendChild(el);
    setTimeout(() => el.remove(), type === 'error' ? 6000 : 3200);
  },
  error(err) { Toast.show(friendlyError(err), 'error'); },
};

/* ---------- Fenêtres modales et panneau latéral ---------- */
const Overlay = {
  stack: [],
  /** Ouvre une fenêtre. type = 'modal' | 'drawer' | 'cmdk'. Renvoie l'élément de contenu. */
  open(html, { type = 'modal', label = '', onClose } = {}) {
    const host = document.getElementById('overlays');
    const wrap = document.createElement('div');
    wrap.className = 'overlay' + (type === 'drawer' ? ' drawer-overlay' : '');
    const cls = type === 'drawer' ? 'drawer' : type === 'cmdk' ? 'cmdk' : 'modal';
    wrap.innerHTML = `<div class="${cls}" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div>`;
    const panel = wrap.firstElementChild;
    const entry = { wrap, panel, onClose, returnFocus: document.activeElement };
    wrap.addEventListener('mousedown', e => { if (e.target === wrap) Overlay.close(); });
    host.appendChild(wrap);
    Overlay.stack.push(entry);
    const first = panel.querySelector('[autofocus], input, select, textarea, button');
    if (first) setTimeout(() => first.focus(), 30);
    return panel;
  },
  close() {
    const entry = Overlay.stack.pop(); if (!entry) return;
    entry.wrap.remove();
    entry.onClose?.();
    if (entry.returnFocus?.focus && document.contains(entry.returnFocus)) entry.returnFocus.focus();
  },
  closeAll() { while (Overlay.stack.length) Overlay.close(); },
  top() { return Overlay.stack[Overlay.stack.length - 1]?.panel || null; },
  /** Garde le focus clavier dans la fenêtre ouverte. */
  trap(e) {
    const panel = Overlay.top(); if (!panel || e.key !== 'Tab') return;
    const items = [...panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
      .filter(el => !el.disabled && el.offsetParent !== null);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  },
};

/* ---------- Menus contextuels (…) ---------- */
const Menu = {
  closeAll(except) { document.querySelectorAll('.menu').forEach(m => { if (m !== except) m.hidden = true; }); },
  toggle(button) {
    const menu = button.nextElementSibling; if (!menu) return;
    const willOpen = menu.hidden; Menu.closeAll(); menu.hidden = !willOpen;
    button.setAttribute('aria-expanded', String(willOpen));
    if (willOpen) menu.querySelector('button')?.focus();
  },
  html(items) {
    return `<div class="menu-wrap"><button class="btn btn-ghost btn-sm btn-icon" data-action="menu" aria-haspopup="true" aria-expanded="false" aria-label="Plus d'actions">${icon('more')}</button>
      <div class="menu" role="menu" hidden>${items.map(i => `<button role="menuitem" class="${i.danger ? 'danger' : ''}" data-action="${i.action}" ${Object.entries(i.data || {}).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ')}>${icon(i.icon, 'sm')}${esc(i.label)}</button>`).join('')}</div></div>`;
  },
};

/* ---------- Petits composants HTML réutilisables ---------- */
const UI = {
  empty({ icon: ic = 'folder', title, sub = '', action = '' }) {
    return `<div class="empty"><div class="empty-ico">${icon(ic, 'lg')}</div><div class="empty-title">${esc(title)}</div><div class="empty-sub">${esc(sub)}</div>${action}</div>`;
  },
  loading() { return '<div class="spinner" role="status" aria-label="Chargement"></div>'; },
  taskStatusBadge(status) { const s = Rules.taskStatus(status); return `<span class="badge ${s.badge}">${esc(s.label)}</span>`; },
  projectStatusBadge(status) { const s = CONFIG.projectStatuses[status] || { label: status || '—', badge: 'b-neutral' }; return `<span class="badge ${s.badge}">${esc(s.label)}</span>`; },
  taskPriority(p) {
    const pr = CONFIG.taskPriorities[p]; if (!pr) return '<span class="muted">—</span>';
    return `<span class="prio" data-level="${pr.level}"><span class="prio-bars" aria-hidden="true"><i></i><i></i><i></i></span>${esc(pr.label)}</span>`;
  },
  projectPriority(n) {
    const level = Number(n) || 1;
    return `<span class="prio" data-level="${level}"><span class="prio-bars" aria-hidden="true"><i></i><i></i><i></i></span>${esc(CONFIG.projectPriorities[level] || '—')}</span>`;
  },
  due(task) {
    const st = Rules.dueState(task);
    if (st === 'none') return '<span class="due none">Sans échéance</span>';
    const date = Dates.short(task.due_date);
    const txt = { overdue: `En retard · ${date}`, today: 'Aujourd\'hui', soon: `${date} · bientôt`, later: date, done: date }[st];
    const ic = st === 'overdue' ? icon('alert', 'sm') : icon('clock', 'sm');
    return `<span class="due ${st}">${ic}${esc(txt)}</span>`;
  },
  projectDue(p) {
    if (!p.launch_date) return '<span class="due none">—</span>';
    const late = Rules.isProjectLate(p);
    return `<span class="due ${late ? 'overdue' : p.status === 'done' ? 'done' : ''}">${late ? icon('alert', 'sm') : ''}${esc(Dates.fmt(p.launch_date))}${late ? '<span class="sr-only"> (en retard)</span>' : ''}</span>`;
  },
  person(userId, size = 24) {
    const u = Store.user(userId);
    return u ? `<span class="person">${avatar(u, size)}<span class="truncate">${esc(u.name)}</span></span>` : '<span class="muted">Non assigné</span>';
  },
  progress(pct) {
    if (pct === null || pct === undefined) return '<span class="muted small">—</span>';
    return `<div class="progress" role="img" aria-label="Progression ${pct} %"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-val">${pct}%</span></div>`;
  },
  options(list, selected, { placeholder } = {}) {
    return (placeholder !== undefined ? `<option value="">${esc(placeholder)}</option>` : '') +
      list.map(o => `<option value="${esc(o.value)}" ${String(o.value) === String(selected ?? '') ? 'selected' : ''}>${esc(o.label)}</option>`).join('');
  },
  userOptions(selected, placeholder = '— Non assigné —') {
    return UI.options(Store.users.map(u => ({ value: u.id, label: u.name })), selected, { placeholder });
  },
  projectOptions(ws, selected, placeholder) {
    const list = Store.projectsIn(ws).slice().sort((a, b) => (a.status === 'done') - (b.status === 'done') || cmp(a.project_name, b.project_name));
    return UI.options(list.map(p => ({ value: p.id, label: p.project_name + (p.status === 'done' ? ' (terminé)' : '') })), selected, { placeholder });
  },
  sortHeader(label, key, state) {
    const active = state.sort === key;
    const aria = active ? (state.dir === 'asc' ? 'ascending' : 'descending') : 'none';
    const ic = active ? (state.dir === 'asc' ? 'arrow-up' : 'arrow-down') : 'sort';
    return `<th aria-sort="${aria}"><button class="th-sort" data-action="sort" data-key="${key}">${esc(label)}<span class="arrow">${icon(ic, 'sm')}</span></button></th>`;
  },
};

/* ---------- Navigation ---------- */
const Routes = {};   // rempli par les pages : Routes.nom = { module, render(view, param) }

const Router = {
  href(ws, page, param) { return `#/${ws}/${page}${param ? '/' + encodeURIComponent(param) : ''}`; },
  go(ws, page, param) {
    const target = Router.href(ws, page, param);
    if (location.hash === target) Router.render(); else location.hash = target;
  },
  /** Redirection sans ajouter d'entrée dans l'historique. */
  redirect(ws, page) { history.replaceState(null, '', Router.href(ws, page)); Router.renderNow(); },
  parse() {
    const [ws, page, param] = location.hash.replace(/^#\/?/, '').split('/');
    return { ws: ws || 'customer', page: page || 'home', param: param ? decodeURIComponent(param) : null };
  },
  /** Changement de page : transition (glissement vers la droite quand on descend d'un niveau, vers la gauche quand on remonte). */
  render() {
    const depth = Router.depth(Router.parse().page);
    document.documentElement.dataset.nav = depth < (Router._depth ?? 0) ? 'out' : 'in';
    Router._depth = depth;
    const animate = document.startViewTransition && Store.me && document.getElementById('view') && !matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (animate) document.startViewTransition(() => Router.renderNow()); else Router.renderNow();
  },
  /** Profondeur de chaque page dans la navigation « poupées russes ». */
  depth(page) {
    return { home: 0, me: 1, projects: 1, tasks: 1, calendar: 1, meetings: 1, analytics: 1, users: 1, innovation: 1, events: 1, planning: 1, mp: 1,
      event: 4, 'event-edit': 5, kanban: 2, 'projects-board': 2, 'projects-all': 2,
      'projects-by': 2, 'tasks-by': 2, 'tasks-all': 2, 'projects-group': 3, 'tasks-group': 3, project: 4, meeting: 4, 'project-edit': 5, 'meeting-edit': 5 }[page] ?? 2;
  },
  renderNow() {
    if (!Store.me) return Login.render();
    let { ws, page, param } = Router.parse();
    if (!CONFIG.workspaces[ws]) return Router.redirect('customer', 'home');
    // Garde d'accès : un accès direct par URL à l'espace PDQA est refusé.
    if (!Perm.canAccessWorkspace(Store.me, ws)) {
      Toast.show('L\'espace PDQA est réservé aux fonctions Quality & R&D Project Lead et PDQA Manager.', 'error');
      return Router.redirect('customer', 'home');
    }
    const route = Routes[page];
    if (!route || !Perm.canUseModule(Store.me, ws, route.module)) return Router.redirect(ws, 'home');
    App.ws = ws; App.page = page; App.param = param;
    Menu.closeAll(); Overlay.closeAll();
    Shell.render();
    const view = document.getElementById('view');
    view.classList.remove('is-entering'); void view.offsetWidth; view.classList.add('is-entering');
    clearTimeout(Router._enterTimer); Router._enterTimer = setTimeout(() => view.classList.remove('is-entering'), 1400);
    try { route.render(view, param); }
    catch (err) { console.error(err); view.innerHTML = UI.empty({ icon: 'alert', title: 'Cette page n\'a pas pu s\'afficher', sub: friendlyError(err) }); }
    document.getElementById('main')?.scrollTo?.(0, 0);
    view.querySelector('h1')?.focus({ preventScroll: true });
  },
  /** Ré-affiche la page courante (après une modification). */
  refresh() { const view = document.getElementById('view'); if (view && Routes[App.page]) Routes[App.page].render(view, App.param); Shell.updateCounts(); },
};

/** En-tête de page standard. */
function pageHeader({ title, sub = '', actions = '', crumbs = null }) {
  if (crumbs && crumbs[0]?.page !== 'home') crumbs = [{ page: 'home', label: 'Accueil' }, ...crumbs];
  const bc = crumbs ? `<nav class="breadcrumb" aria-label="Fil d'Ariane">${crumbs.map((c, i) => i < crumbs.length - 1
    ? `<a href="${Router.href(App.ws, c.page, c.param)}">${esc(c.label)}</a>${icon('right', 'sm')}` : `<span>${esc(c.label)}</span>`).join('')}</nav>` : '';
  return `<header class="page-header"><div>${bc}<h1 class="page-title" tabindex="-1">${esc(title)}</h1>${sub ? `<p class="page-sub">${esc(sub)}</p>` : ''}</div><div class="page-actions">${actions}</div></header>`;
}

/* ---------- Coque : bandeau bleu nuit + barre des modules (bureau) / onglets (mobile) ---------- */
const Shell = {
  /** Modules affichés dans la barre d'onglets du téléphone ; les autres passent dans « Plus ». */
  TAB_MODULES: ['home', 'projects', 'tasks', 'calendar'],
  TAB_LABELS: { home: 'Accueil' },
  render() {
    const root = document.getElementById('root');
    document.body.dataset.workspace = App.ws;
    if (!root.querySelector('.app')) {
      root.innerHTML = `<div class="app"><header class="topbar" id="topbar"></header>
        <nav class="modbar" id="modbar" aria-label="Modules"></nav>
        <div class="main" id="main"><main id="view"></main></div>
        <nav class="tabbar" id="tabbar" aria-label="Navigation principale"></nav></div>`;
    }
    const me = Store.me, w = CONFIG.workspaces[App.ws];
    const current = m => Routes[App.page]?.module === m;

/* ---------- Mode projection (réunions) : texte agrandi, mémorisé sur cet appareil ---------- */
const Projection = {
  KEY: 'jalonProjection',
  on() { return document.body.classList.contains('is-projection'); },
  init() { let v = null; try { v = localStorage.getItem(Projection.KEY); } catch (e) { /* stockage indisponible */ } document.body.classList.toggle('is-projection', v === '1'); },
  toggle() {
    const on = !Projection.on();
    document.body.classList.toggle('is-projection', on);
    try { localStorage.setItem(Projection.KEY, on ? '1' : '0'); } catch (e) { /* ignore */ }
    Shell.render();
    Toast.show(on ? 'Mode projection activé.' : 'Mode projection désactivé.');
  },
};

/* ---------- Thème ---------- */
const Theme = {
  KEY: 'pmTheme',
  init() { let v = null; try { v = localStorage.getItem(Theme.KEY); } catch (e) { /* stockage indisponible */ } document.body.classList.toggle('theme-dark', v === 'dark'); },
  toggle() {
    const dark = !document.body.classList.contains('theme-dark');
    document.body.classList.toggle('theme-dark', dark);
    try { localStorage.setItem(Theme.KEY, dark ? 'dark' : 'light'); } catch (e) { /* ignore */ }
    Router.render();
  },
};

/* ---------- Connexion (sélection de l'utilisateur) ----------
   Provisoire : sera remplacée par Supabase Auth (email + mot de passe). */
const Session = {
  KEY: 'ph-user',
  save(id) { try { sessionStorage.setItem(Session.KEY, id); } catch (e) { /* ignore */ } },
  read() { try { return sessionStorage.getItem(Session.KEY); } catch (e) { return null; } },

};

const Login = {
  async render() {
    document.body.dataset.workspace = 'customer';
    const root = document.getElementById('root');
    root.innerHTML = `<div class="login"><div class="card login-card">
      <div class="login-brand"><span class="brand-mark lg" aria-hidden="true"></span><div><div class="brand-name">${esc(CONFIG.appName)}</div><div class="muted small">${esc(CONFIG.appTagline)}</div></div></div>
      <h1 class="modal-title" tabindex="-1">Qui êtes-vous ?</h1>
      <div class="login-list" id="loginList">${UI.loading()}</div>
      <button class="btn btn-glass" style="width:100%" data-action="new-user" data-from="login">${icon('plus', 'sm')}Ajouter un utilisateur</button>
    </div></div>`;
    try {
      const users = await Store.loadUsers();
      const list = document.getElementById('loginList'); if (!list) return;
      list.innerHTML = users.length ? users.map(u => `<button class="user-btn" data-action="login" data-id="${esc(u.id)}">${avatar(u, 36)}<span><span class="cell-title" style="display:block">${esc(u.name)}</span><span class="muted small">${esc(u.role || '')}</span></span></button>`).join('')

    }

  async as(id) {

    const { ws } = Router.parse();

/* ---------- Recherche globale (Ctrl/Cmd + K), limitée à l'espace courant ---------- */
const Search = {
  results: [], index: -1,
  open() {
    const panel = Overlay.open(`<div class="cmdk-input">${icon('search')}<input id="cmdkInput" type="search" placeholder="Rechercher dans ${esc(CONFIG.workspaces[App.ws].short)}…" autocomplete="off" aria-label="Rechercher" autofocus><span class="kbd">Échap</span></div>
      <div class="cmdk-results" id="cmdkResults" role="listbox"><div class="empty-sub" style="padding:24px;text-align:center">${App.ws === 'pdqa' ? 'Projets, tâches, comptes-rendus, idées, événements et matières premières.' : 'Projets, tâches et comptes-rendus de cet espace.'}</div></div>`, { type: 'cmdk', label: 'Recherche' });
    panel.querySelector('#cmdkInput').addEventListener('input', e => Search.run(e.target.value));
    panel.querySelector('#cmdkInput').addEventListener('keydown', Search.keys);
  },
  run(q) {
    q = q.toLowerCase().trim();
    const box = document.getElementById('cmdkResults'); if (!box) return;
    if (!q) { box.innerHTML = '<div class="empty-sub" style="padding:24px;text-align:center">Commencez à taper pour rechercher.</div>'; return; }
    const ws = App.ws;
    const hit = s => String(s || '').toLowerCase().includes(q);
    const groups = [
      ['Projets', Store.projectsIn(ws).filter(p => hit(p.project_name) || hit(p.client_name) || hit(p.pdqa_data?.department)).slice(0, 5)
        .map(p => ({ action: 'open-project', id: p.id, ic: 'folder', title: p.project_name, sub: p.client_name || p.pdqa_data?.department || '' }))],
      ['Tâches', Store.tasksIn(ws).filter(t => hit(t.title)).slice(0, 6)
        .map(t => ({ action: 'edit-task', id: t.id, ic: 'check', title: t.title, sub: [Store.project(t.project_id)?.project_name, Store.user(t.assignee_id)?.name].filter(Boolean).join(' · ') }))],
      ['Meeting Minutes', Store.meetingsIn(ws).filter(m => hit(m.team_name)).slice(0, 4)
        .map(m => ({ action: 'open-meeting', id: m.id, ic: 'notes', title: m.team_name, sub: Dates.fmt(m.meeting_date) }))],
      ...(ws === 'pdqa' ? [
        ['Innovation', PdqaData.list('innovations').filter(i => hit(i.title) || hit(i.target)).slice(0, 4)
          .map(i => ({ action: 'inno-edit', id: i.id, ic: 'bulb', title: i.title, sub: Innovation.stage(i.stage).label }))],
        ['Visites / Workshop / Salon', PdqaData.list('events').filter(e => hit(e.title) || hit(e.location) || hit(e.organizer)).slice(0, 4)
          .map(e => ({ action: 'open-event', id: e.id, ic: 'pin', title: e.title, sub: `${Events.type(e.type).label} · ${Events.dates(e)}` }))],
        ['Prévalidation MP', PdqaData.list('mpItems').filter(i => hit(i.material_name) || hit(i.supplier) || hit(i.internal_code)).slice(0, 4)
          .map(i => ({ action: 'mp-edit', id: i.id, ic: 'flask', title: i.material_name, sub: [i.supplier, Mp.status(i.status).label].filter(Boolean).join(' · ') }))],
      ] : []),
    ].filter(([, items]) => items.length);
    Search.results = groups.flatMap(([, items]) => items); Search.index = -1;
    if (!groups.length) { box.innerHTML = `<div class="empty-sub" style="padding:24px;text-align:center">Aucun résultat pour « ${esc(q)} ».</div>`; return; }
    let i = 0;
    box.innerHTML = groups.map(([label, items]) => `<div class="cmdk-group">${esc(label)}</div>` + items.map(r =>
      `<button class="cmdk-item" role="option" data-idx="${i++}" data-action="search-pick" data-target="${r.action}" data-id="${esc(r.id)}">${icon(r.ic)}<span class="grow"><span class="cell-title" style="display:block">${esc(r.title)}</span><span class="cell-sub">${esc(r.sub)}</span></span></button>`).join('')).join('');
  },
  keys(e) {
    const items = [...document.querySelectorAll('.cmdk-item')]; if (!items.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      Search.index = e.key === 'ArrowDown' ? Math.min(Search.index + 1, items.length - 1) : Math.max(Search.index - 1, 0);
      items.forEach((el, i) => el.setAttribute('aria-selected', String(i === Search.index)));
      items[Search.index].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && Search.index >= 0) { e.preventDefault(); items[Search.index].click(); }
  },
};

/* ---------- Distribution centralisée des actions ----------
   Chaque élément cliquable porte data-action="nom". Aucun gestionnaire « onclick »
   n'est écrit dans le HTML (cause historique de bugs de guillemets). */
const Actions = {
  go: el => Router.go(App.ws, el.dataset.page, el.dataset.param),
  'switch-ws': el => Router.go(el.dataset.ws, 'home'),
  menu: el => Menu.toggle(el),
  login: el => Login.as(el.dataset.id),
  logout: () => Login.logout(),
  'toggle-theme': () => Theme.toggle(),
  'toggle-projection': () => Projection.toggle(),
  'open-more': () => Shell.openMore(),
  'open-search': () => Search.open(),
  'close-overlay': () => Overlay.close(),
  'search-pick': el => { Overlay.close(); Actions[el.dataset.target]?.(el); },
  'open-project': el => Router.go(el.dataset.ws || App.ws, 'project', el.dataset.id),
  'open-meeting': el => Router.go(App.ws, 'meeting', el.dataset.id),
};
const ChangeActions = {};   // data-change="nom" (listes déroulantes, cases à cocher)
const InputActions = {};    // data-input="nom"  (champs de recherche)

function installGlobalHandlers() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!e.target.closest('.menu-wrap')) Menu.closeAll();
    if (!el || el.disabled) return;
    const fn = Actions[el.dataset.action];
    if (fn) { e.preventDefault(); if (el.closest('.menu')) Menu.closeAll(); fn(el, e); }
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-change]');
    if (el && ChangeActions[el.dataset.change]) ChangeActions[el.dataset.change](el, e);
  });
  let timer = null;
  document.addEventListener('input', e => {
    const el = e.target.closest('[data-input]'); if (!el || !InputActions[el.dataset.input]) return;
    clearTimeout(timer); timer = setTimeout(() => InputActions[el.dataset.input](el, e), 140);
  });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && Store.me) { e.preventDefault(); if (!Overlay.top()) Search.open(); }
    if (e.key === 'Escape') { if (Overlay.top()) Overlay.close(); else Menu.closeAll(); }
    Overlay.trap(e);
  });
  window.addEventListener('hashchange', () => Router.render());
}
